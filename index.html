<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>SD40 – Carte + Procédure (IOTA/BCAE/Phyto + NATINF + Validateur)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Leaflet & plugins CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

<style>
  html,body{height:100%;margin:0;background:#0b1220}
  #map{height:100%;}

  /* Hide helper */
  [hidden]{display:none !important}

  /* ======= Modern buttons ======= */
  :root{
    --bg-surface:#0b1220;
    --panel:#0f172a;
    --panel-2:#111827;
    --muted:#94a3b8;
    --border:#1f2a44;
    --txt:#e5e7eb;
    --primaryA:#ef4444;   /* Autorisation */
    --primaryD:#f59e0b;   /* Déclaration */
    --primaryHN:#e2e8f0;  /* Hors nom. */
    --accent:#60a5fa;
    --ok:#22c55e;
  }

  .btn{
    -webkit-tap-highlight-color:transparent;
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.7rem 1rem;border-radius:999px;border:1px solid var(--border);
    background:linear-gradient(180deg,#141c2f,#0e1628);
    color:var(--txt);font:600 14px/1 system-ui,Segoe UI,Roboto,Arial;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    transition:transform .05s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 10px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
  .btn:active{transform:translateY(0)}
  .btn .badge-dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:#64748b}
  .btn .count{background:#0ea5e9;color:#fff;border-radius:999px;padding:.1rem .45rem;font:700 12px/1 system-ui}
  .btn.glass{
    background:rgba(255,255,255,.06);
    backdrop-filter: blur(6px);
    border-color:rgba(255,255,255,.08);
  }
  .btn.eval{
    background:linear-gradient(135deg,#1d3557,#0b2239);
    border-color:#1f2a44;
  }
  .btn.eval.loading{position:relative;pointer-events:none;opacity:.85}
  .btn.eval.loading::after{
    content:""; position:absolute; right:12px; width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Eval result tints on button */
  .btn.eval.autorisation{ background:linear-gradient(135deg,#7f1d1d,#991b1b); border-color:#b91c1c }
  .btn.eval.declaration { background:linear-gradient(135deg,#7c2d12,#a16207); border-color:#d97706 }
  .btn.eval.hors         { background:linear-gradient(135deg,#334155,#0b2239); border-color:#334155 }

  /* Layers list – wide & touchable */
  .leaflet-control-layers-expanded{max-height:70vh;overflow:auto}
  .leaflet-control-layers .leaflet-control-layers-list label{
    display:flex; align-items:center; gap:10px; line-height:1.3;
    padding:6px 8px; font-size:14px; color:#0b1220;
  }
  .leaflet-control-layers-overlays input[type="checkbox"]{width:18px;height:18px;margin-left:0}

  /* Layer toggle pill */
  .layer-toggle-wrap.leaflet-control{
    background:#111827;color:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);
    overflow:hidden;border:1px solid #0b1220
  }
  .layer-toggle-btn{
    display:flex;align-items:center;gap:10px;padding:10px 14px;font:600 14px system-ui;
    color:#fff;background:#111827;border:0;cursor:pointer
  }
  .layer-toggle-btn:hover{background:#0f172a}

  /* Tool buttons (Leaflet bar) */
  .tool-btn.leaflet-bar a{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;font:20px/1.1 system-ui; text-decoration:none; user-select:none;
  }
  .tool-btn.leaflet-bar a.active{background:#1f78b4;color:#fff}

  /* Popups */
  .popup-card{font:14px/1.35 system-ui,Segoe UI,Roboto,Arial;max-width:360px}
  .popup-title{font-weight:700;margin:0 0 .25rem}
  .popup-table{width:100%;border-collapse:collapse;font-size:13px}
  .popup-table th{white-space:nowrap;text-align:left;color:#22313f;font-weight:600;padding:.25rem .5rem .25rem 0;border-bottom:1px solid #eef}
  .popup-table td{padding:.25rem 0;border-bottom:1px solid #f2f4f7;word-break:break-word}
  .measure-label{
    background:#0b2239;color:#fff;padding:4px 6px;border-radius:4px;
    font:12px/1.2 system-ui; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  @media (max-width:480px){ .popup-card{max-width:90vw} }

  /* Hide all tools quickly */
  body.tools-hidden .leaflet-draw,
  body.tools-hidden .tool-btn { display:none !important; }

  /* Toggle tools button */
  .tools-toggle.leaflet-control{
    background:#111827;color:#fff;border:1px solid #0b1220;border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.35); overflow:hidden
  }
  .tools-toggle button{
    display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;
    background:#111827;color:#fff;border:0;cursor:pointer;font:600 14px system-ui
  }
  .tools-toggle button:hover{background:#0f172a}

  /* ===== Procédure drawer ===== */
  .proc-drawer{position:absolute;right:10px;top:70px;z-index:4000;
    width:min(520px,96vw); max-height:80vh; display:flex; flex-direction:column;
    background:#0f172a; color:#e5e7eb; border:1px solid #1f2a44; border-radius:12px; box-shadow:0 16px 32px rgba(0,0,0,.45); overflow:hidden}
  .proc-header{display:flex;gap:8px;align-items:center;justify-content:space-between;
    padding:10px 12px;background:#0b2239;color:#fff;font:600 14px system-ui}
  .proc-tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #1f2a44; flex-wrap:wrap}
  .proc-tabs button{border:1px solid #1f2a44;background:#111827;color:#e5e7eb;padding:6px 10px;border-radius:8px;cursor:pointer}
  .proc-tabs button.active{background:#0b2239;border-color:#0b2239}
  .proc-body{padding:10px;overflow:auto}
  .proc-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .proc-row > *{flex:1 1 180px}
  .proc-body input,.proc-body textarea,.proc-body select{
    background:#0b1220;border:1px solid #1f2a44;border-radius:8px;color:#e5e7eb;padding:.55rem .6rem; font:14px system-ui
  }
  .proc-actions{display:flex;gap:8px;justify-content:flex-end;padding:10px;border-top:1px solid #1f2a44;background:#0b1220}
  .badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#1f2a44;color:#cbd5e1;font-weight:600;font-size:12px}
  .note{font-size:12px;color:#94a3b8}
  .pill{display:inline-inline;padding:2px 8px;border-radius:999px;background:#e2e8f0;color:#0b2239;font-weight:700}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:6px;font-size:13px}
  .kv b{color:#cbd5e1}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;color:#cbd5e1}

  /* Color-coded regime pill */
  .pill.autorisation{background:#fecaca;color:#7f1d1d}
  .pill.declaration{background:#fde68a;color:#7c2d12}
  .pill.hors{background:#e2e8f0;color:#0b2239}

  /* ===== Mobile action bar ===== */
  .action-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:5000;
    display:flex;gap:.5rem;justify-content:space-between;align-items:center;
    padding:.55rem .6rem;background:linear-gradient(180deg,rgba(11,18,32,.15),rgba(11,18,32,.85));
    backdrop-filter: blur(8px); border-top:1px solid rgba(255,255,255,.08)
  }
  .action-bar .btn{flex:1 1 auto; justify-content:center}
  .action-bar .btn .label{display:none}
  @media (min-width:880px){ .action-bar{display:none} .action-bar .btn .label{display:inline} }

  /* ===== Croquis overlay ===== */
  .sketch-overlay{
    position:absolute; inset:0; z-index:3500; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35)
  }
  .sketch-board{
    position:relative; background:#0b1220; border:1px solid #1f2a44; border-radius:12px; box-shadow:0 18px 36px rgba(0,0,0,.5);
    width:min(96vw,900px); height:min(75vh,620px); overflow:hidden; display:flex; flex-direction:column
  }
  .sketch-toolbar{
    display:flex; gap:.5rem; align-items:center; padding:.5rem; background:#0b2239; color:#fff; border-bottom:1px solid #1f2a44
  }
  .sketch-toolbar .btn{padding:.45rem .8rem}
  .sketch-canvas-wrap{position:relative; flex:1; background:#111827}
  .sketch-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .sketch-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.6 }

  /* Accessible focus */
  .btn:focus-visible{outline:2px solid #60a5fa; outline-offset:2px}
</style>
</head>
<body>
<div id="map"></div>

<!-- ===================== UI Procédure ===================== -->
<div id="proc" class="proc-drawer" hidden>
  <div class="proc-header">
    <span>🗂️ Procédure terrain</span>
    <div style="display:flex;gap:8px">
      <button id="btnRules" type="button" class="btn glass" title="Éditer les règles IOTA (JSON)">⚙️ Règles IOTA</button>
      <button id="btnProcClose" type="button" class="btn glass" title="Fermer le panneau">Fermer</button>
    </div>
  </div>

  <div class="proc-tabs">
    <button data-tab="iota" class="active btn glass" type="button">IOTA</button>
    <button data-tab="bcae" class="btn glass" type="button">BCAE</button>
    <button data-tab="phyto" class="btn glass" type="button">Phyto</button>
    <button data-tab="autre" class="btn glass" type="button">Autre</button>
    <button data-tab="validator" class="btn glass" type="button">Validateur IOTA</button>
  </div>

  <div class="proc-body">
    <!-- IOTA -->
    <div class="tab" id="tab-iota">
      <div class="proc-row"><input id="iotaSearch" placeholder="Rechercher rubrique (ex : 3.2.3.0, ‘plans d’eau’)" /></div>
      <div id="iotaList"></div>
      <div class="note">Cliquer une rubrique la copie dans la fiche et dans le validateur. Appui long sur ⚙️ pour réinstaller les règles intégrées.</div>
    </div>

    <!-- BCAE -->
    <div class="tab" id="tab-bcae" hidden>
      <div class="proc-row"><input id="bcaeSearch" placeholder="Mot-clé (ex: ‘zone humide’, ‘drainage’, ‘nitrates’)" /></div>
      <div id="bcaeList"></div>
    </div>

    <!-- Phyto -->
    <div class="tab" id="tab-phyto" hidden>
      <div class="proc-row"><input id="phytoSearch" placeholder="Mot-clé (ex: ‘phytopharmaceutique’, ‘certificat’, ‘néonicotinoïdes’)" /></div>
      <div id="phytoList"></div>
    </div>

    <!-- Autre -->
    <div class="tab" id="tab-autre" hidden>
      <div class="proc-row"><input id="autreSearch" placeholder="Recherche NATINF (mot-clé ou code)"/></div>
      <div id="autreList"></div>
    </div>

    <!-- VALIDATEUR IOTA -->
    <div class="tab" id="tab-validator" hidden>
      <div class="proc-row">
        <input id="valRubrique" placeholder="Rubrique IOTA (ex : 3.2.3.0)" />
        <select id="valGeom"><option value="point">Point</option><option value="line">Ligne</option><option value="polygon">Polygone</option></select>
      </div>
      <div id="valParams" class="proc-row"></div>
      <div class="proc-row" style="align-items:center">
        <button id="btnEval" type="button" class="btn eval">⚖️ <span class="label">Évaluer le régime</span></button>
        <span id="valResult" class="pill hors">—</span>
      </div>
      <div id="valTrace" class="mono"></div>
    </div>

    <hr style="border-color:#1f2a44;border-top-width:0">
    <!-- Fiche terrain -->
    <div class="proc-row"><input id="ftTitre" placeholder="Titre de l’intervention" /></div>
    <div class="proc-row"><input id="ftLieu" placeholder="Lieu / commune" /></div>
    <div class="proc-row"><textarea id="ftDesc" rows="4" placeholder="Constats, mesures, éléments matériels, témoins…"></textarea></div>
    <div class="proc-row">
      <input id="ftRefIota" placeholder="Rubrique IOTA retenue" />
      <input id="ftRefNatinf" placeholder="NATINF retenu (codes séparés par des virgules)" />
    </div>
    <div class="kv">
      <b>Coordonnées :</b> <span class="badge" id="ftLatLng">—</span>
      <b>Complétude :</b> <span class="badge" id="ftScore">—</span>
    </div>
  </div>

  <div class="proc-actions">
    <button id="btnResetAll" type="button" class="btn glass" style="margin-right:auto">↺ Remettre à zéro</button>
    <button id="btnProcPDF" type="button" class="btn">📝 Exporter PDF</button>
    <button id="btnProcGJ"  type="button" class="btn glass">🧭 Exporter GeoJSON</button>
  </div>
</div>

<!-- Bouton flottant Procédure -->
<div class="layer-toggle-wrap leaflet-control" style="position:absolute;right:10px;top:110px;z-index:3000;">
  <button id="btnProcOpen" class="layer-toggle-btn" type="button"><span class="icon">🗂️</span><span class="label">Procédure</span></button>
</div>

<!-- ===== Action bar (mobile) ===== -->
<div class="action-bar" id="actionBar">
  <button id="barLocate"   class="btn glass" title="Me localiser">📍<span class="label">Localiser</span></button>
  <button id="barPhoto"    class="btn glass" title="Prendre une photo">📷<span class="count" id="countPhotos">0</span></button>
  <button id="barSketch"   class="btn glass" title="Croquis">✏️<span class="count" id="countSketches">0</span></button>
  <button id="barEval"     class="btn eval"  title="Évaluer">⚖️</button>
  <button id="barPDF"      class="btn"       title="Exporter PDF">📝</button>
</div>

<!-- ===== Croquis modal ===== -->
<div class="sketch-overlay" id="sketchOverlay" aria-hidden="true">
  <div class="sketch-board" role="dialog" aria-modal="true" aria-labelledby="sketchTitle">
    <div class="sketch-toolbar">
      <strong id="sketchTitle">Croquis</strong>
      <span class="note" id="sketchInfo" style="margin-left:.25rem">Fond : carte (snapshot)</span>
      <div style="flex:1"></div>
      <button class="btn glass" id="sketchBgToggle" type="button">🖼️ Fond : carte</button>
      <button class="btn glass" id="sketchEraser"    type="button">🧽 Gomme</button>
      <button class="btn glass" id="sketchClear"     type="button">🧹 Tout effacer</button>
      <button class="btn glass" id="sketchCancel"    type="button">✖️ Annuler</button>
      <button class="btn"       id="sketchSave"      type="button">✅ Enregistrer</button>
    </div>
    <div class="sketch-canvas-wrap">
      <img id="sketchBg" class="sketch-bg" alt="">
      <canvas id="sketchCanvas" class="sketch-canvas"></canvas>
    </div>
  </div>
</div>

<!-- Photo input (caché) -->
<input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden>

<!-- ========= PACK IOTA intégré ========= -->
<script type="application/json" id="iota-pack-officiel">
{
  "iota": [
    {"code":"1.1.1.0","titre":"Sondage, forage (non domestique) – recherche/surveillance d’eaux souterraines"},
    {"code":"1.1.2.0","titre":"Prélèvements en eaux souterraines (volume annuel)"},
    {"code":"1.2.1.0","titre":"Prélèvements en cours d’eau/nappe d’accompagnement/plan-canal alimenté"},
    {"code":"1.2.2.0","titre":"Prélèvements quand l’étiage est majoritairement réalimenté artificiellement"},
    {"code":"1.3.1.0","titre":"Prélèvements en zone à seuils abaissés (répartition quantitative)"},
    {"code":"2.1.1.0","titre":"Assainissement collectif / ANC (charge DBO5)"},
    {"code":"2.1.3.0","titre":"Épandage/stockage de boues en vue d’épandage"},
    {"code":"2.1.4.0","titre":"Épandage/stockage d’effluents ou de boues (hors 2.1.3.0, effluents d’élevage)"},
    {"code":"2.1.5.0","titre":"Rejet d’eaux pluviales (surface interceptée)"},
    {"code":"2.2.1.0","titre":"Rejet susceptible de modifier le régime des eaux en surface"},
    {"code":"2.2.3.0","titre":"Rejet en surface – flux ≥ niveau R1 pour ≥1 paramètre"},
    {"code":"2.3.1.0","titre":"Rejets d’effluents sur le sol/sous-sol (hors 2.1.5.0, etc.)"},
    {"code":"2.3.2.0","titre":"Recharge artificielle des eaux souterraines"},
    {"code":"3.1.1.0","titre":"Obstacle crues / continuité écologique (différence de niveau)"},
    {"code":"3.1.2.0","titre":"Modification profil en long/transversal – dérivation d’un cours d’eau"},
    {"code":"3.1.3.0","titre":"Impact sensible sur la luminosité (longueur)"},
    {"code":"3.1.4.0","titre":"Consolidation/protection de berges (non végétal)"},
    {"code":"3.1.5.0","titre":"Destruction de frayères / zones de croissance/alimentation"},
    {"code":"3.2.1.0","titre":"Entretien de cours d’eau/canaux – volume de sédiments"},
    {"code":"3.2.2.0","titre":"Installations/ouvrages/remblais dans le lit majeur – surface soustraite"},
    {"code":"3.2.3.0","titre":"Plans d’eau (création)"},
    {"code":"3.2.5.0","titre":"Barrages de retenue (classement R.214-112) – y compris vidange (dans l’acte)"},
    {"code":"3.2.6.0","titre":"Ouvrages de prévention inondations/submersions (SE / aménagement hydraulique)"},
    {"code":"3.2.7.0","titre":"Piscicultures d’eau douce (L.431-6)"},
    {"code":"3.3.1.0","titre":"Zones humides : assèchement/mise en eau/imperméabilisation/remblais"},
    {"code":"3.3.2.0","titre":"Drainage (surface drainée)"},
    {"code":"3.3.3.0","titre":"Canalisations hydrocarbures/produits chimiques liquides"},
    {"code":"3.3.4.0","titre":"Recherche/stockage souterrain de déchets radioactifs"},
    {"code":"3.3.5.0","titre":"Travaux de restauration fonctionnelle des milieux aquatiques"},
    {"code":"4.1.1.0","titre":"Travaux portuaires/chenal d’accès (création / modification)"},
    {"code":"4.1.2.0","titre":"Aménagements portuaires (montant des travaux)"},
    {"code":"4.1.3.0","titre":"Dragage et/ou rejet en milieu marin (teneurs/volumes/distance)"},
    {"code":"5.1.1.0","titre":"Réinjection dans la même nappe (géothermie, exhaures, génie civil)"},
    {"code":"5.1.2.0","titre":"Recherche/exploitation de gîtes géothermiques"},
    {"code":"5.1.3.0","titre":"Travaux miniers – recherches, cavités, forages, essais"},
    {"code":"5.1.4.0","titre":"Travaux d’exploitation de mines"},
    {"code":"5.1.5.0","titre":"Exploitation de stockages souterrains de déchets radioactifs"},
    {"code":"5.1.6.0","titre":"Travaux de recherches des mines"},
    {"code":"5.1.7.0","titre":"Prospection/exploitation de substances minérales/fossiles en fonds marins"},
    {"code":"5.2.2.0","titre":"Concessions hydrauliques (Livre V code de l’énergie)"},
    {"code":"5.2.3.0","titre":"Travaux commission d’aménagement foncier (listés)"},
    {"code":"5.2.4.0","titre":"Travaux d’exploitation de mines – autorisation L.621-4-1"}
  ],
  "rules": {
    "1.1.1.0": { "label":"Sondage/forage non domestique (recherche/surveillance d’eaux souterraines)","params":[],"logic":[{"else":"D"}],"ref":"R.214-1 1.1.1.0" },
    "1.1.2.0": { "label":"Prélèvements en eaux souterraines (volume annuel)","params":[{"id":"volume_m3_an","label":"Volume prélevé (m³/an)","type":"number"}],
      "logic":[{"if":"volume_m3_an >= 200000","regime":"A","ref":"A ≥ 200 000 m³/an"},{"if":"volume_m3_an > 10000 && volume_m3_an < 200000","regime":"D","ref":"10 000–200 000 m³/an"},{"else":"HN"}],
      "ref":"R.214-1 1.1.2.0" },
    "1.2.1.0": { "label":"Prélèvements en cours d’eau/nappe d’accompagnement/plan-canal alimenté",
      "params":[{"id":"capacite_m3_h","label":"Capacité (m³/h)","type":"number"},{"id":"part_pct_debit","label":"Part du débit du cours d’eau (%)","type":"number"}],
      "logic":[{"if":"capacite_m3_h >= 1000 || part_pct_debit >= 5","regime":"A","ref":"A ≥ 1000 m³/h ou ≥ 5 %"},{"if":"(capacite_m3_h >= 400 && capacite_m3_h < 1000) || (part_pct_debit >= 2 && part_pct_debit < 5)","regime":"D","ref":"400–1000 m³/h ou 2–5 %"},{"else":"HN"}],
      "ref":"R.214-1 1.2.1.0" },
    "1.2.2.0": { "label":"Prélèvements avec étiage majoritairement réalimenté artificiellement",

      "logic":[{"if":"rivieres == 'oui' && capacite_m3_h > 80","regime":"A","ref":"Seine/Loire/Marne/Yonne : A si > 80 m³/h"},{"if":"rivieres == 'oui' && capacite_m3_h <= 80","regime":"HN","ref":"Seine/Loire/Marne/Yonne : ≤ 80 m³/h = HN"},{"if":"rivieres != 'oui'","regime":"A","ref":"Autres cours d’eau : A (cas de réalimentation majoritaire en étiage)"},{"else":"HN"}],
      "ref":"R.214-1 1.2.2.0" },
    "1.3.1.0": { "label":"Prélèvements en zone à seuils abaissés (répartition quantitative)","params":[{"id":"capacite_m3_h","label":"Capacité (m³/h)","type":"number"}],"logic":[{"if":"capacite_m3_h >= 8","regime":"A","ref":"A ≥ 8 m³/h"},{"else":"D"}],"ref":"R.214-1 1.3.1.0" },

    "2.1.1.0": { "label":"Systèmes d’assainissement collectif / ANC (charge DBO5)","params":[{"id":"dbo5_kg","label":"Charge brute (kg DBO5)","type":"number"}],
      "logic":[{"if":"dbo5_kg >= 600","regime":"A","ref":"A ≥ 600 kg DBO5"},{"if":"dbo5_kg > 12 && dbo5_kg < 600","regime":"D","ref":"12–600 kg DBO5"},{"else":"HN"}],
      "ref":"R.214-1 2.1.1.0" },
    "2.1.3.0": { "label":"Épandage/stockage de boues",
      "params":[{"id":"ms_t_an","label":"Matière sèche (t/an)","type":"number"},{"id":"n_t_an","label":"Azote total (t/an)","type":"number"}],
      "logic":[{"if":"ms_t_an > 800 || n_t_an > 40","regime":"A","ref":"MS > 800 t/an ou N > 40 t/an"},{"if":"(ms_t_an >= 3 && ms_t_an <= 800) || (n_t_an >= 0.15 && n_t_an <= 40)","regime":"D","ref":"MS 3–800 t/an ou N 0,15–40 t/an"},{"else":"HN"}],
      "ref":"R.214-1 2.1.3.0" },
    "2.1.4.0": { "label":"Épandage/stockage d’effluents ou de boues (hors 2.1.3.0, effluents d’élevage)",
      "params":[{"id":"volume_m3_an","label":"Volume annuel (m³/an)","type":"number"},{"id":"n_t_an","label":"Azote total (t/an)","type":"number"},{"id":"dbo5_kg_an","label":"DBO5 (kg/an)","type":"number"}],
      "logic":[{"if":"volume_m3_an > 50000 || n_t_an > 1 || dbo5_kg_an > 500","regime":"D","ref":"> 50 000 m³/an ou N > 1 t/an ou DBO5 > 500 kg/an"},{"else":"HN"}],
      "ref":"R.214-1 2.1.4.0" },
    "2.1.5.0": { "label":"Rejet d’eaux pluviales (surface interceptée)","params":[{"id":"surface_ha","label":"Surface totale interceptée (ha)","type":"number"}],
      "logic":[{"if":"surface_ha >= 20","regime":"A","ref":"A ≥ 20 ha"},{"if":"surface_ha > 1 && surface_ha < 20","regime":"D","ref":"> 1–20 ha"},{"else":"HN"}],
      "ref":"R.214-1 2.1.5.0" },

    "2.2.1.0": { "label":"Rejet en surface susceptible de modifier le régime des eaux",
      "params":[{"id":"capacite_rejet_m3_j","label":"Capacité totale de rejet (m³/j)","type":"number"},{"id":"part_pct_debit","label":"Part du débit moyen interannuel (%)","type":"number"}],
      "logic":[{"if":"capacite_rejet_m3_j > 2000 || part_pct_debit >= 5","regime":"D","ref":"> 2 000 m³/j ou ≥ 5 %"},{"else":"HN"}],
      "ref":"R.214-1 2.2.1.0" },
    "2.2.3.0": { "label":"Rejet en surface – flux ≥ niveau de référence R1 (≥1 paramètre)","params":[{"id":"r1_ok","label":"Atteint R1 ? (oui/non)","type":"text"}],
      "logic":[{"if":"r1_ok == 'oui'","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 2.2.3.0" },
    "2.3.1.0": { "label":"Rejets d’effluents sur le sol/sous-sol (hors cas exclus)","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 2.3.1.0" },
    "2.3.2.0": { "label":"Recharge artificielle des eaux souterraines","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 2.3.2.0" },

    "3.1.1.0": { "label":"Obstacle aux crues / continuité écologique (différence de niveau)",
      "params":[{"id":"delta_cm","label":"Différence de niveau (cm)","type":"number"},{"id":"type","label":"Crues / Continuité","type":"text"}],
      "logic":[{"if":"type == 'crues'","regime":"A"},{"if":"type == 'continuité' && delta_cm >= 50","regime":"A","ref":"Δ≥50 cm"},{"if":"type == 'continuité' && delta_cm > 20 && delta_cm < 50","regime":"D","ref":"20–50 cm"},{"else":"HN"}],
      "ref":"R.214-1 3.1.1.0" },
    "3.1.2.0": { "label":"Modification du lit/dérivation (longueur concernée)","params":[{"id":"longueur_m","label":"Longueur (m)","type":"number"}],
      "logic":[{"if":"longueur_m >= 100","regime":"A","ref":"A ≥ 100 m"},{"if":"longueur_m < 100 && longueur_m > 0","regime":"D","ref":"< 100 m"},{"else":"HN"}],
      "ref":"R.214-1 3.1.2.0" },
    "3.1.3.0": { "label":"Impact sensible sur la luminosité","params":[{"id":"longueur_m","label":"Longueur (m)","type":"number"}],
      "logic":[{"if":"longueur_m >= 100","regime":"A"},{"if":"longueur_m >= 10 && longueur_m < 100","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 3.1.3.0" },
    "3.1.4.0": { "label":"Consolidation/protection des berges (non végétal)","params":[{"id":"longueur_m","label":"Longueur (m)","type":"number"}],
      "logic":[{"if":"longueur_m >= 200","regime":"A"},{"if":"longueur_m >= 20 && longueur_m < 200","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 3.1.4.0" },
    "3.1.5.0": { "label":"Destruction de frayères / zones de croissance/alimentation","params":[{"id":"surface_m2","label":"Surface détruite (m²)","type":"number"}],
      "logic":[{"if":"surface_m2 > 200","regime":"A"},{"if":"surface_m2 > 0 && surface_m2 <= 200","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 3.1.5.0" },

    "3.2.1.0": { "label":"Entretien cours d’eau/canaux – sédiments/an",
      "params":[{"id":"volume_m3","label":"Volume extrait (m³/an)","type":"number"},{"id":"teneur","label":"Teneur sédiments (\"<S1\" / \">=S1\")","type":"text"}],
      "logic":[{"if":"volume_m3 > 2000","regime":"A"},{"if":"volume_m3 <= 2000 && teneur == '>=S1'","regime":"A"},{"if":"volume_m3 <= 2000 && teneur == '<S1'","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 3.2.1.0" },
    "3.2.2.0": { "label":"Remblais/installations dans le lit majeur – surface soustraite","params":[{"id":"surface_m2","label":"Surface soustraite (m²)","type":"number"}],
      "logic":[{"if":"surface_m2 >= 10000","regime":"A"},{"if":"surface_m2 >= 400 && surface_m2 < 10000","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 3.2.2.0" },
    "3.2.3.0": { "label":"Plans d’eau (création)","params":[{"id":"surface_m2","label":"Surface du plan d’eau (m²)","type":"number"}],
      "logic":[{"if":"surface_m2 >= 30000","regime":"A","ref":"A ≥ 3 ha"},{"if":"surface_m2 > 1000 && surface_m2 < 30000","regime":"D","ref":"0,1–3 ha"},{"else":"HN"}],
      "ref":"R.214-1 3.2.3.0" },
    "3.2.5.0": { "label":"Barrages de retenue (classement R.214-112)","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 3.2.5.0" },
    "3.2.6.0": { "label":"Ouvrages de prévention des inondations/submersions (SE / aménagement)","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 3.2.6.0" },
    "3.2.7.0": { "label":"Piscicultures d’eau douce (L.431-6)","params":[],"logic":[{"else":"D"}],"ref":"R.214-1 3.2.7.0" },

    "3.3.1.0": { "label":"Zones humides : assèchement/mise en eau/imperméabilisation/remblais","params":[{"id":"surface_m2","label":"Surface affectée (m²)","type":"number"}],
      "logic":[{"if":"surface_m2 >= 10000","regime":"A"},{"if":"surface_m2 > 1000 && surface_m2 < 10000","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 3.3.1.0" },
    "3.3.2.0": { "label":"Drainage – surface drainée","params":[{"id":"surface_drainee_m2","label":"Surface drainée (m²)","type":"number"}],
      "logic":[{"if":"surface_drainee_m2 >= 1000000","regime":"A","ref":"A ≥ 100 ha"},{"if":"surface_drainee_m2 > 200000 && surface_drainee_m2 < 1000000","regime":"D","ref":"20–100 ha"},{"else":"HN"}],
      "ref":"R.214-1 3.3.2.0" },
    "3.3.3.0": { "label":"Canalisations hydrocarbures/produits chimiques liquides",
      "params":[{"id":"longueur_km","label":"Longueur (km)","type":"number"},{"id":"diam_m","label":"Diamètre extérieur (m)","type":"number"}],
      "logic":[{"if":"longueur_km > 5","regime":"A","ref":"> 5 km"},{"if":"(diam_m * (longueur_km*1000)) > 2000","regime":"A","ref":"Diamètre × longueur > 2000 m²"},{"else":"HN"}],
      "ref":"R.214-1 3.3.3.0" },
    "3.3.4.0": { "label":"Recherches/stockages souterrains de déchets radioactifs","params":[{"id":"type","label":"Type (forages>1 an / autres)","type":"text"}],
      "logic":[{"if":"type == 'forages>1an'","regime":"A"},{"else":"D"}],
      "ref":"R.214-1 3.3.4.0" },
    "3.3.5.0": { "label":"Restauration des fonctionnalités naturelles des milieux aquatiques","params":[{"id":"categorie","label":"Catégorie (arasement/déplacement/etc.)","type":"text"}],
      "logic":[{"else":"D"}],"ref":"R.214-1 3.3.5.0" },

    "4.1.1.0": { "label":"Travaux de création/chenal d’accès portuaire / modif. des spécifications","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 4.1.1.0" },
    "4.1.2.0": { "label":"Aménagements portuaires – incidence directe sur le milieu (montant)","params":[{"id":"montant_eur","label":"Montant des travaux (€)","type":"number"}],
      "logic":[{"if":"montant_eur >= 1900000","regime":"A"},{"if":"montant_eur >= 160000 && montant_eur < 1900000","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 4.1.2.0" },
    "4.1.3.0": { "label":"Dragage et/ou rejet en milieu marin",
      "params":[{"id":"teneur","label":"Teneur sédiments (>=N2 / N1-N2 / <=N1)","type":"text"},{"id":"volume_m3_12m","label":"Volume sur 12 mois (m³)","type":"number"},{"id":"facade","label":"Façade (AMN / autre)","type":"text"},{"id":"distance_km","label":"Distance au rejet / zone conchylicole (km)","type":"number"}],
      "logic":[{"if":"teneur == '>=N2'","regime":"A","ref":"Teneur ≥ N2"},{"if":"teneur == 'N1-N2' && facade == 'AMN' && distance_km <= 1 && volume_m3_12m >= 50000","regime":"A","ref":"AMN/≤1 km, ≥50 000 m³"},{"if":"teneur == 'N1-N2' && facade == 'AMN' && distance_km <= 1 && volume_m3_12m < 50000","regime":"D","ref":"AMN/≤1 km, <50 000 m³"},{"if":"teneur == 'N1-N2' && facade != 'AMN' && distance_km <= 0.5 && volume_m3_12m >= 5000","regime":"A","ref":"ailleurs/≤500 m, ≥5 000 m³"},{"if":"teneur == 'N1-N2' && facade != 'AMN' && distance_km <= 0.5 && volume_m3_12m < 5000","regime":"D","ref":"ailleurs/≤500 m, <5 000 m³"},{"if":"teneur == '<=N1' && volume_m3_12m >= 500000","regime":"A","ref":"≤N1 et ≥500 000 m³"},{"if":"teneur == '<=N1' && volume_m3_12m >= 5000 && volume_m3_12m < 500000","regime":"D","ref":"≤N1 et 5 000–500 000 m³"},{"else":"HN"}],
      "ref":"R.214-1 4.1.3.0" },

    "5.1.1.0": { "label":"Réinjection dans la même nappe (géothermie, exhaures, génie civil)","params":[{"id":"capacite_m3_h","label":"Capacité totale de réinjection (m³/h)","type":"number"}],
      "logic":[{"if":"capacite_m3_h >= 80","regime":"A"},{"if":"capacite_m3_h >= 8 && capacite_m3_h < 80","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 5.1.1.0" },
    "5.1.2.0": { "label":"Recherche/exploitation de gîtes géothermiques","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 5.1.2.0" },
    "5.1.3.0": { "label":"Travaux miniers (recherches/cavités/forages/essais)","params":[{"id":"categorie","label":"a/b/d/e/f/g (voir texte)","type":"text"}],
      "logic":[{"if":"categorie == 'a' || categorie == 'b' || categorie == 'd'","regime":"A"},{"if":"categorie == 'e' || categorie == 'f' || categorie == 'g'","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 5.1.3.0" },
    "5.1.4.0": { "label":"Travaux d’exploitation de mines","params":[{"id":"type","label":"Type (a : sous autorisation exploitation / b : autres)","type":"text"}],
      "logic":[{"if":"type == 'a'","regime":"D"},{"if":"type == 'b'","regime":"A"},{"else":"HN"}],
      "ref":"R.214-1 5.1.4.0" },
    "5.1.5.0": { "label":"Exploitation de stockages souterrains de déchets radioactifs","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 5.1.5.0" },
    "5.1.6.0": { "label":"Travaux de recherches des mines","params":[{"id":"type","label":"a : 2° art.3 / b : autres","type":"text"}],
      "logic":[{"if":"type == 'a'","regime":"A"},{"if":"type == 'b'","regime":"D"},{"else":"HN"}],
      "ref":"R.214-1 5.1.6.0" },
    "5.1.7.0": { "label":"Prospection/recherche/exploitation (fonds marins domaine public)","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 5.1.7.0" },
    "5.2.2.0": { "label":"Concessions hydrauliques (Livre V code de l’énergie)","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 5.2.2.0" },
    "5.2.3.0": { "label":"Travaux commission d’aménagement foncier (liste réglementaire)","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 5.2.3.0" },
    "5.2.4.0": { "label":"Travaux d’exploitation de mines (L.621-4-1)","params":[],"logic":[{"else":"D"}],"ref":"R.214-1 5.2.4.0" }
  }
}

<script>
(function(){
  'use strict';
  const $ = (s, r=document)=> r.querySelector(s);
  const $$ = (s, r=document)=> Array.from(r.querySelectorAll(s));

  /* Store */
  const PROC_KEY='sd40:procVisible';
  const RULES_KEY='sd40:iota_rules_v1';
  const ANNOS_KEY='sd40:annotations';
  const CACHE_VERSION='v3';

  /* Photo & croquis state */
  const photos = [];     // {dataUrl, w, h, ts}
  const sketches = [];   // {dataUrl, w, h, ts}
  const UNITS_TEXTUAL = false; // false => m³·h⁻¹, true => "m³ par heure"

  const procEl = $('#proc');
  const btnOpen = $('#btnProcOpen');
  const btnClose = $('#btnProcClose');
  function openProc(){ procEl.hidden = false; try{ localStorage.setItem(PROC_KEY,'1'); }catch(e){} }
  function closeProc(){ procEl.hidden = true;  try{ localStorage.setItem(PROC_KEY,'0'); }catch(e){} }
  btnOpen.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openProc(); });
  btnClose.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); closeProc(); });
  document.addEventListener('click', (e)=>{
    if (procEl.hidden) return;
    const inside = procEl.contains(e.target) || e.target.closest('#btnProcOpen');
    if (!inside) closeProc();
  });
  document.addEventListener('keydown',(e)=>{ if (e.key === 'Escape') closeProc(); });
  try{ if (localStorage.getItem(PROC_KEY) === '1') openProc(); }catch(e){}

  /* ===== Map & layers ===== */
  const LAYERS = [
    { name:"Axe_realimentes_Institution_Adour", url:"layers/Axe_realimentes_Institution_Adour.geojson" },
    { name:"BDT_3_5_Bassin_Versant", url:"layers/BDT_3_5_Bassin_Versant.geojson" },
    { name:"BDT_3_5_Plan_d_eau", url:"layers/BDT_3_5_Plan_d_eau.geojson" },
    { name:"BDT_3_5_Reservoir", url:"layers/BDT_3_5_Reservoir.geojson" },
    { name:"Cadastre_parcelles_Flux", url:"layers/Cadastre_parcelles_Flux.geojson" },
    { name:"DCE_2022_2027_masses_deau_cotiere_Adour_Garonne", url:"layers/DCE_2022_2027_masses_deau_cotiere_Adour_Garonne.geojson" },
    { name:"DCE_2022_2027_masses_deau_de_transition_Adour_Garonne", url:"layers/DCE_2022_2027_masses_deau_de_transition_Adour_Garonne.geojson" },
    { name:"DCE__2022_2027__BV_specifique__AG", url:"layers/DCE__2022_2027__BV_specifique__AG.geojson" },
    { name:"DCE__2022_2027__plans_deau__adour_garonne", url:"layers/DCE__2022_2027__plans_deau__adour_garonne.geojson" },
    { name:"DDT40_Carto_Cours_d_Eau_validee", url:"layers/DDT40_Carto_Cours_d_Eau_validee.geojson" },
    { name:"DDT40_Plan_d_Eau_loi_Eau", url:"layers/DDT40_Plan_d_Eau_loi_Eau.geojson" },
    { name:"DDT40_retenue_d_eau", url:"layers/DDT40_retenue_d_eau.geojson" },
    { name:"DPT40Masque", url:"layers/DPT40Masque.geojson" },
    { name:"DREAL_points_nodaux", url:"layers/DREAL_points_nodaux.geojson" },
    { name:"IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux", url:"layers/IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux.geojson" },
    { name:"INRAe_carte_sols", url:"layers/INRAe_carte_sols.geojson" },
    { name:"Isochrones_nappe_alluviale_adour_IA", url:"layers/Isochrones_nappe_alluviale_adour_IA.geojson" },
    { name:"ONF_Foret", url:"layers/ONF_Foret.geojson" },
    /* gzip */
    { name:"DCE_2022-2027_cours_deau_Adour-Garonne", url:"layers/DCE_2022-2027_cours_deau_Adour-Garonne.geojson.gz" },
    { name:"DCE_2022_2027__masses_deau_souterraine", url:"layers/DCE_2022_2027__masses_deau_souterraine.geojson.gz" },
    { name:"BDT_3_5_Surface_hydrographique", url:"layers/BDT_3_5_Surface_hydrographique.geojson.gz" },
    { name:"IGN_BDHaies_V2_2024", url:"layers/IGN_BDHaies_V2_2024.geojson.gz" },
    { name:"Nappes_des_sables", url:"layers/Nappes_des_sables.geojson.gz" },
    { name:"Zones_Restriction_Prelevements_flux", url:"layers/Zones_Restriction_Prelevements_flux.geojson.gz" }
  ];

  const map = L.map('map', { zoomControl:true, preferCanvas:true }).setView([43.85,-0.7], 9);
  const baseOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:20, attribution:'© OpenStreetMap' }).addTo(map);
  const baseSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:20, attribution:'Tiles © Esri — Source: Esri, Maxar' });
  L.control.scale({metric:true, imperial:false, position:'bottomleft'}).addTo(map);
  try{ L.control.locate({ position:'topleft', strings:{ title:'Me localiser' }, keepCurrentZoomLevel:true, flyTo:true, drawCircle:true, showPopup:true, cacheLocation:true }).addTo(map); }catch(e){}

  const baseMaps = { "Plan (OSM)": baseOSM, "Satellite (Esri)": baseSat };
  const layersControl = L.control.layers(baseMaps, {}, {collapsed:false}).addTo(map);
  const layerGroups = {}; for (const it of LAYERS){ const grp=L.layerGroup(); layerGroups[it.name]=grp; layersControl.addOverlay(grp, it.name); }

  /* Toggle “Couches” */
  const LayerToggleBig = L.Control.extend({
    options:{ position:'topright' },
    onAdd(){ const wrap = L.DomUtil.create('div','layer-toggle-wrap leaflet-control');
      const btn = L.DomUtil.create('button','layer-toggle-btn',wrap);
      btn.type='button'; btn.innerHTML = `<span class="icon">☰</span><span class="label">Couches</span>`;
      L.DomEvent.on(btn,'click', L.DomEvent.stop).on(btn,'click', ()=>{
        const el = document.querySelector('.leaflet-control-layers');
        if (el) el.style.display = (el.style.display==='none' ? '' : 'none');
      }); return wrap; }
  }); map.addControl(new LayerToggleBig());

  /* Style & popups */
  function styleByGeom(feature){
    const t = feature?.geometry?.type || '';
    if (t==='Point' || t==='MultiPoint') return {radius:5, fillColor:'#e31a1c', color:'#ffffff', weight:1, opacity:1, fillOpacity:.85};
    if (t.includes('Line')) return {color:'#1f78b4', weight:2, opacity:.95};
    return {color:'#33a02c', weight:2, opacity:.95, fillOpacity:.25};
  }
  function toTitle(s){ return s.replace(/_/g,' ').replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)\S/g, t=>t.toUpperCase()); }
  const PRIORITY_FIELDS = ['NOM','NOM_OUVRAG','name','nom','libelle','LIBELLE','titre'];
  function buildPopupHTML(props){
    const keys = Object.keys(props||{}); if (!keys.length) return '<em>Aucun attribut</em>';
    const titleKey = PRIORITY_FIELDS.find(k => k in props); const title = titleKey ? String(props[titleKey]) : null;
    const ordered = [...PRIORITY_FIELDS.filter(k => k in props), ...keys.filter(k => !PRIORITY_FIELDS.includes(k))];
    let rows = ''; for (const k of ordered){ const v = props[k]; if (v==null || String(v).trim()==='') continue; rows += `<tr><th>${toTitle(k)}</th><td>${v}</td></tr>`; }
    return `<div class="popup-card">${title?`<div class="popup-title">${title}</div>`:''}<table class="popup-table">${rows}</table></div>`;
  }
  function onEachFeature(feature, layer){ layer.bindPopup(buildPopupHTML(feature.properties||{}), {maxWidth:380,minWidth:220,autoPan:true}); }

  const {get:cacheGet, set:cacheSet} = idbKeyval;

  async function loadGeoJSONSmart(url){
    async function tryFetch(u){
      const res = await fetch(u, {cache:'no-store'});
      if (!res.ok) throw new Error(res.status+' '+res.statusText);
      try { const jj = await res.clone().json(); await cacheSet(CACHE_VERSION+':'+u, jj); return jj; } catch(_){}
      const buf = await res.arrayBuffer(); const u8 = new Uint8Array(buf);
      if (u8.length===0) throw new Error('Fichier vide');
      const isGzip   = (u8[0]===0x1f && u8[1]===0x8b);
      const looksHTML= (u8[0]===0x3C);
      if (isGzip){
        let text;
        if ('DecompressionStream' in window){
          const r2 = await fetch(u,{cache:'no-store'});
          text = await new Response(r2.body.pipeThrough(new DecompressionStream('gzip'))).text();
        } else if (window.pako){ text = pako.ungzip(u8,{to:'string'}); }
        else { throw new Error('GZIP détecté mais pas de décompresseur'); }
        const j = JSON.parse(text); await cacheSet(CACHE_VERSION+':'+u, j); return j;
      }
      if (looksHTML) throw new Error('HTML/404 — mauvais chemin/nom');
      const txt = new TextDecoder().decode(u8); const j = JSON.parse(txt);
      await cacheSet(CACHE_VERSION+':'+u, j); return j;
    }

    try { return await tryFetch(url); }
    catch(e1){
      let alt=null;
      if (typeof url==='string' && url.startsWith('layers/')) alt = url.replace(/^layers\//,'couches/');
      else if (typeof url==='string' && url.startsWith('couches/')) alt = url.replace(/^couches\//,'layers/');
      if (alt){
        try { return await tryFetch(alt); } catch(e2){}
      }
      const cached = await cacheGet(CACHE_VERSION+':'+url);
      if (cached) return cached;
      throw e1;
    }
  }
  function normalizeFC(gj){
    const out={type:'FeatureCollection', features:[]};
    const feats = Array.isArray(gj?.features)?gj.features:[]; for (const f of feats){
      const g=f?.geometry; if(!g) continue;
      if (g.type==='GeometryCollection' && Array.isArray(g.geometries) && g.geometries.length){
        for (const gg of g.geometries){ if(!gg) continue; out.features.push({type:'Feature',properties:f.properties||{},geometry:gg}); }
      } else out.features.push(f);
    }
    return out;
  }

      const gj = await loadGeoJSONSmart(it.url); const fc = normalizeFC(gj);
      const layer = L.geoJSON(fc,{
        style:styleByGeom,
        pointToLayer:(feat,latlng)=> L.circleMarker(latlng, styleByGeom(feat)),
        onEachFeature
      });
      layer.eachLayer(l=> l.bringToFront());
      grp.clearLayers(); grp.addLayer(layer);
      loaded.add(name);
      if (name==='DPT40Masque'){ try{ maskBounds = layer.getBounds(); }catch(_){ } }
    }catch(err){ console.warn(`ERR ${name}:`, err); }
  }

  function stopGPS(){ if(!gpsState) return;

    if (!('geolocation' in navigator)){ alert('Géolocalisation non disponible.'); stopGPS(); return; }

  function onGPS(pos){
    const { latitude, longitude } = pos.coords; const ll=L.latLng(latitude,longitude); const s=gpsState; if(!s) return;
    if (s.pts.length){ const last=s.pts[s.pts.length-1]; const d=turf.distance([last.lng,last.lat],[ll.lng,ll.lat],{units:'meters'}); if (d<3) return; }

    }else{
      if (!s.poly){ s.poly=L.polygon(s.pts,{color:'#33a02c',weight:2,fillOpacity:.15}).addTo(map); } else { s.poly.setLatLngs([s.pts]); }

  }

  function updateGPSLabel(latlng, text){

  function exportCurrentMeasure(){

    }else{
      const ring=[...pts.map(ll=>[ll.lng,ll.lat]), [pts[0].lng,pts[0].lat]];

  function normG(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
  function natinfSuggestForIota(iotaCode){
    const fam = String(iotaCode||'').split('.')[0];
    let kw = ['iota','declaration','autorisation','prescription','opposition'];
    if (fam==='1'){ kw = kw.concat(['prelev','pompage','ouvrage','eau']); }
    else if (fam==='2'){ kw = kw.concat(['rejet','effluent','assainissement','eaux pluviales']); }
    else if (fam==='3'){ kw = kw.concat(['installation','ouvrage','cours','plan','berge','continuite','zone humide']); }
    else if (fam==='4'){ kw = kw.concat(['marin','dragage','port']); }
    const scored = (Array.isArray(NATINF)? NATINF : []).map(n=>{
      const t = normG(n.intitule)+' '+normG(n.type||''); let s = 0; kw.forEach(k=>{ if (t.includes(k)) s++; });
      if (t.includes('iota')) s+=2; return { n, score:s };
    }).filter(x=>x.score>0).sort((a,b)=> b.score - a.score);
    return scored.slice(0,8).map(x=>({natinf:x.n.natinf, intitule:x.n.intitule, type:x.n.type||''}));
  }

  /* ===== Proc UI ===== */
  function initProc(){

    $$('.proc-tabs button').forEach(b=>{

      const out = IOTA.filter(x=> (x.code||'').includes(q) || (x.titre||'').toLowerCase().includes(q));
      iotaList.innerHTML = out.map(x=>`<div class="row" style="padding:4px 0">
        <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
          <input type="radio" name="iotaPick" value="${x.code}">
          <div><b>${x.code}</b> — ${x.titre}</div>
        </label>
      </div>`).join('') || '<em>Aucune rubrique</em>';
      $$('input[name=iotaPick]', iotaList).forEach(r=>{
        r.addEventListener('change', ()=>{
          $('#ftRefIota').value = r.value;
          $('#valRubrique').value = r.value;
          buildValParams();
          const suggested = natinfSuggestForIota(r.value).slice(0,3).map(x=>x.natinf);
          $('#ftRefNatinf').value = suggested.join(', ');
        });
      });
    }
    renderIota();
    $('#iotaSearch').addEventListener('input', (e)=>renderIota(e.target.value));

    // NATINF filters
    const bcaeList = $('#bcaeList'), phytoList = $('#phytoList'), autreList = $('#autreList');
    const BCAE_KEYS = ['bcae','zone humide','drainage','nitrates','programme d\'action','bande tampon','haie','prairie'];
    const PHYTO_KEYS = ['phytopharmaceutique','phytosanitaire','certificat individuel','neonicotinoide','amm','znt','biocide'];
    function pickNatinf(listEl, arr){
      listEl.innerHTML = arr.slice(0,200).map(n=>`<div class="row" style="padding:4px 0">
        <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
          <input type="radio" name="${listEl.id}-pick" value="${n.natinf}">
          <div><b>${n.natinf}</b> — <i>${n.intitule}</i> ${n.type?`<span class="badge">${n.type}</span>`:''}</div>
        </label>
      </div>`).join('') || '<em>Aucun résultat</em>';
      $$('input[type=radio]', listEl).forEach(r=>{
        r.addEventListener('change', ()=>{ $('#ftRefNatinf').value = r.value; });
      });
    }
    function filterBCAE(q){ const n=normG(q); return NATINF.filter(nf=>{ const t=normG(nf.intitule); return BCAE_KEYS.some(k=>t.includes(normG(k))) || t.includes(n); }); }
    function filterPHYTO(q){ const n=normG(q); return NATINF.filter(nf=>{ const t=normG(nf.intitule); return PHYTO_KEYS.some(k=>t.includes(normG(k))) || t.includes(n); }); }

  function humanizeCond(raw, def){
    let s = String(raw);
    (def?.params||[]).forEach(p=>{
      const re=new RegExp(`\\b${p.id}\\b`,'g'); s=s.replace(re, (p.label||p.id));
    });
    s = s.replace(/\s*>=\s*/g,' ≥ ')
         .replace(/\s*<=\s*/g,' ≤ ')
         .replace(/\s*>\s*/g,' > ')
         .replace(/\s*<\s*/g,' < ')
         .replace(/\s*==\s*/g,' = ')
         .replace(/\s*&&\s*/g,' ET ')
         .replace(/\s*\|\|\s*/g,' OU ')
         .replace(/'([^']+)'/g,'$1');
    return fmtUnitLabel(s.trim());
  }
  function buildHumanExplanation(def, ctx, logic, hitIndex, decision, ref){
    const prettyDecision = (decision==='A'?'Autorisation':decision==='D'?'Déclaration':'Hors nomenclature');
    let html = `<div style="margin:.25rem 0 .5rem"><b>${def.label||''}</b></div>`;
    if (def.params?.length){
      html += `<div class="kv" style="margin-bottom:6px">`;
      def.params.forEach(p=>{
        const v = ctx[p.id];
        html += `<b>${fmtUnitLabel(p.label)} :</b> <span>${fmtNumFR(v)}</span>`;
      });
      html += `</div>`;
    }
    if (Array.isArray(logic) && logic.length){
      html += `<div style="font-weight:600;margin:6px 0 2px">Critères évalués :</div><ul style="margin:.15rem 0 .5rem .9rem">`;
      logic.forEach((rule, i)=>{
        if (rule.if){
          const txt = humanizeCond(rule.if, def);
          const regime = (rule.regime||'');
          const ok = (i === hitIndex);
          html += `<li>${txt} <span class="badge" style="margin-left:.35rem">${regime||'—'}</span> — ${ok?'<b>rempli</b>':'non rempli'}</li>`;
        } else {
          const r = rule.else || 'HN';
          const ok = (i === hitIndex);
          html += `<li>Sinon <span class="badge" style="margin-left:.35rem">${r}</span> — ${ok?'<b>appliqué</b>':'non appliqué'}</li>`;
        }
      });
      html += `</ul>`;
    }
    html += `<div style="margin:.25rem 0"><b>Régime :</b> <span class="pill ${prettyDecision==='Autorisation'?'autorisation':prettyDecision==='Déclaration'?'declaration':'hors'}" style="margin-left:.35rem">${prettyDecision}</span>${ref?` <span class="note">(${ref})</span>`:''}</div>`;
    html += `<div class="note" style="margin-top:.25rem">Résultat indicatif, à confronter aux textes en vigueur.</div>`;
    return html;
  }

  function safeEval(expr, ctx){
    const safe = expr
      .replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, (id)=> (id in ctx ? String(ctx[id]??0) : id))
      .replace(/[^0-9<>=!&|().+*\-\/ %]/g,'');
    try{ return !!eval(safe); }catch(_){ return false; }
  }

  function evaluateRegime(){
    const code = ($('#valRubrique').value||'').trim();
    const rules = getRules(); const def = rules[code];
    if (!def){ setRegimeUI('HN'); $('#valTrace').innerHTML=''; return 'HN'; }
    const ctx={}; (def.params||[]).forEach(p=>{
      const v=parseFloat(($('#param_'+p.id)?.value||'').replace(',','.'));
      ctx[p.id] = isFinite(v)? v : 0;
    });
    let decision='HN', ref=''; let hitIndex=-1;
    for (let i=0; i<(def.logic||[]).length; i++){
      const rule = def.logic[i];
      if (rule.if){
        const ok = safeEval(rule.if, ctx);
        if (ok){ decision=rule.regime||'HN'; ref=rule.ref||''; hitIndex=i; break; }
      } else { decision = rule.else || 'HN'; ref=rule.ref||''; hitIndex=i; break; }
    }
    setRegimeUI(decision);
    $('#valTrace').innerHTML = buildHumanExplanation(def, ctx, def.logic, hitIndex, decision, ref);
    if (!$('#ftRefIota').value) $('#ftRefIota').value = code;
    const suggested = natinfSuggestForIota(code).slice(0,3).map(x=>x.natinf);
    if (suggested.length) { $('#ftRefNatinf').value = suggested.join(', '); }
    return decision;
  }

  function fileToImageDataURL(file, maxSize){
    return new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const {canvas, w, h} = fitOnCanvas(img, maxSize);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
          resolve({dataUrl, w, h});
        };
        img.onerror = reject; img.src = fr.result;
      };
      fr.onerror = reject; fr.readAsDataURL(file);
    });
  }
  function fitOnCanvas(img, maxSize){
    const ratio = Math.min(1, maxSize/Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth*ratio), h=Math.round(img.naturalHeight*ratio);
    const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
    return {canvas, w, h};
  }

  const sketchOverlay = $('#sketchOverlay');

  let sketchState = { drawing:false, eraser:false, bg:'map', lastX:0, lastY:0, scale:1 };

  function resizeSketchCanvas(){
    const rect = sketchCanvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    sketchCanvas.width = Math.round(rect.width*dpr);
    sketchCanvas.height= Math.round(rect.height*dpr);
    sketchState.scale = dpr;
    sketchCtx.lineCap='round'; sketchCtx.lineJoin='round'; sketchCtx.lineWidth = 4*dpr;
    sketchCtx.strokeStyle = sketchState.eraser? '#111827' : '#e5e7eb';
    // Fill background if neutral
    if ($('#sketchBgToggle').dataset.mode === 'neutral'){
      sketchCtx.fillStyle='#111827'; sketchCtx.fillRect(0,0,sketchCanvas.width, sketchCanvas.height);
    }

  function mapSnapshot(){

  async function openSketch(){
    $('#sketchBgToggle').dataset.mode = 'map'; // default

  window.addEventListener('resize', ()=>{ if (sketchOverlay.style.display!=='none') resizeSketchCanvas(); });

  function pointerPos(evt){
    const rect = sketchCanvas.getBoundingClientRect();
    const x = (evt.clientX - rect.left) * sketchState.scale;
    const y = (evt.clientY - rect.top)  * sketchState.scale;
    return {x,y};
  }
  function startDraw(e){ e.preventDefault(); sketchState.drawing=true; const p=pointerPos(e); sketchState.lastX=p.x; sketchState.lastY=p.y; }
  function drawMove(e){
    if (!sketchState.drawing) return; e.preventDefault();
    const p=pointerPos(e);
    sketchCtx.globalCompositeOperation = sketchState.eraser? 'destination-out' : 'source-over';
    sketchCtx.strokeStyle = sketchState.eraser? 'rgba(0,0,0,1)' : '#e5e7eb';
    sketchCtx.beginPath();
    sketchCtx.moveTo(sketchState.lastX, sketchState.lastY);
    sketchCtx.lineTo(p.x, p.y);
    sketchCtx.stroke();
    sketchState.lastX=p.x; sketchState.lastY=p.y;
  }
  function endDraw(){ sketchState.drawing=false; }

  // Mouse & touch

  async function drawImagesGrid(pdf, list, title, x, y, width){
    pdf.setFont('helvetica','bold'); pdf.setFontSize(12);
    pdf.text(title, x, y); y+=12;
    if (!list.length){ pdf.setFont('helvetica','normal'); pdf.text('— Aucun', x, y); return y+16; }
    const gap = 14, colW = Math.floor((width - gap)/2), rowH = 160; // uniform height
    let col=0; let curX=x; let curY=y;
    for (const item of list){
      const imgProps = await loadImageForPDF(item.dataUrl);
      const ratio = Math.min(colW/imgProps.w, rowH/imgProps.h);
      const w = Math.round(imgProps.w*ratio), h=Math.round(imgProps.h*ratio);
      pdf.addImage(imgProps.dataUrl, 'JPEG', curX + Math.floor((colW-w)/2), curY, w, h);
      // caption
      pdf.setFont('helvetica','normal'); pdf.setFontSize(10);
      pdf.text('—', curX, curY + h + 12);
      // next
      if (col===0){ col=1; curX = x + colW + gap; }
      else { col=0; curX = x; curY += rowH + 36; }
      // new page if overflow
      if (curY + rowH + 100 > pdf.internal.pageSize.getHeight()){
        pdf.addPage(); curY=60; sectionTitle(pdf, title+' (suite)', x, curY); curY += 20;
      }
    }
    return curY + (col===1 ? rowH + 36 : 0);
  }
  function loadImageForPDF(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image(); img.onload=()=>{
        resolve({dataUrl: dataUrl.replace(/^data:image\/png/,'data:image/jpeg'), w:img.naturalWidth, h:img.naturalHeight});
      }; img.src=dataUrl;
    });
  }

  function drawFooter(pdf){
    const W = pdf.internal.pageSize.getWidth();
    const H = pdf.internal.pageSize.getHeight();
    const date = new Date().toLocaleString();
    const ll = $('#ftLatLng').textContent||'';
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9);
    const pages = pdf.getNumberOfPages();
    for (let i=1;i<=pages;i++){
      pdf.setPage(i);
      pdf.setDrawColor(200); pdf.line(40, H-40, W-40, H-40);
      pdf.text(`Généré le ${date} · ${ll}`, 40, H-24);
      pdf.text(`Page ${i}/${pages}`, W-100, H-24);
    }
  }

  /* ===== Utils (formatting) ===== */
  proj4.defs('EPSG:2154', '+proj=lcc +lat_1=49 +lat_2=44 +lat_0=46.5 +lon_0=3 +x_0=700000 +y_0=6600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');
  function computeLengthMeters(latlngs){ if (latlngs.length<2) return 0; const line=turf.lineString(latlngs.map(ll=>[ll.lng,ll.lat])); return turf.length(line,{units:'kilometers'})*1000; }
  function computeAreaM2(latlngs){ if (latlngs.length<3) return 0; const ring=[...latlngs.map(ll=>[ll.lng,ll.lat]), [latlngs[0].lng,latlngs[0].lat]]; return turf.area(turf.polygon([ring])); }

  function fmtLength(m){
    if (m<1000) return `${fmtNumFR(m,1)} m`;
    return `${fmtNumFR(m/1000,3)} km`;
  }
  function fmtArea(m2){
    if (m2<10000) return `${fmtNumFR(m2,0)} m²`;
    const ha=m2/10000; if (ha<100) return `${fmtNumFR(ha,2)} ha`;
    return `${fmtNumFR(m2/1e6,3)} km²`;
  }
  function fmtNumFR(x, dec){
    const n=Number(x);
    if (!isFinite(n)) return String(x||'');
    return n.toLocaleString('fr-FR', {maximumFractionDigits:dec??2, minimumFractionDigits:dec??0});
  }
  function fmtUnitLabel(label){
    // Replace "m³/h" by "m³·h⁻¹" or text form, keep numbers clean (no '/')
    return String(label||'').replace(/\(m³\/h\)/g, UNITS_TEXTUAL?'(m³ par heure)':'(m³·h⁻¹)')
                            .replace(/m³\/h/g, UNITS_TEXTUAL?'m³ par heure':'m³·h⁻¹');
  }

  /* ===== Quick binds for action bar ↔ proc buttons ===== */
  $('#btnProcOpen').addEventListener('click', ()=> openProc());
  $('#btnProcPDF').addEventListener('click', ()=> closeProc()); // auto-hide proc after export to see map again

  /* ===== Keyboard shortcuts (desktop) ===== */
  document.addEventListener('keydown', (e)=>{
    if (e.ctrlKey && e.key.toLowerCase()==='e'){ e.preventDefault(); $('#btnEval').click(); }
    if (e.ctrlKey && e.key.toLowerCase()==='p'){ e.preventDefault(); $('#btnProcPDF').click(); }
  });

  /* ===== Init some defaults ===== */
  buildValParams();
  updateCounts();

})();
</script>
</body>
