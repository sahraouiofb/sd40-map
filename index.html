<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SD40 – Carte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map { height:100%; margin:0 }
    .leaflet-control-layers-expanded { max-height: 80vh; overflow-y:auto; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Liste des couches : ajuste les URLs selon que le fichier est .geojson ou .geojson.gz
  const LAYERS = [
    { name: "Axe_realimentes_Institution_Adour", url: "layers/Axe_realimentes_Institution_Adour.geojson" },
    { name: "BDT_3_5_Bassin_Versant", url: "layers/BDT_3_5_Bassin_Versant.geojson" },
    { name: "BDT_3_5_Plan_d_eau", url: "layers/BDT_3_5_Plan_d_eau.geojson" },
    { name: "BDT_3_5_Reservoir", url: "layers/BDT_3_5_Reservoir.geojson" },
    { name: "Cadastre_parcelles_Flux", url: "layers/Cadastre_parcelles_Flux.geojson.gz" },
    { name: "DCE_2022_2027_masses_deau_cotiere_Adour_Garonne", url: "layers/DCE_2022_2027_masses_deau_cotiere_Adour_Garonne.geojson" },
    { name: "DCE_2022_2027_masses_deau_de_transition_Adour_Garonne", url: "layers/DCE_2022_2027_masses_deau_de_transition_Adour_Garonne.geojson" },
    { name: "DCE__2022_2027__BV_specifique__AG", url: "layers/DCE__2022_2027__BV_specifique__AG.geojson" },
    { name: "DCE__2022_2027__plans_deau__adour_garonne", url: "layers/DCE__2022_2027__plans_deau__adour_garonne.geojson" },
    { name: "DDT40_Carto_Cours_d_Eau_validee", url: "layers/DDT40_Carto_Cours_d_Eau_validee.geojson" },
    { name: "DDT40_Plan_d_Eau_loi_Eau", url: "layers/DDT40_Plan_d_Eau_loi_Eau.geojson" },
    { name: "DDT40_retenue_d_eau", url: "layers/DDT40_retenue_d_eau.geojson" },
    { name: "DPT40Masque", url: "layers/DPT40Masque.geojson" },
    { name: "DREAL_points_nodaux", url: "layers/DREAL_points_nodaux.geojson" },
    { name: "IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux", url: "layers/IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux.geojson" },
    { name: "INRAe_carte_sols", url: "layers/INRAe_carte_sols.geojson" },
    { name: "Isochrones_nappe_alluviale_adour_IA", url: "layers/Isochrones_nappe_alluviale_adour_IA.geojson" },
    { name: "ONF_Foret", url: "layers/ONF_Foret.geojson" },
    { name: "ZAS_sup_40_2024", url: "layers/ZAS_sup_40_2024.geojson" },
    { name: "ZRE_-_2013", url: "layers/ZRE_-_2013.geojson" },
    { name: "Zones_port_es_par_les_arr_t_s", url: "layers/Zones_port_es_par_les_arr_t_s.geojson" },
    { name: "Zones_portes_arretes", url: "layers/Zones_portes_arretes.geojson" },
    { name: "axes_raliments_l_cde_retenues_l93_institution_adour", url: "layers/axes_raliments_l_cde_retenues_l93_institution_adour.geojson" },
    { name: "pe_aci_adour", url: "layers/pe_aci_adour.geojson" },
    { name: "sortie", url: "layers/sortie.geojson" }
  ];

  // Crée la carte
  const map = L.map('map').setView([43.8, -0.8], 9);
  // Tu peux mettre une couche WMTS/XYZ ici si tu en veux une, sinon laisse vide
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);

  // Styles en fonction du type géométrique
  function styleFeature(feature) {
    const type = feature.geometry.type;
    if (type === 'Point' || type === 'MultiPoint') {
      return {radius: 5, fillColor: '#e31a1c', color: '#fff', weight: 1, opacity: 1, fillOpacity: 0.8};
    } else if (type === 'LineString' || type === 'MultiLineString') {
      return {color: '#1f78b4', weight: 2, opacity: 0.8};
    } else {
      return {color: '#33a02c', weight: 1, opacity: 0.8, fillOpacity: 0.3};
    }
  }
  // Génère un popup pour chaque entité
  function onEachFeature(feature, layer) {
    let content = '';
    if (feature.properties) {
      content = '<table>';
      Object.keys(feature.properties).forEach(function (k) {
        content += '<tr><th style="text-align:left;padding-right:6px;">'+k+'</th><td>'+feature.properties[k]+'</td></tr>';
      });
      content += '</table>';
    }
    layer.bindPopup(content);
  }

  const overlays = {};
  LAYERS.forEach(function(item){
    fetch(item.url)
      .then(function(response){
        if (item.url.toLowerCase().endsWith('.gz')) {
          // si le fichier est gzippé, on le décompresse avec les Streams
          if (!('DecompressionStream' in window)) {
            throw new Error('Ce navigateur ne supporte pas DecompressionStream. Utilise des .geojson non zippés.');
          }
          const ds = new DecompressionStream('gzip');
          const decompressed = response.body.pipeThrough(ds);
          return new Response(decompressed).json();
        }
        return response.json();
      })
      .then(function(data){
        const geoLayer = L.geoJSON(data, {
          style: styleFeature,
          pointToLayer: function(feature, latlng){ 
            return L.circleMarker(latlng, styleFeature(feature));
          },
          onEachFeature: onEachFeature
        });
        overlays[item.name] = geoLayer;
        geoLayer.addTo(map);
      })
      .catch(function(err){
        console.error('Erreur chargement '+item.name+' : '+err);
      });
  });

  L.control.layers(null, overlays, {collapsed: false}).addTo(map);
</script>
</body>
</html>

</script>
