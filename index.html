<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>SD40 – Carte + Procédure (IOTA/BCAE/Phyto + NATINF + Validateur)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Leaflet & plugins CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

<style>
  html,body,#map{height:100%;margin:0}
  [hidden]{display:none !important}

  /* ===== Liste des couches — large et tactile ===== */
  .leaflet-control-layers-expanded{max-height:70vh;overflow:auto}
  .leaflet-control-layers .leaflet-control-layers-list label{
    display:flex; align-items:center; gap:10px; line-height:1.3;
    padding:6px 8px; font-size:14px;
  }
  .leaflet-control-layers-overlays input[type="checkbox"]{width:18px;height:18px;margin-left:0}
  @media (max-width:820px){
    .leaflet-control-layers{
      position:fixed; top:56px; right:8px; left:8px; z-index:2000; width:auto; max-width:none;
      box-shadow:0 8px 24px rgba(0,0,0,.35)
    }
    .leaflet-control-layers-overlays input[type="checkbox"]{width:22px;height:22px}
    .leaflet-control-layers .leaflet-control-layers-list label{font-size:16px}
  }

  /* Bouton “☰ Couches” */
  .layer-toggle-wrap.leaflet-control{
    background:#111827;color:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);
    overflow:hidden;border:1px solid #0b1220
  }
  .layer-toggle-btn{
    display:flex;align-items:center;gap:10px;padding:10px 14px;font:600 14px system-ui;
    color:#fff;background:#111827;border:0;cursor:pointer
  }
  .layer-toggle-btn:hover{background:#0f172a}

  /* Outils */
  .tool-btn.leaflet-bar a{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;font:20px/1.1 system-ui; text-decoration:none; user-select:none;
  }
  .tool-btn.leaflet-bar a.active{background:#1f78b4;color:#fff}

  /* Popups */
  .popup-card{font:14px/1.35 system-ui,Segoe UI,Roboto,Arial;max-width:360px}
  .popup-title{font-weight:700;margin:0 0 .25rem}
  .popup-table{width:100%;border-collapse:collapse;font-size:13px}
  .popup-table th{white-space:nowrap;text-align:left;color:#22313f;font-weight:600;padding:.25rem .5rem .25rem 0;border-bottom:1px solid #eef}
  .popup-table td{padding:.25rem 0;border-bottom:1px solid #f2f4f7;word-break:break-word}
  .measure-label{
    background:#0b2239;color:#fff;padding:4px 6px;border-radius:4px;
    font:12px/1.2 system-ui; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  @media (max-width:480px){ .popup-card{max-width:90vw} }

  /* Masquage global des outils */
  body.tools-hidden .leaflet-draw,
  body.tools-hidden .tool-btn { display:none !important; }
  .tools-toggle.leaflet-control{
    background:#111827;color:#fff;border:1px solid #0b1220;border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.35); overflow:hidden
  }
  .tools-toggle button{
    display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;
    background:#111827;color:#fff;border:0;cursor:pointer;font:600 14px system-ui
  }
  .tools-toggle button:hover{background:#0f172a}

  /* Procédure drawer */
  .proc-drawer{position:absolute;right:10px;top:70px;z-index:4000;
    width:min(480px,94vw); max-height:80vh; display:flex; flex-direction:column;
    background:#fff; border:1px solid #d0d7e1; border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,.25); overflow:hidden}
  .proc-header{display:flex;gap:8px;align-items:center;justify-content:space-between;
    padding:10px 12px;background:#0b2239;color:#fff;font:600 14px system-ui}
  .proc-tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #eef; flex-wrap:wrap}
  .proc-tabs button{border:1px solid #d0d7e1;background:#f8fafc;padding:6px 10px;border-radius:8px;cursor:pointer}
  .proc-tabs button.active{background:#0b2239;color:#fff;border-color:#0b2239}
  .proc-body{padding:10px;overflow:auto}
  .proc-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .proc-row > *{flex:1 1 160px}
  .proc-actions{display:flex;gap:8px;justify-content:flex-end;padding:10px;border-top:1px solid #eef}
  .badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#e8eef6;color:#0b2239;font-weight:600;font-size:12px}
  .note{font-size:12px;color:#475569}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef6ff;color:#0b2239;font-weight:700}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:6px;font-size:13px}
  .kv b{color:#0b2239}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px}
</style>
</head>
<body>
<div id="map"></div>

<!-- ===================== UI Procédure ===================== -->
<div id="proc" class="proc-drawer" hidden>
  <div class="proc-header">
    <span>🗂️ Procédure terrain</span>
    <div style="display:flex;gap:8px">
      <button id="btnRules" type="button" style="border:0;background:#fff;color:#0b2239;border-radius:8px;padding:6px 8px" title="Éditer les règles IOTA (JSON)">⚙️ Règles IOTA</button>
      <button id="btnProcClose" type="button" style="border:0;background:#fff;color:#0b2239;border-radius:8px;padding:6px 8px" title="Fermer le panneau">Fermer</button>
    </div>
  </div>

  <div class="proc-tabs">
    <button data-tab="iota" class="active" type="button">IOTA</button>
    <button data-tab="bcae" type="button">BCAE</button>
    <button data-tab="phyto" type="button">Phyto</button>
    <button data-tab="autre" type="button">Autre</button>
    <button data-tab="validator" type="button">Validateur IOTA</button>
  </div>

  <div class="proc-body">
    <!-- IOTA -->
    <div class="tab" id="tab-iota">
      <div class="proc-row"><input id="iotaSearch" placeholder="Rechercher rubrique (ex : 3.2.3.0, ‘plans d’eau’)" /></div>
      <div id="iotaList"></div>
      <div class="note">Cliquer une rubrique la copie dans la fiche et dans le validateur. Appui long sur ⚙️ pour réinitialiser les règles intégrées.</div>
    </div>

    <!-- BCAE -->
    <div class="tab" id="tab-bcae" hidden>
      <div class="proc-row"><input id="bcaeSearch" placeholder="Mot-clé (ex: ‘zone humide’, ‘drainage’, ‘nitrates’)" /></div>
      <div id="bcaeList"></div>
    </div>

    <!-- Phyto -->
    <div class="tab" id="tab-phyto" hidden>
      <div class="proc-row"><input id="phytoSearch" placeholder="Mot-clé (ex: ‘phytopharmaceutique’, ‘certificat’, ‘néonicotinoïdes’)" /></div>
      <div id="phytoList"></div>
    </div>

    <!-- Autre -->
    <div class="tab" id="tab-autre" hidden>
      <div class="proc-row"><input id="autreSearch" placeholder="Recherche NATINF (mot-clé ou code)"/></div>
      <div id="autreList"></div>
    </div>

    <!-- VALIDATEUR IOTA -->
    <div class="tab" id="tab-validator" hidden>
      <div class="proc-row">
        <input id="valRubrique" placeholder="Rubrique IOTA (ex : 3.2.3.0)" />
        <select id="valGeom"><option value="point">Point</option><option value="line">Ligne</option><option value="polygon">Polygone</option></select>
      </div>
      <div id="valParams" class="proc-row"></div>
      <div class="proc-row">
        <button id="btnEval" type="button">Évaluer le régime</button>
        <span id="valResult" class="pill">—</span>
      </div>
      <div id="valTrace" class="mono"></div>
    </div>

    <hr>
    <!-- Fiche terrain -->
    <div class="proc-row"><input id="ftTitre" placeholder="Titre de l’intervention" /></div>
    <div class="proc-row"><input id="ftLieu" placeholder="Lieu / commune" /></div>
    <div class="proc-row"><textarea id="ftDesc" rows="4" placeholder="Constats, mesures, éléments matériels, témoins…"></textarea></div>
    <div class="proc-row">
      <input id="ftRefIota" placeholder="Rubrique IOTA retenue" />
      <input id="ftRefNatinf" placeholder="NATINF retenu (codes séparés par des virgules)" />
    </div>
    <div class="kv">
      <b>Coordonnées :</b> <span class="badge" id="ftLatLng">—</span>
      <b>Complétude :</b> <span class="badge" id="ftScore">—</span>
    </div>
  </div>

  <div class="proc-actions">
    <button id="btnResetAll" type="button" style="margin-right:auto">Remettre à zéro</button>
    <button id="btnProcPDF" type="button">Exporter PDF</button>
    <button id="btnProcGJ"  type="button">Exporter GeoJSON</button>
  </div>
</div>

<!-- Bouton flottant Procédure (décalé pour ne pas chevaucher “Couches”) -->
<div class="layer-toggle-wrap leaflet-control" style="position:absolute;right:10px;top:60px;z-index:3000;">
  <button id="btnProcOpen" class="layer-toggle-btn" type="button"><span class="icon">🗂️</span><span class="label">Procédure</span></button>
</div>

<!-- ========= TOUTES LES RÈGLES IOTA INTÉGRÉES ICI ========= -->
<script type="application/json" id="iota-pack-officiel">
{
  "iota": [
    {"code":"1.1.1.0","titre":"Sondage, forage (non domestique) – recherche/surveillance d’eaux souterraines"},
    {"code":"1.1.2.0","titre":"Prélèvements en eaux souterraines (volume annuel)"},

    {"code":"3.1.1.0","titre":"Obstacle crues / continuité écologique (différence de niveau)"},

    {"code":"3.1.4.0","titre":"Consolidation/protection de berges (non végétal)"},
    {"code":"3.1.5.0","titre":"Destruction de frayères / zones de croissance/alimentation"},
    {"code":"3.2.1.0","titre":"Entretien de cours d’eau/canaux – volume de sédiments"},
    {"code":"3.2.2.0","titre":"Installations/ouvrages/remblais dans le lit majeur – surface soustraite"},
    {"code":"3.2.3.0","titre":"Plans d’eau (création)"},
    {"code":"3.2.5.0","titre":"Barrages de retenue (classement R.214-112) – y compris vidange (dans l’acte)"},
    {"code":"3.2.6.0","titre":"Ouvrages de prévention inondations/submersions (SE / aménagement hydraulique)"},
    {"code":"3.2.7.0","titre":"Piscicultures d’eau douce (L.431-6)"},
    {"code":"3.3.1.0","titre":"Zones humides : assèchement/mise en eau/imperméabilisation/remblais"},
    {"code":"3.3.2.0","titre":"Drainage (surface drainée)"},
    {"code":"3.3.3.0","titre":"Canalisations hydrocarbures/produits chimiques liquides"},
    {"code":"3.3.4.0","titre":"Recherche/stockage souterrain de déchets radioactifs"},
    {"code":"3.3.5.0","titre":"Travaux de restauration fonctionnelle des milieux aquatiques"},
    {"code":"4.1.1.0","titre":"Travaux portuaires/chenal d’accès (création / modification)"},
    {"code":"4.1.2.0","titre":"Aménagements portuaires (montant des travaux)"},

    {"code":"5.1.1.0","titre":"Réinjection dans la même nappe (géothermie, exhaures, génie civil)"},
    {"code":"5.1.2.0","titre":"Recherche/exploitation de gîtes géothermiques"},
    {"code":"5.1.3.0","titre":"Travaux miniers – recherches, cavités, forages, essais"},
    {"code":"5.1.4.0","titre":"Travaux d’exploitation de mines"},
    {"code":"5.1.5.0","titre":"Exploitation de stockages souterrains de déchets radioactifs"},

    {"code":"5.2.2.0","titre":"Concessions hydrauliques (Livre V code de l’énergie)"},
    {"code":"5.2.3.0","titre":"Travaux commission d’aménagement foncier (listés)"},
    {"code":"5.2.4.0","titre":"Travaux d’exploitation de mines – autorisation L.621-4-1"}
  ],
  "rules": {
    "1.1.1.0": {
      "label":"Sondage/forage non domestique (recherche/surveillance d’eaux souterraines)",
      "params":[],
      "logic":[{"else":"D"}],
      "ref":"R.214-1 1.1.1.0"
    },
    "1.1.2.0": {
      "label":"Prélèvements en eaux souterraines (volume annuel)",
      "params":[{"id":"volume_m3_an","label":"Volume prélevé (m³/an)","type":"number"}],
      "logic":[
        {"if":"volume_m3_an >= 200000","regime":"A","ref":"A ≥ 200 000 m³/an"},
        {"if":"volume_m3_an > 10000 && volume_m3_an < 200000","regime":"D","ref":"10 000–200 000 m³/an"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 1.1.2.0"
    },
    "1.2.1.0": {
      "label":"Prélèvements en cours d’eau/nappe d’accompagnement/plan-canal alimenté",
      "params":[
        {"id":"capacite_m3_h","label":"Capacité (m³/h)","type":"number"},
        {"id":"part_pct_debit","label":"Part du débit du cours d’eau (%)","type":"number"}
      ],
      "logic":[
        {"if":"capacite_m3_h >= 1000 || part_pct_debit >= 5","regime":"A","ref":"A ≥ 1000 m³/h ou ≥ 5 %"},
        {"if":"(capacite_m3_h >= 400 && capacite_m3_h < 1000) || (part_pct_debit >= 2 && part_pct_debit < 5)","regime":"D","ref":"400–1000 m³/h ou 2–5 %"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 1.2.1.0"
    },
    "1.2.2.0": {
      "label":"Prélèvements avec étiage majoritairement réalimenté artificiellement",
      "params":[
        {"id":"rivieres","label":"Seine/Loire/Marne/Yonne ? (oui/non)","type":"text"},
        {"id":"capacite_m3_h","label":"Capacité (m³/h) – utile si 'oui'","type":"number"}
      ],
      "logic":[
        {"if":"rivieres == 'oui' && capacite_m3_h > 80","regime":"A","ref":"Seine/Loire/Marne/Yonne : A si > 80 m³/h"},
        {"if":"rivieres == 'oui' && capacite_m3_h <= 80","regime":"HN","ref":"Seine/Loire/Marne/Yonne : ≤ 80 m³/h = HN"},
        {"if":"rivieres != 'oui'","regime":"A","ref":"Autres cours d’eau : A (cas de réalimentation majoritaire en étiage)"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 1.2.2.0"
    },
    "1.3.1.0": {
      "label":"Prélèvements en zone à seuils abaissés (répartition quantitative)",
      "params":[{"id":"capacite_m3_h","label":"Capacité (m³/h)","type":"number"}],
      "logic":[
        {"if":"capacite_m3_h >= 8","regime":"A","ref":"A ≥ 8 m³/h"},
        {"else":"D"}
      ],
      "ref":"R.214-1 1.3.1.0"
    },
    "2.1.1.0": {
      "label":"Systèmes d’assainissement collectif / ANC (charge DBO5)",
      "params":[{"id":"dbo5_kg","label":"Charge brute (kg DBO5)","type":"number"}],
      "logic":[
        {"if":"dbo5_kg >= 600","regime":"A","ref":"A ≥ 600 kg DBO5"},
        {"if":"dbo5_kg > 12 && dbo5_kg < 600","regime":"D","ref":"12–600 kg DBO5"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 2.1.1.0"
    },
    "2.1.3.0": {
      "label":"Épandage/stockage de boues",
      "params":[
        {"id":"ms_t_an","label":"Matière sèche (t/an)","type":"number"},
        {"id":"n_t_an","label":"Azote total (t/an)","type":"number"}
      ],
      "logic":[
        {"if":"ms_t_an > 800 || n_t_an > 40","regime":"A","ref":"MS > 800 t/an ou N > 40 t/an"},
        {"if":"(ms_t_an >= 3 && ms_t_an <= 800) || (n_t_an >= 0.15 && n_t_an <= 40)","regime":"D","ref":"MS 3–800 t/an ou N 0,15–40 t/an"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 2.1.3.0"
    },
    "2.1.4.0": {
      "label":"Épandage/stockage d’effluents ou de boues (hors 2.1.3.0, effluents d’élevage)",
      "params":[
        {"id":"volume_m3_an","label":"Volume annuel (m³/an)","type":"number"},
        {"id":"n_t_an","label":"Azote total (t/an)","type":"number"},
        {"id":"dbo5_kg_an","label":"DBO5 (kg/an)","type":"number"}
      ],
      "logic":[
        {"if":"volume_m3_an > 50000 || n_t_an > 1 || dbo5_kg_an > 500","regime":"D","ref":"> 50 000 m³/an ou N > 1 t/an ou DBO5 > 500 kg/an"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 2.1.4.0"
    },
    "2.1.5.0": {
      "label":"Rejet d’eaux pluviales (surface interceptée)",
      "params":[{"id":"surface_ha","label":"Surface totale interceptée (ha)","type":"number"}],
      "logic":[
        {"if":"surface_ha >= 20","regime":"A","ref":"A ≥ 20 ha"},
        {"if":"surface_ha > 1 && surface_ha < 20","regime":"D","ref":"> 1–20 ha"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 2.1.5.0"
    },
    "2.2.1.0": {
      "label":"Rejet en surface susceptible de modifier le régime des eaux",

        {"id":"capacite_rejet_m3_j","label":"Capacité totale de rejet (m³/j)","type":"number"},
        {"id":"part_pct_debit","label":"Part du débit moyen interannuel (%)","type":"number"}
      ],
      "logic":[
        {"if":"capacite_rejet_m3_j > 2000 || part_pct_debit >= 5","regime":"D","ref":"> 2 000 m³/j ou ≥ 5 %"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 2.2.1.0"
    },
    "2.2.3.0": {

      "logic":[
        {"if":"r1_ok == 'oui'","regime":"D"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 2.2.3.0"
    },
    "2.3.1.0": { "label":"Rejets d’effluents sur le sol/sous-sol (hors cas exclus)", "params":[], "logic":[{"else":"A"}], "ref":"R.214-1 2.3.1.0" },
    "2.3.2.0": { "label":"Recharge artificielle des eaux souterraines", "params":[], "logic":[{"else":"A"}], "ref":"R.214-1 2.3.2.0" },

    "3.1.1.0": {
      "label":"Obstacle aux crues / continuité écologique (différence de niveau)",
      "params":[{"id":"delta_cm","label":"Différence de niveau (cm)","type":"number"},{"id":"type","label":"Crues / Continuité","type":"text"}],
      "logic":[

        {"if":"type == 'continuité' && delta_cm >= 50","regime":"A","ref":"Δ≥50 cm"},

    "3.1.3.0": {

        {"if":"longueur_m >= 20 && longueur_m < 200","regime":"D"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 3.1.4.0"
    },

      "logic":[
        {"if":"surface_m2 > 200","regime":"A"},
        {"if":"surface_m2 > 0 && surface_m2 <= 200","regime":"D"},
        {"else":"HN"}
      ],
      "ref":"R.214-1 3.1.5.0"

    "3.3.5.0": {
      "label":"Restauration des fonctionnalités naturelles des milieux aquatiques",

    "4.1.1.0": { "label":"Travaux de création/chenal d’accès portuaire / modif. des spécifications", "params":[], "logic":[{"else":"A"}], "ref":"R.214-1 4.1.1.0" },
    "4.1.2.0": {
      "label":"Aménagements portuaires – incidence directe sur le milieu (montant)",
      "params":[{"id":"montant_eur","label":"Montant des travaux (€)","type":"number"}],
      "logic":[
        {"if":"montant_eur >= 1900000","regime":"A"},
        {"if":"montant_eur >= 160000 && montant_eur < 1900000","regime":"D"},

      ],
      "ref":"R.214-1 4.1.2.0"
    },
    "4.1.3.0": {
      "label":"Dragage et/ou rejet en milieu marin",
      "params":[
        {"id":"teneur","label":"Teneur sédiments (>=N2 / N1-N2 / <=N1)","type":"text"},
        {"id":"volume_m3_12m","label":"Volume sur 12 mois (m³)","type":"number"},
        {"id":"facade","label":"Façade (AMN / autre)","type":"text"},
        {"id":"distance_km","label":"Distance au rejet / zone conchylicole (km)","type":"number"}
      ],
      "logic":[
        {"if":"teneur == '>=N2'","regime":"A","ref":"Teneur ≥ N2"},
        {"if":"teneur == 'N1-N2' && facade == 'AMN' && distance_km <= 1 && volume_m3_12m >= 50000","regime":"A","ref":"AMN/≤1 km, ≥50 000 m³"},
        {"if":"teneur == 'N1-N2' && facade == 'AMN' && distance_km <= 1 && volume_m3_12m < 50000","regime":"D","ref":"AMN/≤1 km, <50 000 m³"},
        {"if":"teneur == 'N1-N2' && facade != 'AMN' && distance_km <= 0.5 && volume_m3_12m >= 5000","regime":"A","ref":"ailleurs/≤500 m, ≥5 000 m³"},
        {"if":"teneur == 'N1-N2' && facade != 'AMN' && distance_km <= 0.5 && volume_m3_12m < 5000","regime":"D","ref":"ailleurs/≤500 m, <5 000 m³"},
        {"if":"teneur == '<=N1' && volume_m3_12m >= 500000","regime":"A","ref":"≤N1 et ≥500 000 m³"},
        {"if":"teneur == '<=N1' && volume_m3_12m >= 5000 && volume_m3_12m < 500000","regime":"D","ref":"≤N1 et 5 000–500 000 m³"},

    "5.2.2.0": { "label":"Concessions hydrauliques (Livre V code de l’énergie)", "params":[], "logic":[{"else":"A"}], "ref":"R.214-1 5.2.2.0" },

<script>
(function(){
  'use strict';
  const $ = (s, r=document)=> r.querySelector(s);
  const $$ = (s, r=document)=> Array.from(r.querySelectorAll(s));

  /* ---- Procédure : open/close robuste ---- */
  const PROC_KEY='sd40:procVisible';
  const RULES_KEY='sd40:iota_rules_v1';
  let PACK_RULES=null;

  const procEl = $('#proc');
  const btnOpen = $('#btnProcOpen');
  const btnClose = $('#btnProcClose');
  function openProc(){ procEl.hidden = false; try{ localStorage.setItem(PROC_KEY,'1'); }catch(e){} }
  function closeProc(){ procEl.hidden = true;  try{ localStorage.setItem(PROC_KEY,'0'); }catch(e){} }
  btnOpen.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openProc(); });
  btnClose.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); closeProc(); });
  document.addEventListener('click', (e)=>{
    if (procEl.hidden) return;
    const inside = procEl.contains(e.target) || e.target.closest('#btnProcOpen');
    if (!inside) closeProc();
  });
  document.addEventListener('keydown',(e)=>{ if (e.key === 'Escape') closeProc(); });
  try{ if (localStorage.getItem(PROC_KEY) === '1') openProc(); }catch(e){}

  /* ---- COUCHES ---- */
  const LAYERS = [
    { name:"Axe_realimentes_Institution_Adour", url:"couches/Axe_realimentes_Institution_Adour.geojson" },
    { name:"BDT_3_5_Bassin_Versant", url:"couches/BDT_3_5_Bassin_Versant.geojson" },
    { name:"BDT_3_5_Plan_d_eau", url:"couches/BDT_3_5_Plan_d_eau.geojson" },
    { name:"BDT_3_5_Reservoir", url:"couches/BDT_3_5_Reservoir.geojson" },
    { name:"Cadastre_parcelles_Flux", url:"couches/Cadastre_parcelles_Flux.geojson" },
    { name:"DCE_2022_2027_masses_deau_cotiere_Adour_Garonne", url:"couches/DCE_2022_2027_masses_deau_cotiere_Adour_Garonne.geojson" },
    { name:"DCE_2022_2027_masses_deau_de_transition_Adour_Garonne", url:"couches/DCE_2022_2027_masses_deau_de_transition_Adour_Garonne.geojson" },
    { name:"DCE__2022_2027__BV_specifique__AG", url:"couches/DCE__2022_2027__BV_specifique__AG.geojson" },
    { name:"DCE__2022_2027__plans_deau__adour_garonne", url:"couches/DCE__2022_2027__plans_deau__adour_garonne.geojson" },
    { name:"DDT40_Carto_Cours_d_Eau_validee", url:"couches/DDT40_Carto_Cours_d_Eau_validee.geojson" },
    { name:"DDT40_Plan_d_Eau_loi_Eau", url:"couches/DDT40_Plan_d_Eau_loi_Eau.geojson" },
    { name:"DDT40_retenue_d_eau", url:"couches/DDT40_retenue_d_eau.geojson" },
    { name:"DPT40Masque", url:"couches/DPT40Masque.geojson" },
    { name:"DREAL_points_nodaux", url:"couches/DREAL_points_nodaux.geojson" },
    { name:"IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux", url:"couches/IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux.geojson" },
    { name:"INRAe_carte_sols", url:"couches/INRAe_carte_sols.geojson" },
    { name:"Isochrones_nappe_alluviale_adour_IA", url:"couches/Isochrones_nappe_alluviale_adour_IA.geojson" },
    { name:"ONF_Foret", url:"couches/ONF_Foret.geojson" },
    /* GZIP */
    { name:"DCE_2022-2027_cours_deau_Adour-Garonne", url:"couches/DCE_2022-2027_cours_deau_Adour-Garonne.geojson.gz" },
    { name:"DCE_2022_2027__masses_deau_souterraine", url:"couches/DCE_2022_2027__masses_deau_souterraine.geojson.gz" },
    { name:"BDT_3_5_Surface_hydrographique", url:"couches/BDT_3_5_Surface_hydrographique.geojson.gz" },
    { name:"IGN_BDHaies_V2_2024", url:"couches/IGN_BDHaies_V2_2024.geojson.gz" },
    { name:"Nappes_des_sables", url:"couches/Nappes_des_sables.geojson.gz" },
    { name:"Zones_Restriction_Prelevements_flux", url:"couches/Zones_Restriction_Prelevements_flux.geojson.gz" },
    { name:"ZAS_sup_40_2024", url:"couches/ZAS_sup_40_2024.geojson" },
    { name:"ZRE_-_2013", url:"couches/ZRE_-_2013.geojson" },
    { name:"Zones_port_es_par_les_arr_t_s", url:"couches/Zones_port_es_par_les_arr_t_s.geojson" },
    { name:"Zones_portes_arretes", url:"couches/Zones_portes_arretes.geojson" },
    { name:"axes_raliments_l_cde_retenues_l93_institution_adour", url:"couches/axes_raliments_l_cde_retenues_l93_institution_adour.geojson" },
    { name:"pe_aci_adour", url:"couches/pe_aci_adour.geojson" },
    { name:"sortie", url:"couches/sortie.geojson" }
  ];

  /* ---- MAP + Basemaps ---- */
  const map = L.map('map', { zoomControl:true, preferCanvas:true }).setView([43.85,-0.7], 9);
  const baseOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:20, attribution:'© OpenStreetMap' }).addTo(map);
  const baseSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:20, attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics' });
  L.control.scale({metric:true, imperial:false, position:'bottomleft'}).addTo(map);
  try{ L.control.locate({ position:'topleft', strings:{ title:'Me localiser' }, keepCurrentZoomLevel:true, flyTo:true, drawCircle:true, showPopup:true, cacheLocation:true }).addTo(map); }catch(e){}

  const baseMaps = { "Plan (OSM)": baseOSM, "Satellite (Esri)": baseSat };
  const layersControl = L.control.layers(baseMaps, {}, {collapsed:false}).addTo(map);
  const layerGroups = {}; for (const it of LAYERS){ const grp=L.layerGroup(); layerGroups[it.name]=grp; layersControl.addOverlay(grp, it.name); }

  /* Bouton “☰ Couches” */
  const LayerToggleBig = L.Control.extend({
    options:{ position:'topright' },
    onAdd(){ const wrap = L.DomUtil.create('div','layer-toggle-wrap leaflet-control');
      const btn = L.DomUtil.create('button','layer-toggle-btn',wrap);
      btn.type='button'; btn.innerHTML = `<span class="icon">☰</span><span class="label">Couches</span>`;
      L.DomEvent.on(btn,'click', L.DomEvent.stop).on(btn,'click', ()=>{
        const el = document.querySelector('.leaflet-control-layers');
        if (el) el.style.display = (el.style.display==='none' ? '' : 'none');
      }); return wrap; }
  }); map.addControl(new LayerToggleBig());

  /* Styles & popups */
  function styleByGeom(feature){
    const t = feature?.geometry?.type || '';
    if (t==='Point' || t==='MultiPoint') return {radius:5, fillColor:'#e31a1c', color:'#ffffff', weight:1, opacity:1, fillOpacity:.85};
    if (t.includes('Line')) return {color:'#1f78b4', weight:2, opacity:.95};
    return {color:'#33a02c', weight:2, opacity:.95, fillOpacity:.25};
  }
  function toTitle(s){ return s.replace(/_/g,' ').replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)\S/g, t=>t.toUpperCase()); }
  const PRIORITY_FIELDS = ['NOM','NOM_OUVRAG','name','nom','libelle','LIBELLE','titre'];
  function buildPopupHTML(props){
    const keys = Object.keys(props||{}); if (!keys.length) return '<em>Aucun attribut</em>';
    const titleKey = PRIORITY_FIELDS.find(k => k in props); const title = titleKey ? String(props[titleKey]) : null;
    const ordered = [...PRIORITY_FIELDS.filter(k => k in props), ...keys.filter(k => !PRIORITY_FIELDS.includes(k))];
    let rows = ''; for (const k of ordered){ const v = props[k]; if (v==null || String(v).trim()==='') continue; rows += `<tr><th>${toTitle(k)}</th><td>${v}</td></tr>`; }
    return `<div class="popup-card">${title?`<div class="popup-title">${title}</div>`:''}<table class="popup-table">${rows}</table></div>`;
  }
  function onEachFeature(feature, layer){ layer.bindPopup(buildPopupHTML(feature.properties||{}), {maxWidth:380,minWidth:220,autoPan:true}); }

  /* Loader + cache */
  const {get:cacheGet, set:cacheSet} = idbKeyval;
  const CACHE_VERSION = 'v1';
 async function loadGeoJSONSmart(url){
  async function tryFetch(u){
    const res = await fetch(u, {cache:'no-store'});
    if (!res.ok) throw new Error(String(res.status));
    // d'abord essai JSON direct
    try{
      const j = await res.clone().json();
      await cacheSet(CACHE_VERSION+':'+u, j);
      return j;
    }catch(_){/* pas du JSON direct */}
    // sinon binaire (potentiellement gzip)
    const buf = await res.arrayBuffer();
    const u8 = new Uint8Array(buf);
    if (u8.length===0) throw new Error('Fichier vide');
    const isGzip   = (u8[0]===0x1f && u8[1]===0x8b);
    const looksHTM = (u8[0]===0x3C); // '<' -> 404 html
    if (isGzip){
      let text;
      if ('DecompressionStream' in window){
        const res2 = await fetch(u,{cache:'no-store'});
        const ds = new DecompressionStream('gzip');
        const stream = res2.body.pipeThrough(ds);
        text = await new Response(stream).text();
      } else if (window.pako){
        text = pako.ungzip(u8, {to:'string'});
      } else {
        throw new Error('GZIP détecté sans décompresseur');
      }
      const j = JSON.parse(text);
      await cacheSet(CACHE_VERSION+':'+u, j);
      return j;
    }
    if (looksHTM) throw new Error('404html');
    throw new Error('Non-JSON ou tronqué');
  }

  // 1) essaie l’URL telle quelle
  try{
    console.info('[layer] fetch', url);
    return await tryFetch(url);
  }catch(e1){
    // 2) si 404, swap couches<->layers et réessaie une seule fois
    const is404 = String(e1.message||'').startsWith('404');
    const swapped = url.includes('/couches/')
      ? url.replace('/couches/','/layers/')
      : url.includes('/layers/')
        ? url.replace('/layers/','/couches/')
        : null;

    if (is404 && swapped){
      try{
        console.info('[layer] retry with', swapped);
        const j = await tryFetch(swapped);
        // mémorise l’URL corrigée en place pour les prochaines fois
        for (const it of LAYERS){ if (it.url === url) { it.url = swapped; break; } }
        return j;
      }catch(e2){
        // 3) sinon, tente le cache local
        const cached = await cacheGet(CACHE_VERSION+':'+url) || await cacheGet(CACHE_VERSION+':'+swapped);
        if (cached) return cached;
        throw e2;
      }
    } else {
      const cached = await cacheGet(CACHE_VERSION+':'+url);
      if (cached) return cached;
      throw e1;
    }
  }
}

  function normalizeFC(gj){
    const out={type:'FeatureCollection', features:[]};
    const feats = Array.isArray(gj?.features)?gj.features:[]; for (const f of feats){
      const g=f?.geometry; if(!g) continue;
      if (g.type==='GeometryCollection' && Array.isArray(g.geometries) && g.geometries.length){
        for (const gg of g.geometries){ if(!gg) continue; out.features.push({type:'Feature',properties:f.properties||{},geometry:gg}); }
      } else out.features.push(f);
    }
    return out;
  }

  const loaded = new Set(); let maskBounds=null;
  async function ensureLayerLoaded(name){
    if (loaded.has(name)) return;
    const it = LAYERS.find(l => l.name===name); if (!it) return;
    const grp = layerGroups[it.name];
    try{
      const gj = await loadGeoJSONSmart(it.url); const fc = normalizeFC(gj);
      const layer = L.geoJSON(fc,{
        style:styleByGeom,
        pointToLayer:(feat,latlng)=> L.circleMarker(latlng, styleByGeom(feat)),
        onEachFeature
      });
      layer.eachLayer(l=> l.bringToFront());
      grp.clearLayers(); grp.addLayer(layer);
      loaded.add(name);
      console.info('[couche] chargée :', name, 'features=', fc.features.length);
      if (name==='DPT40Masque'){ try{ maskBounds = layer.getBounds(); }catch(_){ } }
    }catch(err){ console.warn(`ERR ${name}:`, err); }
  }
  ensureLayerLoaded('DPT40Masque'); // utile pour bounds
  map.on('overlayadd', async (e)=>{
    const name = Object.keys(layerGroups).find(k => layerGroups[k]===e.layer);
    if (name) await ensureLayerLoaded(name);

  // GPS
  const GPSMeasure = L.Control.extend({
    options:{ position:'topleft' },

      const a = L.DomUtil.create('a','',w); a.href='#'; a.title='Mesurer surface (GPS)'; a.innerHTML='📍▱';

  let gpsState=null;
  function stopGPS(){ if(!gpsState) return;
    if (gpsState.watchId!=null) navigator.geolocation.clearWatch(gpsState.watchId);
    if (gpsState.line) map.removeLayer(gpsState.line);
    if (gpsState.poly) map.removeLayer(gpsState.poly);
    if (gpsState.label) map.removeLayer(gpsState.label);
    if (gpsState.btn) gpsState.btn.classList.remove('active');
    gpsState=null; map.off('contextmenu', stopGPS);
  }
  function startGPS(mode,btnOn){
    if (gpsState?.mode===mode){ stopGPS(); return; }
    stopGPS(); resetManual();
    gpsState={mode, pts:[], line:null, poly:null, label:null, btn:btnOn, watchId:null}; btnOn.classList.add('active');
    if (!('geolocation' in navigator)){ alert('Géolocalisation non disponible.'); stopGPS(); return; }
    try{ gpsState.watchId = navigator.geolocation.watchPosition(onGPS, onGPSError, { enableHighAccuracy:true, maximumAge:1000, timeout:20000 });
      map.on('contextmenu', stopGPS);
    }catch(e){ alert('Impossible de démarrer la géolocalisation.'); stopGPS(); }
  }
  function onGPS(pos){
    const { latitude, longitude } = pos.coords; const ll=L.latLng(latitude,longitude); const s=gpsState; if(!s) return;
    if (s.pts.length){ const last=s.pts[s.pts.length-1]; const d=turf.distance([last.lng,last.lat],[ll.lng,ll.lat],{units:'meters'}); if (d<3) return; }
    s.pts.push(ll);
    if (s.mode==='dist'){
      if (!s.line){ s.line=L.polyline([ll],{color:'#1f78b4',weight:3,dashArray:'6,4'}).addTo(map); } else { s.line.addLatLng(ll); }
      updateGPSLabel(ll, fmtLength(turf.length(turf.lineString(s.pts.map(p=>[p.lng,p.lat])), {units:'kilometers'})*1000));
    }else{
      if (!s.poly){ s.poly=L.polygon(s.pts,{color:'#33a02c',weight:2,fillOpacity:.15}).addTo(map); } else { s.poly.setLatLngs([s.pts]); }
      updateGPSLabel(ll, fmtArea(computeAreaM2(s.pts)));
    }
  }
  function onGPSError(err){ alert('Erreur géolocalisation : ' + (err?.message || err)); stopGPS(); }
  function updateGPSLabel(latlng, text){
    if (gpsState?.label) map.removeLayer(gpsState.label);
    gpsState.label = L.tooltip({permanent:true, direction:'top', offset:[0,-10], className:'measure-label'})
      .setLatLng(latlng).setContent(text).addTo(map);
    if (gpsState){
      if (gpsState.mode==='dist'){
        lastMeasure.length_m = turf.length(turf.lineString(gpsState.pts.map(p=>[p.lng,p.lat])), {units:'kilometers'})*1000; lastMeasure.area_m2 = 0;
      } else {
        lastMeasure.area_m2  = computeAreaM2(gpsState.pts);
        lastMeasure.length_m = turf.length(turf.lineString(gpsState.pts.concat([gpsState.pts[0]]).map(p=>[p.lng,p.lat])), {units:'kilometers'})*1000;
      }
      pushMeasureToValidator(true);
    }
  }
  function exportCurrentMeasure(){
    let pts=null, mode=null;
    if (manualState){ pts=manualState.pts; mode=manualState.mode; }
    else if (gpsState){ pts=gpsState.pts; mode=gpsState.mode; }
    if (!pts || pts.length < (mode==='area'?3:2)){ alert('Aucune mesure à exporter.'); return; }
    let gj;
    if (mode==='dist'){
      gj={ type:'FeatureCollection', features:[{ type:'Feature', properties:{ type:'measure_distance', date:new Date().toISOString() }, geometry:{ type:'LineString', coordinates: pts.map(ll=>[ll.lng,ll.lat]) } }]};
    }else{
      const ring=[...pts.map(ll=>[ll.lng,ll.lat]), [pts[0].lng,pts[0].lat]];
      gj={ type:'FeatureCollection', features:[{ type:'Feature', properties:{ type:'measure_area', date:new Date().toISOString() }, geometry:{ type:'Polygon', coordinates:[ring] } }]};
    }
    const blob=new Blob([JSON.stringify(gj)],{type:'application/geo+json'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download = (mode==='dist'?'mesure_distance':'mesure_surface')+'.geojson'; a.click(); URL.revokeObjectURL(url);
  }

  // Annotations

    draw: { marker:{ repeatMode:true }, polyline:{ shapeOptions:{ color:'#ff7f00', weight:3 } },

            rectangle:false, circle:false, circlemarker:false }
  });
  map.addControl(drawControl);
  const ANNOS_KEY='sd40:annotations';
  function saveAnnotations(){ try{ localStorage.setItem(ANNOS_KEY, JSON.stringify(annotations.toGeoJSON())); }catch(_){ } }
  function loadAnnotations(){ try{ const raw=localStorage.getItem(ANNOS_KEY); if(!raw) return;
    const gj=JSON.parse(raw); L.geoJSON(gj,{ style:()=>({color:'#ff7f00',weight:2,fillOpacity:.2}), pointToLayer:(_f,latlng)=>L.marker(latlng)}).eachLayer(l=>annotations.addLayer(l)); }catch(_){ } }
  loadAnnotations();
  map.on(L.Draw.Event.CREATED, e => {
    annotations.addLayer(e.layer); saveAnnotations();
    try{
      const gj = e.layer.toGeoJSON();
      const g = gj.geometry || {};
      if (g.type === 'Polygon' || g.type === 'MultiPolygon'){
        lastMeasure.area_m2 = turf.area(gj);
        const ring = g.type==='Polygon' ? g.coordinates[0] : g.coordinates[0][0];
        lastMeasure.length_m = turf.length(turf.lineString(ring), {units:'kilometers'})*1000;
      } else if (g.type === 'LineString' || g.type === 'MultiLineString'){
        lastMeasure.length_m = turf.length(gj, {units:'kilometers'})*1000;
        lastMeasure.area_m2 = 0;
      }
      pushMeasureToValidator(true);
    }catch(_){}

  const AnnoExport = L.Control.extend({

        const a=document.createElement('a'); a.href=url; a.download='annotations.geojson'; a.click(); URL.revokeObjectURL(url);
      });
      L.DomEvent.on(c,'click',L.DomEvent.stop).on(c,'click',()=>{ if (!confirm('Supprimer toutes les annotations ?')) return; annotations.clearLayers(); saveAnnotations(); });

  /* ---- PROCÉDURE – DATASETS & UI ---- */
  let IOTA=[], NATINF=[];
  const DEMO_IOTA=[ {code:"3.2.3.0", titre:"Plans d’eau (permanents ou non)"},
                    {code:"3.1.4.0", titre:"Consolidation/protection de berges (techniques non végétales)"},
                    {code:"3.3.1.0", titre:"Zones humides : assèchement, mise en eau, remblais"} ];
  const DEMO_NATINF=[ {natinf:"32673", intitule:"Non-respect d'une prescription attachée à une déclaration IOTA", type:"C5"} ];

  function getEmbeddedPack(){
    try{ const el=document.getElementById('iota-pack-officiel'); return el? JSON.parse(el.textContent) : null; }catch(_){ return null; }
  }
  function setRules(obj){ try{ localStorage.setItem(RULES_KEY, JSON.stringify(obj)); }catch(_){ } }
  function getRules(){ try{ const raw=localStorage.getItem(RULES_KEY); return raw? JSON.parse(raw):{}; }catch(_){ return {}; } }

  (async()=>{
    // 1) IOTA depuis le pack intégré (pas de fetch)
    const pack = getEmbeddedPack();
    if (!pack) { IOTA=DEMO_IOTA; setRules({}); console.warn('Pack IOTA intégré introuvable → démo.'); }
    else {
      IOTA = Array.isArray(pack.iota)? pack.iota : DEMO_IOTA;
      if (pack.rules){ PACK_RULES = pack.rules; setRules(pack.rules); }
    }

    // 2) NATINF (laisse ton fichier existant)
    try{
      const r = await fetch('data/natinf_env_2023-10.json',{cache:'no-store'});
      NATINF = r.ok ? await r.json() : DEMO_NATINF;
    }catch(_){ NATINF = DEMO_NATINF; }

    initProc();
  })();

  function normG(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
  function natinfSuggestForIota(iotaCode){
    const fam = String(iotaCode||'').split('.')[0];
    let kw = ['iota','declaration','autorisation','prescription','opposition'];
    if (fam==='1'){ kw = kw.concat(['prelev','pompage','ouvrage','eau']); }
    else if (fam==='2'){ kw = kw.concat(['rejet','effluent','assainissement','eaux pluviales']); }
    else if (fam==='3'){ kw = kw.concat(['installation','ouvrage','cours','plan','berge','continuite','zone humide']); }
    else if (fam==='4'){ kw = kw.concat(['marin','dragage','port']); }
    const scored = (Array.isArray(NATINF)? NATINF : []).map(n=>{
      const t = normG(n.intitule)+' '+normG(n.type||''); let s = 0; kw.forEach(k=>{ if (t.includes(k)) s++; });
      if (t.includes('iota')) s+=2; return { n, score:s };
    }).filter(x=>x.score>0).sort((a,b)=> b.score - a.score);
    return scored.slice(0,8).map(x=>({natinf:x.n.natinf, intitule:x.n.intitule}));
  }

  function initProc(){
    // Onglets
    $$('.proc-tabs button').forEach(b=>{
      b.addEventListener('click', ()=>{
        $$('.proc-tabs button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active'); const tab=b.dataset.tab;
        $$('.tab').forEach(x=>x.hidden=(x.id!=='tab-'+tab));

    // IOTA search
    const iotaList = $('#iotaList');
    function renderIota(q=''){
      q=q.trim().toLowerCase();
      const out = IOTA.filter(x=> (x.code||'').includes(q) || (x.titre||'').toLowerCase().includes(q));
      iotaList.innerHTML = out.map(x=>`<div class="row" style="padding:4px 0">
        <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
          <input type="radio" name="iotaPick" value="${x.code}">
          <div><b>${x.code}</b> — ${x.titre}</div>
        </label>
      </div>`).join('') || '<em>Aucune rubrique</em>';
      $$('input[name=iotaPick]', iotaList).forEach(r=>{
        r.addEventListener('change', ()=>{
          $('#ftRefIota').value = r.value;
          $('#valRubrique').value = r.value;
          buildValParams();

          // NATINF : mise à jour (remplace)
          const suggested = natinfSuggestForIota(r.value).slice(0,3).map(x=>x.natinf);
          $('#ftRefNatinf').value = suggested.join(', ');
        });
      });
    }
    renderIota();
    $('#iotaSearch').addEventListener('input', (e)=>renderIota(e.target.value));

    // NATINF helpers (BCAE/Phyto/Autre)
    function pickNatinf(listEl, arr){
      listEl.innerHTML = arr.slice(0,200).map(n=>`<div class="row" style="padding:4px 0">
        <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
          <input type="radio" name="${listEl.id}-pick" value="${n.natinf}">
          <div><b>${n.natinf}</b> — ${n.intitule} ${n.type?`<span class="badge">${n.type}</span>`:''}</div>
        </label>
      </div>`).join('') || '<em>Aucun résultat</em>';
      $$('input[type=radio]', listEl).forEach(r=>{
        r.addEventListener('change', ()=>{ $('#ftRefNatinf').value = r.value; });
      });
    }
    const BCAE_KEYS = ['bcae','zone humide','drainage','nitrates','programme d\'action','bande tampon','haie','prairie'];
    const PHYTO_KEYS = ['phytopharmaceutique','phytosanitaire','certificat individuel','neonicotinoide','amm','znt','biocide'];
    const bcaeList = $('#bcaeList'), phytoList = $('#phytoList'), autreList = $('#autreList');

    function filterBCAE(q){ const n=normG(q); return NATINF.filter(nf=>{ const t=normG(nf.intitule); return BCAE_KEYS.some(k=>t.includes(normG(k))) || t.includes(n); }); }
    function filterPHYTO(q){ const n=normG(q); return NATINF.filter(nf=>{ const t=normG(nf.intitule); return PHYTO_KEYS.some(k=>t.includes(normG(k))) || t.includes(n); }); }

    $('#bcaeSearch').addEventListener('input', (e)=> pickNatinf(bcaeList, filterBCAE(e.target.value))); pickNatinf(bcaeList, filterBCAE('zone humide'));
    $('#phytoSearch').addEventListener('input', (e)=> pickNatinf(phytoList, filterPHYTO(e.target.value))); pickNatinf(phytoList, filterPHYTO('phytopharmaceutique'));
    $('#autreSearch').addEventListener('input', (e)=>{ const q=normG(e.target.value); const out=NATINF.filter(nf=> normG(nf.intitule).includes(q) || (nf.natinf||'').includes(q)); pickNatinf(autreList, out); });

    // Badge lat/lng
    function updateLatLngBadge(ll){ $('#ftLatLng').textContent = ll ? `Lat ${ll.lat.toFixed(5)} / Lng ${ll.lng.toFixed(5)}` : '—'; }
    map.on('click', (e)=> updateLatLngBadge(e.latlng)); updateLatLngBadge(map.getCenter());

    // Complétude
    function evalScore(){ const f=[ $('#ftTitre').value, $('#ftDesc').value, $('#ftRefIota').value, $('#ftRefNatinf').value ]; const n=f.filter(x=>String(x||'').trim().length>0).length;
      $('#ftScore').textContent = (n>=4? 'OK (4/4)': n+'/4'); }
    ['#ftTitre','#ftDesc','#ftRefIota','#ftRefNatinf'].forEach(sel=> $(sel).addEventListener('input', evalScore)); evalScore();

    // Exports fiche
    $('#btnProcGJ').addEventListener('click', ()=>{
      const ll = map.getCenter();
      const props = { titre:$('#ftTitre').value, lieu:$('#ftLieu').value, desc:$('#ftDesc').value, iota:$('#ftRefIota').value, natinf:$('#ftRefNatinf').value, date:new Date().toISOString() };
      const gj = { type:'FeatureCollection', features:[{ type:'Feature', properties:props, geometry:{ type:'Point', coordinates:[ll.lng,ll.lat] } }]};
      const blob = new Blob([JSON.stringify(gj)], {type:'application/geo+json'});
      const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href = url; a.download = 'fiche-terrain.geojson'; a.click(); URL.revokeObjectURL(url);
    });

    $('#btnProcPDF').addEventListener('click', async ()=>{
      const { jsPDF } = window.jspdf; const pdf = new jsPDF({unit:'pt', format:'a4'});
      pdf.setFontSize(14); pdf.text('FICHE TERRAIN – Procédure', 40, 40);
      pdf.setFontSize(11);
      const lines = [
        `Titre : ${$('#ftTitre').value || ''}`,
        `Lieu  : ${$('#ftLieu').value || ''}`,
        `IOTA  : ${$('#ftRefIota').value || ''}`,
        `NATINF: ${$('#ftRefNatinf').value || ''}`,
        `Date  : ${new Date().toLocaleString()}`
      ];
      lines.forEach((t,i)=> pdf.text(t, 40, 70 + i*16));
      const res = $('#valResult').textContent || '—';
      const trace = $('#valTrace').innerText || '';
      pdf.text(`Validateur IOTA : ${res}`, 40, 170);
      pdf.setFont('courier','normal'); pdf.setFontSize(9);
      pdf.text((trace||'').substring(0,2200), 40, 186, { maxWidth:520, lineHeightFactor:1.2 });
      pdf.setFont('helvetica','normal'); pdf.setFontSize(11);
      const desc = $('#ftDesc').value || '';
      const wrapped = pdf.splitTextToSize(desc, 520);
      pdf.text('Constats :', 40, 320);
      pdf.text(wrapped, 40, 338);
      try{
        const canvas = await html2canvas(document.getElementById('map'), {useCORS:true, scale:1});
        const img = canvas.toDataURL('image/jpeg', 0.85);
        const w = 520, h = w * (canvas.height/canvas.width);
        pdf.addPage(); pdf.text('Localisation – aperçu carte', 40, 40);
        pdf.addImage(img, 'JPEG', 40, 60, w, Math.min(h, 680));
      }catch(_){ }
      pdf.save('fiche-terrain.pdf');
    });

    // Reset total
    $('#btnResetAll').addEventListener('click', ()=>{
      ['#ftTitre','#ftLieu','#ftDesc','#ftRefIota','#ftRefNatinf'].forEach(s=> $(s).value='');
      $('#ftScore').textContent='—'; $('#ftLatLng').textContent='—';
      $('#valRubrique').value=''; $('#valParams').innerHTML=''; $('#valResult').textContent='—'; $('#valTrace').innerHTML='';
      lastMeasure = { mode:null, length_m:0, area_m2:0 };
      resetManual(); stopGPS();
      if (typeof annotations !== 'undefined'){ annotations.clearLayers(); try{ localStorage.removeItem('sd40:annotations'); }catch(_){ } }
      $$('input[name=iotaPick]').forEach(r=> r.checked=false);
    });

    /* ===== VALIDATEUR IOTA ===== */
    function resetRules(){
      const pack = getEmbeddedPack();
      if (pack && pack.rules){ setRules(pack.rules); alert('Règles réinstallées (pack intégré).'); buildValParams(); }
      else { alert('Pack intégré absent.'); }
    }

    // rendu humain
    function fmtNum(x){ const n=Number(x); if(!isFinite(n)) return String(x||''); return n.toLocaleString('fr-FR'); }
    function humanizeCond(raw, def){
      let s = String(raw);
      (def?.params||[]).forEach(p=>{
        const re=new RegExp(`\\b${p.id}\\b`,'g'); s=s.replace(re, p.label||p.id);
      });
      s = s.replace(/\s*>=\s*/g,' ≥ ')
           .replace(/\s*<=\s*/g,' ≤ ')
           .replace(/\s*>\s*/g,' > ')
           .replace(/\s*<\s*/g,' < ')
           .replace(/\s*==\s*/g,' = ')
           .replace(/\s*&&\s*/g,' ET ')
           .replace(/\s*\|\|\s*/g,' OU ')
           .replace(/'([^']+)'/g,'$1');
      return s.trim();
    }
    function buildHumanExplanation(def, ctx, logic, hitIndex, decision, ref){
      let html = `<div style="margin:.25rem 0 .5rem"><b>${def.label||''}</b></div>`;
      if (def.params?.length){
        html += `<div class="kv" style="margin-bottom:6px">`;
        def.params.forEach(p=>{
          const v = ctx[p.id]; const u = (p.label||'').match(/\(([^)]+)\)/)?.[1] || '';
          html += `<b>${p.label} :</b> <span>${fmtNum(v)}${u?` ${u.split('/')[0]||''}`:''}</span>`;
        });
        html += `</div>`;
      }
      if (Array.isArray(logic) && logic.length){
        html += `<div style="font-weight:600;margin:6px 0 2px">Critères évalués :</div><ul style="margin:.15rem 0 .5rem .9rem">`;
        logic.forEach((rule, i)=>{
          if (rule.if){
            const txt = humanizeCond(rule.if, def);
            const regime = rule.regime || '';
            const ok = (i === hitIndex);
            html += `<li>${txt} <span class="badge" style="margin-left:.35rem">${regime||'—'}</span> — ${ok?'<b>rempli</b>':'non rempli'}</li>`;
          } else {
            const r = rule.else || 'HN';
            const ok = (i === hitIndex);
            html += `<li>Sinon <span class="badge" style="margin-left:.35rem">${r}</span> — ${ok?'<b>appliqué</b>':'non appliqué'}</li>`;
          }
        });
        html += `</ul>`;
      }
      html += `<div style="margin:.25rem 0"><b>Régime :</b> <span class="pill" style="margin-left:.35rem">${decision}</span>${ref?` <span class="note">(${ref})</span>`:''}</div>`;
      html += `<div class="note" style="margin-top:.25rem">Résultat indicatif, à confronter aux textes en vigueur.</div>`;
      return html;
    }

    function buildValParams(){
      const code = ($('#valRubrique').value||'').trim();
      const rules = getRules(); const def = rules[code];
      const cont = $('#valParams'); cont.innerHTML = '';
      if (!def){
        ensureParamInput('surface_m2','Surface (m²)');
        ensureParamInput('longueur_m','Longueur (m)');
        const note = document.createElement('div'); note.className='note';
        note.textContent = "Mode secours : Surface/Longueur visibles même sans règle chargée.";
        cont.appendChild(note);
        return;
      }
      def.params?.forEach(p=>{
        const wrap=document.createElement('div');
        const lab=document.createElement('label'); lab.textContent=p.label; lab.style.fontSize='13px';
        const inp=document.createElement('input'); inp.type=p.type||'text'; inp.id='param_'+p.id; inp.placeholder=p.label;
        wrap.appendChild(lab); wrap.appendChild(inp); cont.appendChild(wrap);
      });
    }
    $('#valRubrique').addEventListener('input', buildValParams); buildValParams();

    $('#btnEval').addEventListener('click', ()=>{
      const code = ($('#valRubrique').value||'').trim();
      const rules = getRules(); const def = rules[code];
      if (!def){ $('#valResult').textContent='Règle manquante'; $('#valTrace').innerHTML=''; return; }

      const ctx={}; (def.params||[]).forEach(p=>{
        const v=parseFloat(($('#param_'+p.id)?.value||'').replace(',','.'));
        ctx[p.id] = isFinite(v)? v : 0;
      });

      let decision='HN', ref=''; let hitIndex=-1;
      for (let i=0; i<(def.logic||[]).length; i++){
        const rule = def.logic[i];
        if (rule.if){
          const ok = (function(expr, ctx){
            const safe = expr
              .replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, (id)=> (id in ctx ? String(ctx[id]??0) : id))
              .replace(/[^0-9<>=!&|().+*\-\/ %]/g,'');
            try{ return !!eval(safe); }catch(_){ return false; }
          })(rule.if, ctx);
          if (ok){ decision=rule.regime||'HN'; ref=rule.ref||''; hitIndex=i; break; }
        } else { decision = rule.else || 'HN'; ref=rule.ref||''; hitIndex=i; break; }
      }

      $('#valResult').textContent = decision;
      $('#valTrace').innerHTML = buildHumanExplanation(def, ctx, def.logic, hitIndex, decision, ref);

      if (!$('#ftRefIota').value) $('#ftRefIota').value = code;

      // NATINF : mise à jour (REMPLACE)
      const suggested = natinfSuggestForIota(code).slice(0,3).map(x=>x.natinf);
      if (suggested.length) { $('#ftRefNatinf').value = suggested.join(', '); }
    });

    // Éditeur de règles + reset (appui long)
    $('#btnRules').addEventListener('click', ()=>{
      const now = JSON.stringify(getRules(), null, 2);
      const txt = prompt('Édite les règles (JSON strict : guillemets doubles, pas de virgule traînante)\nExemple: {"if":"surface_m2 >= 1000","regime":"D"}', now);
      if (txt==null) return;
      try{ const obj=JSON.parse(txt); setRules(obj); alert('Règles enregistrées.'); buildValParams(); }
      catch(e){ alert('JSON invalide : '+e.message); }
    });
    let rulesPressTimer=null;
    $('#btnRules').addEventListener('mousedown', ()=>{ rulesPressTimer = setTimeout(()=> resetRules(), 800); });
    ['mouseup','mouseleave'].forEach(ev=> $('#btnRules').addEventListener(ev, ()=>{ if (rulesPressTimer){ clearTimeout(rulesPressTimer); rulesPressTimer=null; } }));
  }

  /* ---- Utils ---- */
  proj4.defs('EPSG:2154', '+proj=lcc +lat_1=49 +lat_2=44 +lat_0=46.5 +lon_0=3 +x_0=700000 +y_0=6600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');
  function computeLengthMeters(latlngs){ if (latlngs.length<2) return 0; const line=turf.lineString(latlngs.map(ll=>[ll.lng,ll.lat])); return turf.length(line,{units:'kilometers'})*1000; }
  function computeAreaM2(latlngs){ if (latlngs.length<3) return 0; const ring=[...latlngs.map(ll=>[ll.lng,ll.lat]), [latlngs[0].lng,latlngs[0].lat]]; return turf.area(turf.polygon([ring])); }
  function fmtLength(m){ return m<1000 ? `${m.toFixed(1)} m` : `${(m/1000).toFixed(3)} km`; }
  function fmtArea(m2){ if (m2<10000) return `${m2.toFixed(0)} m²`; const ha=m2/10000; if (ha<100) return `${ha.toFixed(2)} ha`; return `${(m2/1e6).toFixed(3)} km²`; }

})();
</script>
</body>
</html>
