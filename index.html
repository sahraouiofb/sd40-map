<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SD40 – Carte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map { height:100%; margin:0 }
    .leaflet-control-layers-expanded { max-height: 80vh; overflow-y:auto; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ⚠️ Vérifie que chaque URL ci-dessous pointe vers .geojson ou .geojson.gz selon le VRAI fichier dans /layers
  const LAYERS = [
    { name: "Axe_realimentes_Institution_Adour", url: "layers/Axe_realimentes_Institution_Adour.geojson" },
    { name: "BDT_3_5_Bassin_Versant", url: "layers/BDT_3_5_Bassin_Versant.geojson" },
    { name: "BDT_3_5_Plan_d_eau", url: "layers/BDT_3_5_Plan_d_eau.geojson" },
    { name: "BDT_3_5_Reservoir", url: "layers/BDT_3_5_Reservoir.geojson" },
    { name: "Cadastre_parcelles_Flux", url: "layers/Cadastre_parcelles_Flux.geojson" }, // ou .geojson.gz si compressé
    { name: "DCE_2022_2027_masses_deau_cotiere_Adour_Garonne", url: "layers/DCE_2022_2027_masses_deau_cotiere_Adour_Garonne.geojson" },
    { name: "DCE_2022_2027_masses_deau_de_transition_Adour_Garonne", url: "layers/DCE_2022_2027_masses_deau_de_transition_Adour_Garonne.geojson" },
    { name: "DCE__2022_2027__BV_specifique__AG", url: "layers/DCE__2022_2027__BV_specifique__AG.geojson" },
    { name: "DCE__2022_2027__plans_deau__adour_garonne", url: "layers/DCE__2022_2027__plans_deau__adour_garonne.geojson" },
    { name: "DDT40_Carto_Cours_d_Eau_validee", url: "layers/DDT40_Carto_Cours_d_Eau_validee.geojson" },
    { name: "DDT40_Plan_d_Eau_loi_Eau", url: "layers/DDT40_Plan_d_Eau_loi_Eau.geojson" },
    { name: "DDT40_retenue_d_eau", url: "layers/DDT40_retenue_d_eau.geojson" },
    { name: "DPT40Masque", url: "layers/DPT40Masque.geojson" },
    { name: "DREAL_points_nodaux", url: "layers/DREAL_points_nodaux.geojson" },
    { name: "IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux", url: "layers/IGN_BCAE2_TOURBIERES_ZONES-HUMIDES_Flux.geojson" },
    { name: "INRAe_carte_sols", url: "layers/INRAe_carte_sols.geojson" }, // passe en .gz si besoin
    { name: "Isochrones_nappe_alluviale_adour_IA", url: "layers/Isochrones_nappe_alluviale_adour_IA.geojson" },
    { name: "ONF_Foret", url: "layers/ONF_Foret.geojson" },
    { name: "ZAS_sup_40_2024", url: "layers/ZAS_sup_40_2024.geojson" },
    { name: "ZRE_-_2013", url: "layers/ZRE_-_2013.geojson" },
    { name: "Zones_port_es_par_les_arr_t_s", url: "layers/Zones_port_es_par_les_arr_t_s.geojson" },
    { name: "Zones_portes_arretes", url: "layers/Zones_portes_arretes.geojson" },
    { name: "axes_raliments_l_cde_retenues_l93_institution_adour", url: "layers/axes_raliments_l_cde_retenues_l93_institution_adour.geojson" },
    { name: "pe_aci_adour", url: "layers/pe_aci_adour.geojson" },
    { name: "sortie", url: "layers/sortie.geojson" }
  ];

  // 1) Carte
  const map = L.map('map', {zoomControl: true}).setView([43.85, -0.7], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 20, attribution: '© OpenStreetMap'
  }).addTo(map);

  // 2) Contrôle des couches — créé UNE FOIS, puis alimenté dynamiquement
  const layersControl = L.control.layers({}, {}, {collapsed: false}).addTo(map);

  // 3) Styles selon géométrie
  function styleFeature(feature) {
    const t = feature.geometry?.type || '';
    if (t === 'Point' || t === 'MultiPoint') {
      return {radius: 5, fillColor: '#e31a1c', color: '#ffffff', weight: 1, opacity: 1, fillOpacity: 0.85};
    }
    if (t.includes('Line')) {
      return {color: '#1f78b4', weight: 2, opacity: 0.9};
    }
    // Polygones
    return {color: '#33a02c', weight: 1, opacity: 0.9, fillOpacity: 0.25};
  }

  // 4) Popups attributaires
  function onEachFeature(feature, layer) {
    if (!feature || !feature.properties) return;
    let html = '<table style="border-collapse:collapse">';
    for (const [k,v] of Object.entries(feature.properties)) {
      if (v === null || v === undefined || String(v).trim()==='') continue;
      html += `<tr><th style="text-align:left;padding:2px 6px 2px 0;border-bottom:1px solid #eee">${k}</th><td style="padding:2px 0;border-bottom:1px solid #eee">${v}</td></tr>`;
    }
    html += '</table>';
    layer.bindPopup(html);
  }

  // 5) Chargement d’un GeoJSON (texte ou gz)
  async function loadGeoJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status+' '+res.statusText);
    if (url.toLowerCase().endsWith('.gz')) {
      if (!('DecompressionStream' in window)) throw new Error('Navigateur sans DecompressionStream (prends des .geojson non zippés).');
      const ds = new DecompressionStream('gzip');
      const decompressed = res.body.pipeThrough(ds);
      return await new Response(decompressed).json();
    }
    return await res.json();
  }

  // 6) Charge chaque couche et l’ajoute AU CONTRÔLE
  (async function(){
    for (const item of LAYERS) {
      try {
        const data = await loadGeoJSON(item.url);

        // Gère GeometryCollection (certaines couches admin/cadastre)
        function normalizeGeom(f) {
          const g = f.geometry;
          if (g && g.type === 'GeometryCollection' && Array.isArray(g.geometries) && g.geometries.length) {
            return {...f, geometry: g.geometries[0]}; // on prend la première géométrie
          }
          return f;
        }
        const fc = (data.type === 'FeatureCollection') ? data
                 : {type:'FeatureCollection', features:(Array.isArray(data.features)?data.features:[])};
        fc.features = fc.features.map(normalizeGeom).filter(f => !!f.geometry);

        const layer = L.geoJSON(fc, {
          style: styleFeature,
          pointToLayer: (feat, latlng) => L.circleMarker(latlng, styleFeature(feat)),
          onEachFeature
        });

        // Ajoute la couche au contrôle (cases à cocher visibles)
        layersControl.addOverlay(layer, item.name);

        // (Option) l’afficher par défaut :
        layer.addTo(map);

      } catch(e) {
        console.error('Erreur sur', item.name, e);
      }
    }
  })();
</script>

</body>
</html>

</script>
