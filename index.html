<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>SD40 – Carte + Procédure (IOTA/BCAE/Phyto + NATINF + Validateur)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Leaflet & plugins CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

<style>
  html,body,#map{height:100%;margin:0}
  [hidden]{display:none !important}

  /* ===== Liste des couches — large et tactile ===== */
  .leaflet-control-layers-expanded{max-height:70vh;overflow:auto}
  .leaflet-control-layers .leaflet-control-layers-list label{
    display:flex; align-items:center; gap:10px; line-height:1.3; padding:6px 8px; font-size:14px;
  }
  .leaflet-control-layers-overlays input[type="checkbox"]{width:18px;height:18px;margin-left:0}
  @media (max-width:820px){
    .leaflet-control-layers{
      position:fixed; top:56px; right:8px; left:8px; z-index:2000;
      width:auto; max-width:none; box-shadow:0 8px 24px rgba(0,0,0,.35)
    }
    .leaflet-control-layers-overlays input[type="checkbox"]{width:22px;height:22px}
    .leaflet-control-layers .leaflet-control-layers-list label{font-size:16px}
  }

  /* Boutons “Procédure” + “Couches” (dans le même contrôle) */
  .layer-toggle-wrap.leaflet-control{
    background:#111827;color:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);
    overflow:hidden;border:1px solid #0b1220;
    display:flex;
  }
  .layer-toggle-btn{
    display:flex;align-items:center;gap:10px;padding:10px 14px;font:600 14px system-ui;
    color:#fff;background:#111827;border:0;cursor:pointer
  }
  .layer-toggle-btn + .layer-toggle-btn{
    border-left:1px solid #0b1220;
  }
  .layer-toggle-btn:hover{background:#0f172a}

  /* Outils */
  .tool-btn.leaflet-bar a,
  .fullscreen-btn.leaflet-bar a{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;font:20px/1.1 system-ui; text-decoration:none; user-select:none;
  }
  .tool-btn.leaflet-bar a.active{background:#1f78b4;color:#fff}

  /* Popups */
  .popup-card{font:14px/1.35 system-ui,Segoe UI,Roboto,Arial;max-width:360px}
  .popup-title{font-weight:700;margin:0 0 .25rem}
  .popup-table{width:100%;border-collapse:collapse;font-size:13px}
  .popup-table th{white-space:nowrap;text-align:left;color:#22313f;font-weight:600;padding:.25rem .5rem .25rem 0;border-bottom:1px solid #eef}
  .popup-table td{padding:.25rem 0;border-bottom:1px solid #f2f4f7;word-break:break-word}

  .measure-label{
    background:#0b2239;color:#fff;padding:4px 6px;border-radius:4px;
    font:12px/1.2 system-ui; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  @media (max-width:480px){ .popup-card{max-width:90vw} }

  /* Masquage global des outils (sauf plein écran) */
  body.tools-hidden .leaflet-draw,
  body.tools-hidden .tool-btn { display:none !important; }

  .tools-toggle.leaflet-control{
    background:#111827;color:#fff;border:1px solid #0b1220;border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.35); overflow:hidden
  }
  .tools-toggle button{
    display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;
    background:#111827;color:#fff;border:0;cursor:pointer;font:600 14px system-ui
  }
  .tools-toggle button:hover{background:#0f172a}

  /* Procédure drawer */
  .proc-drawer{
    position:absolute;right:10px;top:70px;z-index:4000;
    width:min(520px,96vw); max-height:82vh; display:flex; flex-direction:column;
    background:#fff; border:1px solid #d0d7e1; border-radius:12px;
    box-shadow:0 12px 28px rgba(0,0,0,.25); overflow:hidden
  }
  .proc-header{display:flex;gap:8px;align-items:center;justify-content:space-between; padding:10px 12px;background:#0b2239;color:#fff;font:600 14px system-ui}
  .proc-tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #eef; flex-wrap:wrap}
  .proc-tabs button{border:1px solid #d0d7e1;background:#f8fafc;padding:6px 10px;border-radius:8px;cursor:pointer}
  .proc-tabs button.active{background:#0b2239;color:#fff;border-color:#0b2239}
  .proc-body{padding:10px;overflow:auto}
  .proc-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .proc-row > *{flex:1 1 160px}
  .proc-actions{display:flex;gap:8px;justify-content:flex-end;padding:10px;border-top:1px solid #eef}

  .badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#e8eef6;color:#0b2239;font-weight:600;font-size:12px}
  .note{font-size:12px;color:#475569}
  .pill{display:inline-flex;align-items:center;gap:.35rem;padding:2px 10px;border-radius:999px;font-weight:800}
  .pill-A{background:#fee2e2;color:#991b1b}  /* Autorisation */
  .pill-D{background:#ffedd5;color:#9a3412}  /* Déclaration */
  .pill-HN{background:#e5e7eb;color:#374151} /* Hors nomenclature */
  .kv{display:grid;grid-template-columns:180px 1fr;gap:6px;font-size:13px}
  .kv b{color:#0b2239}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px}

  /* Croquis modal — PLEIN ÉCRAN */
  .sketch-modal{
    position:fixed;
    inset:0;
    display:flex;
    align-items:stretch;
    justify-content:center;
    background:rgba(0,0,0,.45);
    z-index:5000;
  }
  .sketch-card{
    background:#fff;
    border-radius:0;
    box-shadow:none;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:0;
  }
  .sketch-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eef;background:#f8fafc}
  .sketch-left,.sketch-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sketch-canvas{flex:1;background:#fff}
  .sketch-toolbar select,.sketch-toolbar input[type="color"],.sketch-toolbar input[type="range"]{height:32px}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap}
  .thumbs img{width:68px;height:68px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb}

  /* Outils croquis avancés */
  .sk-tool{
    padding:4px 6px;
    border-radius:6px;
    border:1px solid #d0d7e1;
    background:#ffffff;
    font:600 11px system-ui;
    cursor:pointer;
  }
  .sk-tool + .sk-tool{ margin-left:4px; }
  .sk-tool.active{
    background:#0b2239;
    color:#ffffff;
    border-color:#0b2239;
  }

  /* Panneau de mesures */
  .leaflet-control.measure-panel{
    border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
    overflow:hidden;
  }
  .leaflet-control.measure-panel button{
    border:1px solid #d0d7e1;
    background:#f8fafc;
    border-radius:6px;
    cursor:pointer;
  }
  .leaflet-control.measure-panel button:hover{
    background:#e5e7eb;
  }
  /* Panneau mesures caché quand outils masqués */
  body.tools-hidden .leaflet-control.measure-panel{
    display:none !important;
  }
</style>
</head>

<body>
  <div id="map"></div>

  <!-- ===================== UI Procédure ===================== -->
  <div id="proc" class="proc-drawer" hidden>
    <div class="proc-header">
      <span>🗂️ Procédure terrain</span>
      <div style="display:flex;gap:8px">
        <button id="btnRules" type="button" style="border:0;background:#fff;color:#0b2239;border-radius:8px;padding:6px 8px" title="Éditer les règles IOTA (JSON)">⚙️ Règles IOTA</button>
        <button id="btnProcClose" type="button" style="border:0;background:#fff;color:#0b2239;border-radius:8px;padding:6px 8px" title="Fermer le panneau">Fermer</button>
      </div>
    </div>

    <div class="proc-tabs">
      <button data-tab="iota" class="active" type="button">IOTA</button>
      <button data-tab="bcae" type="button">BCAE</button>
      <button data-tab="phyto" type="button">Phyto</button>
      <button data-tab="autre" type="button">Autre</button>
      <button data-tab="validator" type="button">Validateur IOTA</button>
    </div>

    <div class="proc-body">
      <!-- IOTA -->
      <div class="tab" id="tab-iota">
        <div class="proc-row"><input id="iotaSearch" placeholder="Rechercher rubrique (ex : 3.2.3.0, ‘plans d’eau’)" /></div>
        <div id="iotaList"></div>
        <div class="note">Cochez une ou plusieurs rubriques : elles sont ajoutées à la fiche et évaluées. Appui long sur ⚙️ pour réinitialiser les règles intégrées.</div>
      </div>

      <!-- BCAE -->
      <div class="tab" id="tab-bcae" hidden>
        <div class="proc-row"><input id="bcaeSearch" placeholder="Mot-clé (ex: ‘zone humide’, ‘drainage’, ‘nitrates’)" /></div>
        <div id="bcaeList"></div>
      </div>

      <!-- Phyto -->
      <div class="tab" id="tab-phyto" hidden>
        <div class="proc-row"><input id="phytoSearch" placeholder="Mot-clé (ex: ‘phytopharmaceutique’, ‘certificat’, ‘néonicotinoïdes’)" /></div>
        <div id="phytoList"></div>
      </div>

      <!-- Autre -->
      <div class="tab" id="tab-autre" hidden>
        <div class="proc-row"><input id="autreSearch" placeholder="Recherche NATINF (mot-clé ou code)"/></div>
        <div id="autreList"></div>
      </div>

      <!-- VALIDATEUR IOTA -->
      <div class="tab" id="tab-validator" hidden>
        <div class="proc-row">
          <input id="valRubrique" placeholder="Rubrique IOTA (ex : 3.2.3.0)" />
          <select id="valGeom">
            <option value="point">Point</option>
            <option value="line">Ligne</option>
            <option value="polygon">Polygone</option>
          </select>
        </div>
        <div id="valParams" class="proc-row"></div>
        <div class="proc-row" style="align-items:center">
          <button id="btnEval" type="button">Évaluer le régime</button>
          <span id="valResult" class="pill pill-HN">—</span>
        </div>
        <div id="valTrace" class="mono"></div>
      </div>

      <hr>

      <!-- Fiche terrain -->
      <div class="proc-row"><input id="ftTitre" placeholder="Titre de l’intervention" /></div>
      <div class="proc-row"><input id="ftLieu" placeholder="Lieu / commune" /></div>
      <div class="proc-row"><textarea id="ftDesc" rows="4" placeholder="Constats, mesures, éléments matériels, témoins…"></textarea></div>
      <div class="proc-row">
        <input id="ftRefIota" placeholder="Rubrique IOTA retenue (séparées par des virgules)" />
        <input id="ftRefNatinf" placeholder="NATINF retenu (codes séparés par des virgules)" />
      </div>

      <!-- Pièces : Photo & Croquis -->
      <div class="proc-row">
        <button id="btnPhoto" type="button">📷 Ajouter une photo</button>
        <button id="btnSketch" type="button">✏️ Croquis</button>
        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      </div>
      <div class="proc-row">
        <div><b>Pièces jointes :</b></div>
        <div id="piecesList" class="thumbs"></div>
      </div>

      <div class="kv">
        <b>Coordonnées :</b> <span class="badge" id="ftLatLng">—</span>
        <b>Complétude :</b> <span class="badge" id="ftScore">—</span>
      </div>
    </div>

    <div class="proc-actions">
      <button id="btnResetAll" type="button" style="margin-right:auto">Remettre à zéro</button>
      <button id="btnProcPDF" type="button">Exporter PDF</button>
      <button id="btnProcGJ" type="button">Exporter GeoJSON</button>
    </div>
  </div>

  <!-- ========= PACK IOTA INTÉGRÉ ========= -->
  <script type="application/json" id="iota-pack-officiel">
  {
    "iota": [
      {"code":"1.1.1.0","titre":"Sondage, forage (non domestique) – recherche/surveillance d’eaux souterraines"},
      {"code":"1.1.2.0","titre":"Prélèvements en eaux souterraines (volume annuel)"},
      {"code":"1.2.1.0","titre":"Prélèvements en cours d’eau/nappe d’accompagnement/plan-canal alimenté"},
      {"code":"1.2.2.0","titre":"Prélèvements quand l’étiage est majoritairement réalimenté artificiellement"},
      {"code":"1.3.1.0","titre":"Prélèvements en zone à seuils abaissés (répartition quantitative)"},
      {"code":"2.1.1.0","titre":"Assainissement collectif / ANC (charge DBO5)"},
      {"code":"2.1.3.0","titre":"Épandage/stockage de boues en vue d’épandage"},
      {"code":"2.1.4.0","titre":"Épandage/stockage d’effluents ou de boues (hors 2.1.3.0, effluents d’élevage)"},
      {"code":"2.1.5.0","titre":"Rejet d’eaux pluviales (surface interceptée)"},
      {"code":"2.2.1.0","titre":"Rejet susceptible de modifier le régime des eaux en surface"},
      {"code":"2.2.3.0","titre":"Rejet en surface – flux ≥ niveau R1 pour ≥1 paramètre"},
      {"code":"2.3.1.0","titre":"Rejets d’effluents sur le sol/sous-sol (hors 2.1.5.0, etc.)"},
      {"code":"2.3.2.0","titre":"Recharge artificielle des eaux souterraines"},
      {"code":"3.1.1.0","titre":"Obstacle crues / continuité écologique (différence de niveau)"},
      {"code":"3.1.2.0","titre":"Modification profil en long/transversal – dérivation d’un cours d’eau"},
      {"code":"3.1.3.0","titre":"Impact sensible sur la luminosité (longueur)"},
      {"code":"3.1.4.0","titre":"Consolidation/protection de berges (non végétal)"},
      {"code":"3.1.5.0","titre":"Destruction de frayères / zones de croissance/alimentation"},
      {"code":"3.2.1.0","titre":"Entretien de cours d’eau/canaux – volume de sédiments"},
      {"code":"3.2.2.0","titre":"Installations/ouvrages/remblais dans le lit majeur – surface soustraite"},
      {"code":"3.2.3.0","titre":"Plans d’eau (création)"},
      {"code":"3.2.5.0","titre":"Barrages de retenue (classement R.214-112) – y compris vidange (dans l’acte)"},
      {"code":"3.2.6.0","titre":"Ouvrages de prévention inondations/submersions (SE / aménagement hydraulique)"},
      {"code":"3.2.7.0","titre":"Piscicultures d’eau douce (L.431-6)"},
      {"code":"3.3.1.0","titre":"Zones humides : assèchement/mise en eau/imperméabilisation/remblais"},
      {"code":"3.3.2.0","titre":"Drainage (surface drainée)"},
      {"code":"3.3.3.0","titre":"Canalisations hydrocarbures/produits chimiques liquides"},
      {"code":"3.3.4.0","titre":"Recherche/stockage souterrain de déchets radioactifs"},
      {"code":"3.3.5.0","titre":"Travaux de restauration fonctionnelle des milieux aquatiques"},
      {"code":"4.1.1.0","titre":"Travaux portuaires/chenal d’accès (création / modification)"},
      {"code":"4.1.2.0","titre":"Aménagements portuaires (montant des travaux)"},
      {"code":"4.1.3.0","titre":"Dragage et/ou rejet en milieu marin (teneurs/volumes/distance)"},
      {"code":"5.1.1.0","titre":"Réinjection dans la même nappe (géothermie, exhaures, génie civil)"},
      {"code":"5.1.2.0","titre":"Recherche/exploitation de gîtes géothermiques"},
      {"code":"5.1.3.0","titre":"Travaux miniers – recherches, cavités, forages, essais"},
      {"code":"5.1.4.0","titre":"Travaux d’exploitation de mines"},
      {"code":"5.1.5.0","titre":"Exploitation de stockages souterrains de déchets radioactifs"},
      {"code":"5.1.6.0","titre":"Travaux de recherches des mines"},
      {"code":"5.1.7.0","titre":"Prospection/exploitation de substances minérales/fossiles en fonds marins"},
      {"code":"5.2.2.0","titre":"Concessions hydrauliques (Livre V code de l’énergie)"},
      {"code":"5.2.3.0","titre":"Travaux commission d’aménagement foncier (listés)"},
      {"code":"5.2.4.0","titre":"Travaux d’exploitation de mines – autorisation L.621-4-1"}
    ],
    "rules": {
      "1.1.1.0": { "label":"Sondage/forage non domestique (recherche/surveillance d’eaux souterraines)","params":[],"logic":[{"else":"D"}],"ref":"R.214-1 1.1.1.0" },
      "1.1.2.0": { "label":"Prélèvements en eaux souterraines (volume annuel)","params":[{"id":"volume_m3_an","label":"Volume prélevé (m³/an)","type":"number"}], "logic":[{"if":"volume_m3_an >= 200000","regime":"A","ref":"A ≥ 200 000 m³/an"},{"if":"volume_m3_an > 10000 && volume_m3_an < 200000","regime":"D","ref":"10 000–200 000 m³/an"},{"else":"HN"}], "ref":"R.214-1 1.1.2.0" },
      "1.2.1.0": { "label":"Prélèvements en cours d’eau/nappe d’accompagnement/plan-canal alimenté", "params":[{"id":"capacite_m3_h","label":"Capacité (m³/h)","type":"number"},{"id":"part_pct_debit","label":"Part du débit du cours d’eau (%)","type":"number"}], "logic":[{"if":"capacite_m3_h >= 1000 || part_pct_debit >= 5","regime":"A","ref":"A ≥ 1000 m³/h ou ≥ 5 %"},{"if":"(capacite_m3_h >= 400 && capacite_m3_h < 1000) || (part_pct_debit >= 2 && part_pct_debit < 5)","regime":"D","ref":"400–1000 m³/h ou 2–5 %"},{"else":"HN"}], "ref":"R.214-1 1.2.1.0" },
      "1.2.2.0": { "label":"Prélèvements avec étiage majoritairement réalimenté artificiellement", "params":[{"id":"rivieres","label":"Seine/Loire/Marne/Yonne ? (oui/non)","type":"text"},{"id":"capacite_m3_h","label":"Capacité (m³/h) – utile si 'oui'","type":"number"}], "logic":[{"if":"rivieres == 'oui' && capacite_m3_h > 80","regime":"A","ref":"Seine/Loire/Marne/Yonne : A si > 80 m³/h"},{"if":"rivieres == 'oui' && capacite_m3_h <= 80","regime":"HN","ref":"Seine/Loire/Marne/Yonne : ≤ 80 m³/h = HN"},{"if":"rivieres != 'oui'","regime":"A","ref":"Autres cours d’eau : A (cas de réalimentation majoritaire en étiage)"},{"else":"HN"}], "ref":"R.214-1 1.2.2.0" },
      "1.3.1.0": { "label":"Prélèvements en zone à seuils abaissés (répartition quantitative)","params":[{"id":"capacite_m3_h","label":"Capacité (m³/h)","type":"number"}],"logic":[{"if":"capacite_m3_h >= 8","regime":"A","ref":"A ≥ 8 m³/h"},{"else":"D"}],"ref":"R.214-1 1.3.1.0" },
      "2.1.1.0": { "label":"Systèmes d’assainissement collectif / ANC (charge DBO5)","params":[{"id":"dbo5_kg","label":"Charge brute (kg DBO5)","type":"number"}], "logic":[{"if":"dbo5_kg >= 600","regime":"A","ref":"A ≥ 600 kg DBO5"},{"if":"dbo5_kg > 12 && dbo5_kg < 600","regime":"D","ref":"12–600 kg DBO5"},{"else":"HN"}], "ref":"R.214-1 2.1.1.0" },
      "2.1.3.0": { "label":"Épandage/stockage de boues", "params":[{"id":"ms_t_an","label":"Matière sèche (t/an)","type":"number"},{"id":"n_t_an","label":"Azote total (t/an)","type":"number"}], "logic":[{"if":"ms_t_an > 800 || n_t_an > 40","regime":"A","ref":"MS > 800 t/an ou N > 40 t/an"},{"if":"(ms_t_an >= 3 && ms_t_an <= 800) || (n_t_an >= 0.15 && n_t_an <= 40)","regime":"D","ref":"MS 3–800 t/an ou N 0,15–40 t/an"},{"else":"HN"}], "ref":"R.214-1 2.1.3.0" },
      "2.1.4.0": { "label":"Épandage/stockage d’effluents ou de boues (hors 2.1.3.0, effluents d’élevage)", "params":[{"id":"volume_m3_an","label":"Volume annuel (m³/an)","type":"number"},{"id":"n_t_an","label":"Azote total (t/an)","type":"number"},{"id":"dbo5_kg_an","label":"DBO5 (kg/an)","type":"number"}], "logic":[{"if":"volume_m3_an > 50000 || n_t_an > 1 || dbo5_kg_an > 500","regime":"D","ref":"> 50 000 m³/an ou N > 1 t/an ou DBO5 > 500 kg/an"},{"else":"HN"}], "ref":"R.214-1 2.1.4.0" },
      "2.1.5.0": { "label":"Rejet d’eaux pluviales (surface interceptée)","params":[{"id":"surface_ha","label":"Surface totale interceptée (ha)","type":"number"}], "logic":[{"if":"surface_ha >= 20","regime":"A","ref":"A ≥ 20 ha"},{"if":"surface_ha > 1 && surface_ha < 20","regime":"D","ref":"> 1–20 ha"},{"else":"HN"}], "ref":"R.214-1 2.1.5.0" },
      "2.2.1.0": { "label":"Rejet en surface susceptible de modifier le régime des eaux", "params":[{"id":"capacite_rejet_m3_j","label":"Capacité totale de rejet (m³/j)","type":"number"},{"id":"part_pct_debit","label":"Part du débit moyen interannuel (%)","type":"number"}], "logic":[{"if":"capacite_rejet_m3_j > 2000 || part_pct_debit >= 5","regime":"D","ref":"> 2 000 m³/j ou ≥ 5 %"},{"else":"HN"}], "ref":"R.214-1 2.2.1.0" },
      "2.2.3.0": { "label":"Rejet en surface – flux ≥ niveau de référence R1 (≥1 paramètre)","params":[{"id":"r1_ok","label":"Atteint R1 ? (oui/non)","type":"text"}], "logic":[{"if":"r1_ok == 'oui'","regime":"D"},{"else":"HN"}], "ref":"R.214-1 2.2.3.0" },
      "2.3.1.0": { "label":"Rejets d’effluents sur le sol/sous-sol (hors cas exclus)","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 2.3.1.0" },
      "2.3.2.0": { "label":"Recharge artificielle des eaux souterraines","params":[],"logic":[{"else":"A"}],"ref":"R.214-1 2.3.2.0" },

  <script>
  (function(){
    'use strict';

    const $  = (s, r=document)=> r.querySelector(s);
    const $$ = (s, r=document)=> Array.from(r.querySelectorAll(s));

    // Outils (mesure / GPS / annotations / panneau mesures) masqués au démarrage
    document.body.classList.add('tools-hidden');

    /* ---- Procédure : open/close ---- */
    const PROC_KEY='sd40:procVisible';
    const RULES_KEY='sd40:iota_rules_v1';
    let PACK_RULES=null;

    const procEl = $('#proc');
    const btnClose = $('#btnProcClose');

    function openProc(){
      procEl.hidden = false;
      try{ localStorage.setItem(PROC_KEY,'1'); }catch(e){}
    }
    function closeProc(){
      procEl.hidden = true;
      try{ localStorage.setItem(PROC_KEY,'0'); }catch(e){}
    }

    if (btnClose){
      btnClose.addEventListener('click',(e)=>{
        e.preventDefault(); e.stopPropagation(); closeProc();
      });
    }

    document.addEventListener('click', (e)=>{
      if (procEl.hidden) return;
      const inside = procEl.contains(e.target) || e.target.closest('#btnProcOpen');
      if (!inside) closeProc();
    });
    document.addEventListener('keydown',(e)=>{ if (e.key === 'Escape') closeProc(); });

    // On démarre toujours panneau fermé, même si précédemment ouvert
    try{ localStorage.setItem(PROC_KEY,'0'); }catch(e){}

    /* ---- COUCHES ---- */
    const LAYERS = [

      { name:"DDT40_Carto_Cours_d_Eau_validee", url:"layers/DDT40_Carto_Cours_d_Eau_validee.geojson" },

      { name:"pe_aci_adour", url:"layers/pe_aci_adour.geojson" },
      { name:"sortie", url:"layers/sortie.geojson" }
    ];

    /* ---- MAP + Basemaps ---- */
    const map = L.map('map', { zoomControl:true, preferCanvas:true }).setView([43.85,-0.7], 9);

    const baseOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:20, attribution:'© OpenStreetMap'
    }).addTo(map);

    const baseSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:20, attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'

    L.control.scale({metric:true, imperial:false, position:'bottomleft'}).addTo(map);

    try{
      L.control.locate({

      }).addTo(map);

    const baseMaps = { "Plan (OSM)": baseOSM, "Satellite (Esri)": baseSat };
    const layersControl = L.control.layers(baseMaps, {}, {collapsed:false}).addTo(map);

    // Couches fermées au démarrage
    setTimeout(()=>{
      const el = document.querySelector('.leaflet-control-layers');
      if (el) el.style.display = 'none';

    const layerGroups = {};
    for (const it of LAYERS){
      const grp=L.layerGroup();
      layerGroups[it.name]=grp;
      layersControl.addOverlay(grp, it.name);

    /* Boutons “Procédure” + “Couches” dans un seul contrôle Leaflet (toujours visibles, y compris en plein écran) */
    const LayerToggleBig = L.Control.extend({
      options:{ position:'topright' },
      onAdd(){
        const wrap = L.DomUtil.create('div','layer-toggle-wrap leaflet-control');

        // Bouton Procédure
        const btnProc = L.DomUtil.create('button','layer-toggle-btn',wrap);

        btnProc.innerHTML = `<span class="icon">🗂️</span><span class="label">Procédure</span>`;
        L.DomEvent.on(btnProc,'click',L.DomEvent.stop)
                  .on(btnProc,'click',()=>{ openProc(); });

        // Bouton Couches
        const btnLayers = L.DomUtil.create('button','layer-toggle-btn',wrap);
        btnLayers.type='button';
        btnLayers.innerHTML = `<span class="icon">☰</span><span class="label">Couches</span>`;
        L.DomEvent.on(btnLayers,'click',L.DomEvent.stop)
                  .on(btnLayers,'click',()=>{
                    const el = document.querySelector('.leaflet-control-layers');

                  });

        return wrap;
      }
    });
    map.addControl(new LayerToggleBig());

    /* Styles & popups */
    function styleByGeom(feature){
      const t = feature?.geometry?.type || '';
      if (t==='Point' || t==='MultiPoint') return {radius:5, fillColor:'#e31a1c', color:'#ffffff', weight:1, opacity:1, fillOpacity:.85};
      if (t.includes('Line')) return {color:'#1f78b4', weight:2, opacity:.95};
      return {color:'#33a02c', weight:2, opacity:.95, fillOpacity:.25};
    }
    function toTitle(s){
      return String(s).replace(/_/g,' ').replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)\S/g, t=>t.toUpperCase());
    }
    const PRIORITY_FIELDS = ['NOM','NOM_OUVRAG','name','nom','libelle','LIBELLE','titre'];
    function buildPopupHTML(props){
      const keys = Object.keys(props||{});
      if (!keys.length) return '<em>Aucun attribut</em>';
      const titleKey = PRIORITY_FIELDS.find(k => k in props);
      const title = titleKey ? String(props[titleKey]) : null;
      const ordered = [...PRIORITY_FIELDS.filter(k => k in props), ...keys.filter(k => !PRIORITY_FIELDS.includes(k))];
      let rows = '';
      for (const k of ordered){
        const v = props[k];
        if (v==null || String(v).trim()==='') continue;
        rows += `<tr><th>${toTitle(k)}</th><td>${v}</td></tr>`;
      }
      return `<div class="popup-card">${title?`<div class="popup-title">${title}</div>`:''}<table class="popup-table">${rows}</table></div>`;
    }
    function onEachFeature(feature, layer){
      layer.bindPopup(buildPopupHTML(feature.properties||{}), {maxWidth:380,minWidth:220,autoPan:true});
    }

    /* Loader + cache avec fallback couches<->layers */
    const {get:cacheGet, set:cacheSet} = idbKeyval;
    const CACHE_VERSION = 'v3';

    async function loadGeoJSONSmart(url){
      async function tryFetch(u){
        const res = await fetch(u, {cache:'no-store'});
        if (!res.ok) throw new Error(res.status+' '+res.statusText);
        try {
          const jj = await res.clone().json();
          await cacheSet(CACHE_VERSION+':'+u, jj);
          return jj;
        } catch(_){}
        const buf = await res.arrayBuffer();
        const u8 = new Uint8Array(buf);
        if (u8.length===0) throw new Error('Fichier vide');
        const isGzip = (u8[0]===0x1f && u8[1]===0x8b);
        const looksHTML= (u8[0]===0x3C);
        if (isGzip){
          let text;
          if ('DecompressionStream' in window){
            const r2 = await fetch(u,{cache:'no-store'});
            text = await new Response(r2.body.pipeThrough(new DecompressionStream('gzip'))).text();
          } else if (window.pako){
            text = pako.ungzip(u8,{to:'string'});
          } else {
            throw new Error('GZIP détecté mais pas de décompresseur');
          }
          const j = JSON.parse(text);
          await cacheSet(CACHE_VERSION+':'+u, j);
          return j;
        }
        if (looksHTML) throw new Error('HTML/404 — mauvais chemin/nom');
        const txt = new TextDecoder().decode(u8);
        const j = JSON.parse(txt);
        await cacheSet(CACHE_VERSION+':'+u, j);
        return j;
      }
      try {
        return await tryFetch(url);
      } catch(e1){
        // fallback automatique couches <-> layers
        let alt=null;
        if (typeof url==='string' && url.startsWith('layers/')) alt = url.replace(/^layers\//,'couches/');
        else if (typeof url==='string' && url.startsWith('couches/')) alt = url.replace(/^couches\//,'layers/');
        if (alt){
          try { return await tryFetch(alt); } catch(e2){}
        }
        const cached = await cacheGet(CACHE_VERSION+':'+url);
        if (cached) return cached;
        throw e1;
      }
    }
    function normalizeFC(gj){
      const out={type:'FeatureCollection', features:[]};
      const feats = Array.isArray(gj?.features)?gj.features:[];
      for (const f of feats){
        const g=f?.geometry;
        if(!g) continue;
        if (g.type==='GeometryCollection' && Array.isArray(g.geometries) && g.geometries.length){
          for (const gg of g.geometries){
            if(!gg) continue;
            out.features.push({type:'Feature',properties:f.properties||{},geometry:gg});
          }
        } else out.features.push(f);
      }
      return out;
    }

    const loaded = new Set();
    let maskBounds=null;

    async function ensureLayerLoaded(name){
      if (loaded.has(name)) return;
      const it = LAYERS.find(l => l.name===name);
      if (!it) return;
      const grp = layerGroups[it.name];
      try{
        const gj = await loadGeoJSONSmart(it.url);
        const fc = normalizeFC(gj);
        const layer = L.geoJSON(fc,{
          style:styleByGeom,
          pointToLayer:(feat,latlng)=> L.circleMarker(latlng, styleByGeom(feat)),
          onEachFeature
        });
        layer.eachLayer(l=> l.bringToFront());
        grp.clearLayers();
        grp.addLayer(layer);
        loaded.add(name);
        if (name==='DPT40Masque'){
          try{ maskBounds = layer.getBounds(); }catch(_){}
        }
      }catch(err){
        console.warn(`[ERR ${name}]`, err);
      }
    }
    ensureLayerLoaded('DPT40Masque');

    map.on('overlayadd', async (e)=>{
      const name = Object.keys(layerGroups).find(k => layerGroups[k]===e.layer);
      if (name) await ensureLayerLoaded(name);
      try{
        if (e?.layer?.getBounds){
          const b=e.layer.getBounds();
          if (b && b.isValid()) map.fitBounds(b,{padding:[20,20]});
        }
      }catch(_){}
    });

    /* ---- OUTILS de mesure & annotations ---- */

    let manualState = null;
    let gpsState    = null;
    let lastMeasure = { mode:null, length_m:0, area_m2:0 };
    let measurePanelEl = null;

    function updateMeasurePanel(){
      if (!measurePanelEl) return;
      const modeSpan = measurePanelEl.querySelector('#mp-mode');
      const typeSpan = measurePanelEl.querySelector('#mp-type');
      const dSpan    = measurePanelEl.querySelector('#mp-dist');
      const aSpan    = measurePanelEl.querySelector('#mp-area');
      const gpsRow   = measurePanelEl.querySelector('#mp-gps-row');
      const gpsSpan  = measurePanelEl.querySelector('#mp-gps');
      const pauseBtn = measurePanelEl.querySelector('#mp-pause');

      let mode='—', type='—';

      if (manualState){
        mode = 'Manuel';
        type = manualState.mode === 'area' ? 'Surface' : 'Distance';
      } else if (gpsState){
        mode = 'GPS';
        type = gpsState.mode === 'area' ? 'Surface' : 'Distance';
      }

      modeSpan.textContent = mode;
      typeSpan.textContent = type;
      dSpan.textContent = lastMeasure.length_m ? fmtLength(lastMeasure.length_m) : '—';
      aSpan.textContent = lastMeasure.area_m2 ? fmtArea(lastMeasure.area_m2) : '—';

      if (gpsState && gpsState.lastAccuracy != null){
        gpsRow.style.display = '';
        const acc = gpsState.lastAccuracy;
        let qual = '';
        if (acc <= 5)      qual='(bonne)';
        else if (acc <=15) qual='(moyenne)';
        else               qual='(médiocre)';
        gpsSpan.textContent = `${acc.toFixed(1)} m ${qual}`;
        if (pauseBtn){
          pauseBtn.disabled = false;
          pauseBtn.textContent = gpsState.paused ? 'Reprendre GPS' : 'Pause GPS';
        }
      } else {
        gpsRow.style.display = 'none';
        gpsSpan.textContent  = '—';
        if (pauseBtn){
          pauseBtn.disabled = !gpsState;
          pauseBtn.textContent = 'Pause GPS';
        }
      }
    }

    function toggleGPSPause(){
      if (!gpsState) return;
      gpsState.paused = !gpsState.paused;
      updateMeasurePanel();
    }

    const ManualMeasure = L.Control.extend({
      options:{ position:'topleft' },
      onAdd(){
        const wrap = L.DomUtil.create('div','leaflet-bar tool-btn');
        const d = L.DomUtil.create('a','',wrap);
        d.href='#'; d.title='Mesurer distance (manuel)'; d.innerHTML='📏';
        const a = L.DomUtil.create('a','',wrap);
        a.href='#'; a.title='Mesurer surface (manuel)'; a.innerHTML='▱';
        const e = L.DomUtil.create('a','',wrap);
        e.href='#'; e.title='Exporter la mesure (GeoJSON)'; e.innerHTML='📤';
        L.DomEvent.disableClickPropagation(wrap);
        L.DomEvent.on(d,'click',L.DomEvent.stop).on(d,'click',()=>startManual('dist',d));
        L.DomEvent.on(a,'click',L.DomEvent.stop).on(a,'click',()=>startManual('area',a));
        L.DomEvent.on(e,'click',L.DomEvent.stop).on(e,'click',()=>exportCurrentMeasure());
        return wrap;
      }
    });
    map.addControl(new ManualMeasure());

    function resetManual(){
      if(!manualState) return;
      if (manualState.line)  map.removeLayer(manualState.line);
      if (manualState.poly)  map.removeLayer(manualState.poly);
      if (manualState.label) map.removeLayer(manualState.label);
      if (manualState.btn)   manualState.btn.classList.remove('active');
      map.getContainer().style.cursor='';
      map.doubleClickZoom.enable();
      map.off('click', onClickManual);
      map.off('dblclick', finishManual);
      map.off('contextmenu', finishManual);
      manualState = null;
      updateMeasurePanel();
    }

    function startManual(mode, btnOn){
      if (manualState?.mode === mode){ resetManual(); return; }
      resetManual(); stopGPS();
      btnOn.classList.add('active');
      manualState = { mode, pts:[], line:null, poly:null, label:null, btn:btnOn };
      map.getContainer().style.cursor='crosshair';
      map.doubleClickZoom.disable();
      map.on('click', onClickManual);
      map.on('dblclick', finishManual);
      map.on('contextmenu', finishManual);
      updateMeasurePanel();
    }

    function onClickManual(e){
      const s = manualState; if (!s) return;
      s.pts.push(e.latlng);
      if (s.mode === 'dist'){
        if (!s.line){
          s.line = L.polyline([e.latlng],{color:'#1f78b4',weight:3,dashArray:'6,4'}).addTo(map);
        } else {
          s.line.addLatLng(e.latlng);
        }
        updateManualLabel(e.latlng, fmtLength(computeLengthMeters(s.pts)));
      } else {
        if (s.pts.length === 1){
          s.line = L.polyline([e.latlng],{color:'#33a02c',weight:3,dashArray:'6,4'}).addTo(map);
        } else if (s.pts.length === 2){
          s.line.addLatLng(e.latlng);
        } else {
          if (!s.poly){
            s.poly = L.polygon(s.pts,{color:'#33a02c',weight:2,fillOpacity:.15}).addTo(map);
          } else {
            s.poly.setLatLngs([s.pts]);
          }
          updateManualLabel(e.latlng, fmtArea(computeAreaM2(s.pts)));
        }
      }
    }

    function finishManual(){ resetManual(); }

    function updateManualLabel(latlng, text){
      if (manualState?.label) map.removeLayer(manualState.label);
      manualState.label = L.tooltip({permanent:true, direction:'top', offset:[0,-10], className:'measure-label'})
        .setLatLng(latlng).setContent(text).addTo(map);
      if (manualState){
        if (manualState.mode === 'dist'){
          lastMeasure.length_m = computeLengthMeters(manualState.pts);
          lastMeasure.area_m2  = 0;
        } else {
          lastMeasure.area_m2  = computeAreaM2(manualState.pts);
          lastMeasure.length_m = computeLengthMeters(manualState.pts);
        }
        pushMeasureToValidator(true);
      }
      updateMeasurePanel();

    const GPSMeasure = L.Control.extend({
      options:{ position:'topleft' },
      onAdd(){
        const w = L.DomUtil.create('div','leaflet-bar tool-btn');
        const d = L.DomUtil.create('a','',w);
        d.href='#'; d.title='Mesurer distance (GPS)'; d.innerHTML='📍📏';
        const a = L.DomUtil.create('a','',w);
        a.href='#'; a.title='Mesurer surface (GPS)'; a.innerHTML='📍▱';
        const e = L.DomUtil.create('a','',w);
        e.href='#'; e.title='Exporter la mesure (GeoJSON)'; e.innerHTML='📤';
        L.DomEvent.disableClickPropagation(w);
        L.DomEvent.on(d,'click',L.DomEvent.stop).on(d,'click',()=>startGPS('dist',d));
        L.DomEvent.on(a,'click',L.DomEvent.stop).on(a,'click',()=>startGPS('area',a));
        L.DomEvent.on(e,'click',L.DomEvent.stop).on(e,'click',()=>exportCurrentMeasure());
        return w;
      }
    });
    map.addControl(new GPSMeasure());

    function stopGPS(){
      if (!gpsState) { updateMeasurePanel(); return; }
      if (gpsState.watchId != null) navigator.geolocation.clearWatch(gpsState.watchId);
      if (gpsState.line)  map.removeLayer(gpsState.line);
      if (gpsState.poly)  map.removeLayer(gpsState.poly);
      if (gpsState.label) map.removeLayer(gpsState.label);
      if (gpsState.btn)   gpsState.btn.classList.remove('active');
      gpsState = null;
      map.off('contextmenu', stopGPS);
      updateMeasurePanel();
    }

    function startGPS(mode, btnOn){
      if (gpsState?.mode === mode){
        stopGPS();
        return;
      }
      stopGPS(); resetManual();
      gpsState = { mode, pts:[], line:null, poly:null, label:null, btn:btnOn, watchId:null, paused:false, lastAccuracy:null };
      btnOn.classList.add('active');
      if (!('geolocation' in navigator)){
        alert('Géolocalisation non disponible.');
        stopGPS();
        return;
      }
      try{
        gpsState.watchId = navigator.geolocation.watchPosition(onGPS, onGPSError, {
          enableHighAccuracy:true, maximumAge:1000, timeout:20000
        });
        map.on('contextmenu', stopGPS);
      }catch(e){
        alert('Impossible de démarrer la géolocalisation.');
        stopGPS();
      }
      updateMeasurePanel();
    }

    function onGPS(pos){
      const s = gpsState; if (!s || s.paused) return;
      const { latitude, longitude, accuracy } = pos.coords;
      const ll = L.latLng(latitude, longitude);
      if (s.pts.length){
        const last = s.pts[s.pts.length-1];
        const d = turf.distance([last.lng,last.lat],[ll.lng,ll.lat],{units:'meters'});
        if (d < 3) return;
      }
      s.pts.push(ll);
      s.lastAccuracy = (typeof accuracy === 'number') ? accuracy : null;
      if (s.mode === 'dist'){
        if (!s.line){
          s.line = L.polyline([ll],{color:'#1f78b4',weight:3,dashArray:'6,4'}).addTo(map);
        } else {
          s.line.addLatLng(ll);
        }
        const len = turf.length(turf.lineString(s.pts.map(p=>[p.lng,p.lat])), {units:'kilometers'})*1000;
        updateGPSLabel(ll, fmtLength(len));
      } else {
        if (!s.poly){
          s.poly = L.polygon(s.pts,{color:'#33a02c',weight:2,fillOpacity:.15}).addTo(map);
        } else {
          s.poly.setLatLngs([s.pts]);
        }
        updateGPSLabel(ll, fmtArea(computeAreaM2(s.pts)));
      }
    }

    function onGPSError(err){
      alert('Erreur géolocalisation : ' + (err?.message || err));
      stopGPS();
    }

    function updateGPSLabel(latlng, text){
      if (gpsState?.label) map.removeLayer(gpsState.label);
      gpsState.label = L.tooltip({permanent:true, direction:'top', offset:[0,-10], className:'measure-label'})
        .setLatLng(latlng).setContent(text).addTo(map);
      if (gpsState){
        if (gpsState.mode === 'dist'){
          lastMeasure.length_m = turf.length(
            turf.lineString(gpsState.pts.map(p=>[p.lng,p.lat])),
            {units:'kilometers'}
          )*1000;
          lastMeasure.area_m2 = 0;
        } else {
          lastMeasure.area_m2 = computeAreaM2(gpsState.pts);
          lastMeasure.length_m = turf.length(
            turf.lineString(gpsState.pts.concat([gpsState.pts[0]]).map(p=>[p.lng,p.lat])),
            {units:'kilometers'}
          )*1000;
        }
        pushMeasureToValidator(true);
      }
      updateMeasurePanel();
    }

    function exportCurrentMeasure(){
      let pts=null, mode=null;
      if (manualState){ pts=manualState.pts; mode=manualState.mode; }
      else if (gpsState){ pts=gpsState.pts; mode=gpsState.mode; }
      if (!pts || pts.length < (mode==='area'?3:2)){
        alert('Aucune mesure à exporter.');
        return;
      }
      let gj;
      if (mode === 'dist'){
        gj = {
          type:'FeatureCollection',
          features:[{
            type:'Feature',
            properties:{ type:'measure_distance', date:new Date().toISOString() },
            geometry:{ type:'LineString', coordinates: pts.map(ll=>[ll.lng,ll.lat]) }
          }]
        };
      } else {
        const ring = [...pts.map(ll=>[ll.lng,ll.lat]), [pts[0].lng,pts[0].lat]];
        gj = {
          type:'FeatureCollection',
          features:[{
            type:'Feature',
            properties:{ type:'measure_area', date:new Date().toISOString() },
            geometry:{ type:'Polygon', coordinates:[ring] }
          }]
        };
      }
      const blob = new Blob([JSON.stringify(gj)],{type:'application/geo+json'});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = (mode==='dist'?'mesure_distance':'mesure_surface')+'.geojson';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Panneau de mesures Leaflet
    const MeasurePanel = L.Control.extend({
      options:{ position:'bottomleft' },
      onAdd(){
        const w = L.DomUtil.create('div','leaflet-control measure-panel');
        w.innerHTML = `
          <div style="background:#0b2239;color:#fff;padding:4px 8px;font:600 11px system-ui;">Mesures</div>
          <div style="background:#ffffff;padding:6px 8px;min-width:190px;font:11px system-ui;">
            <div><b>Mode :</b> <span id="mp-mode">—</span></div>
            <div><b>Type :</b> <span id="mp-type">—</span></div>
            <div><b>Distance :</b> <span id="mp-dist">—</span></div>
            <div><b>Surface :</b> <span id="mp-area">—</span></div>
            <div id="mp-gps-row" style="display:none;"><b>GPS :</b> <span id="mp-gps">—</span></div>
            <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;">
              <button type="button" id="mp-clear" style="flex:1 1 auto;font-size:10px;padding:3px 4px;">Effacer</button>
              <button type="button" id="mp-pause" style="flex:1 1 auto;font-size:10px;padding:3px 4px;">Pause GPS</button>
              <button type="button" id="mp-iota"  style="flex:1 1 100%;font-size:10px;padding:3px 4px;">→ Validateur</button>
            </div>
          </div>`;
        L.DomEvent.disableClickPropagation(w);
        measurePanelEl = w;

        const clearBtn = w.querySelector('#mp-clear');
        const pauseBtn = w.querySelector('#mp-pause');
        const iotaBtn  = w.querySelector('#mp-iota');

        clearBtn.addEventListener('click', ()=>{
          lastMeasure = { mode:null, length_m:0, area_m2:0 };
          resetManual();
          stopGPS();
          updateMeasurePanel();
        });
        pauseBtn.addEventListener('click', ()=> toggleGPSPause());
        iotaBtn.addEventListener('click', ()=>{
          pushMeasureToValidator(true);
          const btnEval = document.getElementById('btnEval');
          if (btnEval) btnEval.click();
        });

        updateMeasurePanel();
        return w;
      }
    });
    map.addControl(new MeasurePanel());

    // Annotations Leaflet.Draw
    const annotations = new L.FeatureGroup().addTo(map);
    layersControl.addOverlay(annotations, 'Annotations (dessins)');
    const drawControl = new L.Control.Draw({
      position:'topleft',
      edit: { featureGroup: annotations, poly:{allowIntersection:false}, remove:true },
      draw: {
        marker:{ repeatMode:true },
        polyline:{ shapeOptions:{ color:'#ff7f00', weight:3 } },
        polygon:{ allowIntersection:false, showArea:true, shapeOptions:{ color:'#ff7f00', weight:2, fillOpacity:.2 } },
        rectangle:false, circle:false, circlemarker:false
      }
    });
    map.addControl(drawControl);

    const ANNOS_KEY='sd40:annotations';
    function saveAnnotations(){ try{ localStorage.setItem(ANNOS_KEY, JSON.stringify(annotations.toGeoJSON())); }catch(_){ } }
    function loadAnnotations(){
      try{
        const raw=localStorage.getItem(ANNOS_KEY); if(!raw) return;
        const gj=JSON.parse(raw);
        L.geoJSON(gj,{ style:()=>({color:'#ff7f00',weight:2,fillOpacity:.2}), pointToLayer:(_f,latlng)=>L.marker(latlng)})
          .eachLayer(l=>annotations.addLayer(l));
      }catch(_){}
    }
    loadAnnotations();
    map.on(L.Draw.Event.CREATED, e => {
      annotations.addLayer(e.layer); saveAnnotations();
      try{
        const gj = e.layer.toGeoJSON();
        const g = gj.geometry || {};
        if (g.type === 'Polygon' || g.type === 'MultiPolygon'){
          lastMeasure.area_m2 = turf.area(gj);
          const ring = g.type==='Polygon' ? g.coordinates[0] : g.coordinates[0][0];
          lastMeasure.length_m = turf.length(turf.lineString(ring), {units:'kilometers'})*1000;
        } else if (g.type === 'LineString' || g.type === 'MultiLineString'){
          lastMeasure.length_m = turf.length(gj, {units:'kilometers'})*1000;
          lastMeasure.area_m2 = 0;
        }
        pushMeasureToValidator(true);
        updateMeasurePanel();
      }catch(_){}
    });
    map.on(L.Draw.Event.EDITED, () => { saveAnnotations(); });
    map.on(L.Draw.Event.DELETED, () => { saveAnnotations(); });

    // Home Landes
    const HomeControl = L.Control.extend({
      options:{ position:'topright' },
      onAdd(){
        const d=L.DomUtil.create('div','leaflet-bar tool-btn');
        const a=L.DomUtil.create('a','',d);
        a.href='#'; a.title='Recentrer sur Landes'; a.innerHTML='🏠';
        L.DomEvent.on(a,'click',L.DomEvent.stop).on(a,'click',()=>{
          if (maskBounds && maskBounds.isValid()) map.fitBounds(maskBounds,{padding:[20,20]});
          else map.setView([43.85,-0.7],9);
        });
        return d;
      }
    });
    map.addControl(new HomeControl());

    // Plein écran (toujours visible, même outils repliés)
    const FullscreenControl = L.Control.extend({
      options:{ position:'topright' },
      onAdd(){
        const d = L.DomUtil.create('div','leaflet-bar fullscreen-btn');
        const a = L.DomUtil.create('a','',d);
        a.href='#'; a.title='Plein écran'; a.innerHTML='⛶';
        L.DomEvent.on(a,'click',L.DomEvent.stop).on(a,'click',()=>toggleFullscreen());
        return d;
      }
    });
    map.addControl(new FullscreenControl());

    function toggleFullscreen(){
      // Plein écran sur toute la page : la carte + bouton Procédure + panneau restent visibles
      const elem = document.documentElement;
      if (!document.fullscreenElement){
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // Toggle global outils
    const ToolsToggle = L.Control.extend({
      options:{ position:'topleft' },
      onAdd(){
        const w=L.DomUtil.create('div','tools-toggle leaflet-control');
        const b=L.DomUtil.create('button','',w);
        b.type='button'; b.title='Afficher/masquer les outils'; b.innerHTML='🧰 Outils';
        L.DomEvent.on(b,'click',L.DomEvent.stop).on(b,'click',()=>{ document.body.classList.toggle('tools-hidden'); });
        return w;
      }
    });
    map.addControl(new ToolsToggle());

    /* ---- PROCÉDURE – DATASETS & UI ---- */
    let IOTA=[], NATINF=[];
    const DEMO_IOTA=[ {code:"3.2.3.0", titre:"Plans d’eau (permanents ou non)"},
                      {code:"3.1.4.0", titre:"Consolidation/protection de berges (techniques non végétales)"},
                      {code:"3.3.1.0", titre:"Zones humides : assèchement, mise en eau, remblais"} ];
    const DEMO_NATINF=[ {natinf:"32673", intitule:"Non-respect d'une prescription attachée à une déclaration IOTA", type:"C5"} ];
    const RESULT_LABELS = { HN:'Hors nomenclature', A:'Autorisation', D:'Déclaration' };
    const RESULT_ICON   = { HN:'⚪', A:'🔴', D:'🟠' };

    // === Multi-IOTA ===
    const SELECTED_IOTA = new Set();
    const REG_ORDER = { A:3, D:2, HN:1 };
    function mostRestrictive(regs){
      return regs.reduce((acc, r)=> (REG_ORDER[r] > REG_ORDER[acc] ? r : acc), 'HN');
    }

    function applyResultBadge(codeOrLabel){
      let code = codeOrLabel;
      if (!['A','D','HN'].includes(code)) {
        const s = String(codeOrLabel||'').toLowerCase();
        if (s.includes('autor')) code='A';
        else if (s.includes('décla')||s.includes('decla')) code='D';
        else code='HN';
      }
      const el = $('#valResult');
      el.classList.remove('pill-A','pill-D','pill-HN');
      el.classList.add('pill', 'pill-'+code);
      el.textContent = `${RESULT_ICON[code]} ${RESULT_LABELS[code]}`;
    }

    function getEmbeddedPack(){
      try{ const el=document.getElementById('iota-pack-officiel'); return el? JSON.parse(el.textContent) : null; }
      catch(_){ return null; }
    }
    function setRules(obj){ try{ localStorage.setItem(RULES_KEY, JSON.stringify(obj)); }catch(_){ } }
    function getRules(){ try{ const raw=localStorage.getItem(RULES_KEY); return raw? JSON.parse(raw):{}; }catch(_){ return {}; } }

    (async()=>{
      const pack = getEmbeddedPack();
      if (!pack) {
        IOTA=DEMO_IOTA; setRules({}); console.warn('Pack IOTA intégré introuvable → démo.');
      } else {
        IOTA = Array.isArray(pack.iota)? pack.iota : DEMO_IOTA;
        if (pack.rules){ PACK_RULES = pack.rules; setRules(pack.rules); }
      }
      try{
        const r = await fetch('data/natinf_env_2023-10.json',{cache:'no-store'});
        NATINF = r.ok ? await r.json() : DEMO_NATINF;
      }catch(_){ NATINF = DEMO_NATINF; }
      initProc();
    })();

    function normG(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

    function natinfSuggestForIota(iotaCode){
      const fam = String(iotaCode||'').split('.')[0];
      let kw = ['iota','declaration','autorisation','prescription','opposition'];
      if (fam==='1'){ kw = kw.concat(['prelev','pompage','ouvrage','eau']); }
      else if (fam==='2'){ kw = kw.concat(['rejet','effluent','assainissement','eaux pluviales']); }
      else if (fam==='3'){ kw = kw.concat(['installation','ouvrage','cours','plan','berge','continuite','zone humide']); }
      else if (fam==='4'){ kw = kw.concat(['marin','dragage','port']); }
      const scored = (Array.isArray(NATINF)? NATINF : []).map(n=>{
        const t = normG(n.intitule)+' '+normG(n.type||''); let s = 0;
        kw.forEach(k=>{ if (t.includes(k)) s++; }); if (t.includes('iota')) s+=2;
        return { n, score:s };
      }).filter(x=>x.score>0).sort((a,b)=> b.score - a.score);
      return scored.slice(0,8).map(x=>({natinf:x.n.natinf, intitule:x.n.intitule}));
    }

    function initProc(){
      // Onglets
      $$('.proc-tabs button').forEach(b=>{
        b.addEventListener('click', ()=>{
          $$('.proc-tabs button').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          const tab=b.dataset.tab;
          $$('.tab').forEach(x=>x.hidden=(x.id!=='tab-'+tab));
        });
      });

      // IOTA search (multi-sélection)
      const iotaList = $('#iotaList');

      function syncIotaSelections(){
        const arr = Array.from(SELECTED_IOTA);
        $('#ftRefIota').value = arr.join(', ');

        const sugg = [...new Set(
          arr.flatMap(c => natinfSuggestForIota(c).slice(0,3).map(x=>x.natinf))
        )];
        if (sugg.length) $('#ftRefNatinf').value = sugg.join(', ');

        buildValParams();
      }

      function renderIota(q=''){
        q = q.trim().toLowerCase();
        const out = IOTA.filter(x =>
          (x.code||'').includes(q) || (x.titre||'').toLowerCase().includes(q)
        );

        iotaList.innerHTML = out.map(x=>`
          <div class="row" style="padding:4px 0">
            <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
              <input type="checkbox" data-code="${x.code}" ${SELECTED_IOTA.has(x.code)?'checked':''}>
              <div><b>${x.code}</b> — ${x.titre}</div>
            </label>
          </div>
        `).join('') || '<em>Aucune rubrique</em>';

        $$('input[type=checkbox][data-code]', iotaList).forEach(cb=>{
          cb.addEventListener('change', ()=>{
            const code = cb.dataset.code;
            if (cb.checked) SELECTED_IOTA.add(code);
            else SELECTED_IOTA.delete(code);
            syncIotaSelections();
          });
        });
      }

      renderIota();
      $('#iotaSearch').addEventListener('input', (e)=>renderIota(e.target.value));

      // NATINF helpers
      function pickNatinf(listEl, arr){
        listEl.innerHTML = arr.slice(0,200).map(n=>`
          <div class="row" style="padding:4px 0">
            <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
              <input type="radio" name="${listEl.id}-pick" value="${n.natinf}">
              <div><b>${n.natinf}</b> — ${n.intitule} ${n.type?`<span class="badge">${n.type}</span>`:''}</div>
            </label>
          </div>`).join('') || '<em>Aucun résultat</em>';
        $$('input[type=radio]', listEl).forEach(r=>{
          r.addEventListener('change', ()=>{ $('#ftRefNatinf').value = r.value; });
        });
      }

      const BCAE_KEYS = ['bcae','zone humide','drainage','nitrates','programme d\'action','bande tampon','haie','prairie'];
      const PHYTO_KEYS = ['phytopharmaceutique','phytosanitaire','certificat individuel','neonicotinoide','amm','znt','biocide'];
      const bcaeList = $('#bcaeList'), phytoList = $('#phytoList'), autreList = $('#autreList');

      function filterBCAE(q){
        const n=normG(q);
        return NATINF.filter(nf=>{
          const t=normG(nf.intitule);
          return BCAE_KEYS.some(k=>t.includes(normG(k))) || t.includes(n);
        });
      }
      function filterPHYTO(q){
        const n=normG(q);
        return NATINF.filter(nf=>{
          const t=normG(nf.intitule);
          return PHYTO_KEYS.some(k=>t.includes(normG(k))) || t.includes(n);
        });
      }
      $('#bcaeSearch').addEventListener('input', (e)=> pickNatinf(bcaeList, filterBCAE(e.target.value)));
      pickNatinf(bcaeList, filterBCAE('zone humide'));
      $('#phytoSearch').addEventListener('input', (e)=> pickNatinf(phytoList, filterPHYTO(e.target.value)));
      pickNatinf(phytoList, filterPHYTO('phytopharmaceutique'));
      $('#autreSearch').addEventListener('input', (e)=>{
        const q=normG(e.target.value);
        const out=NATINF.filter(nf=> normG(nf.intitule).includes(q) || (nf.natinf||'').includes(q));
        pickNatinf(autreList, out);
      });

      // Badge lat/lng
      function updateLatLngBadge(ll){
        $('#ftLatLng').textContent = ll ? `Lat ${ll.lat.toFixed(5)} / Lng ${ll.lng.toFixed(5)}` : '—';
      }
      map.on('click', (e)=> updateLatLngBadge(e.latlng));
      updateLatLngBadge(map.getCenter());

      // Complétude
      function evalScore(){
        const f=[ $('#ftTitre').value, $('#ftDesc').value, $('#ftRefIota').value, $('#ftRefNatinf').value ];
        const n=f.filter(x=>String(x||'').trim().length>0).length;
        $('#ftScore').textContent = (n>=4? 'OK (4/4)': n+'/4');
      }
      ['#ftTitre','#ftDesc','#ftRefIota','#ftRefNatinf'].forEach(sel=> $(sel).addEventListener('input', evalScore));
      evalScore();

      // === Photos & Croquis ===
      const photos=[];    // {id, dataUrl, w, h, label}
      const sketches=[];  // {id, dataUrl, w, h, label}
      window.photos = photos;
      window.sketches = sketches;

      function refreshPieces(){
        const cont = $('#piecesList'); cont.innerHTML='';
        [...photos, ...sketches].forEach(p=>{
          const im = document.createElement('img'); im.src=p.dataUrl; im.title=p.label||'Pièce'; cont.appendChild(im);
        });
      }
      $('#btnPhoto').addEventListener('click', ()=> $('#photoInput').click());
      $('#photoInput').addEventListener('change', async (e)=>{
        const f=e.target.files?.[0]; if(!f) return;
        const dataUrl = await fileToDataURL(f);
        const img = await dataUrlToImage(dataUrl);
        photos.push({ id:'ph'+Date.now(), dataUrl, w:img.width, h:img.height, label:'Photo '+new Date().toLocaleString() });
        refreshPieces(); e.target.value='';
      });

      // Croquis modal – version outils avancés (plein écran)
      let skModal=null, skCanvas=null, skCtx=null,
          skDrawing=false, skLast=null,
          skColor='#111827', skSize=3,
          skBg='blank', skBgImg=null,
          skTool='free', skSymbolText='';

      function openSketch(){
        if (skModal) return;

        skModal = document.createElement('div');
        skModal.className='sketch-modal';
        skModal.innerHTML = `
          <div class="sketch-card">
            <div class="sketch-toolbar">
              <div class="sketch-left">
                <select id="skBgSel" title="Fond">
                  <option value="blank">Fond blanc</option>
                  <option value="map">Fond = carte actuelle</option>
                  <option value="photo">Fond = une photo</option>
                </select>
                <label>Couleur <input id="skColor" type="color" value="#111827"></label>
                <label>Épaisseur <input id="skSize" type="range" min="1" max="20" value="3"></label>
                <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">
                  <button type="button" class="sk-tool active" id="skToolFree" data-tool="free">✏️ Libre</button>
                  <button type="button" class="sk-tool" id="skToolLine" data-tool="line">📐 Ligne</button>
                  <button type="button" class="sk-tool" id="skToolRect" data-tool="rect">⬛ Rect</button>
                  <button type="button" class="sk-tool" id="skToolArrow" data-tool="arrow">➡️ Flèche</button>
                  <button type="button" class="sk-tool" id="skToolText" data-tool="text">T Texte</button>
                  <button type="button" class="sk-tool" id="skToolErase" data-tool="erase">🧽 Gomme</button>
                </div>
                <div style="margin-top:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap">
                  <select id="skSymbol">
                    <option value="">Symbole</option>
                    <option value="💧 Rejet">💧 Rejet</option>
                    <option value="🚰 Prélèvement">🚰 Prélèvement</option>
                    <option value="🧱 Ouvrage">🧱 Ouvrage</option>
                    <option value="🌊 Plan d’eau">🌊 Plan d’eau</option>
                    <option value="🕳 Buse">🕳 Buse</option>
                  </select>
                  <button id="skNorth" type="button" class="sk-tool" style="margin-left:auto">🧭 Nord+échelle</button>
                </div>
                <button id="skUndo" type="button" style="margin-top:4px">↶ Annuler</button>
                <button id="skClear" type="button" style="margin-top:4px">🧹 Vider</button>
              </div>
              <div class="sketch-right">
                <button id="skSave" type="button">💾 Enregistrer</button>
                <button id="skClose" type="button">Fermer</button>
              </div>
            </div>
            <canvas id="skCanvas" class="sketch-canvas"></canvas>
          </div>`;

        document.body.appendChild(skModal);
        skCanvas = $('#skCanvas', skModal);
        skCtx    = skCanvas.getContext('2d');

        const skStack = [];
        let skTempShape = null;

        function drawImageCover(ctx, img, w, h){
          const r = Math.max(w / img.width, h / img.height);
          const dw = img.width * r, dh = img.height * r;
          const dx = (w - dw) / 2, dy = (h - dh) / 2;
          ctx.drawImage(img, dx, dy, dw, dh);
        }

        function drawArrowHead(ctx, p0, p1, size){
          const headLen = 10 + size * 1.5;
          const angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(
            p1.x - headLen * Math.cos(angle - Math.PI/6),
            p1.y - headLen * Math.sin(angle - Math.PI/6)
          );
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(
            p1.x - headLen * Math.cos(angle + Math.PI/6),
            p1.y - headLen * Math.sin(angle + Math.PI/6)
          );
          ctx.stroke();
        }

        function pt(e){
          const rect = skCanvas.getBoundingClientRect();
          const cx = (e.touches ? e.touches[0].clientX : e.clientX);
          const cy = (e.touches ? e.touches[0].clientY : e.clientY);
          return { x: cx - rect.left, y: cy - rect.top };
        }

        function redrawSketch(){
          if (!skCanvas || !skCtx) return;
          const rect = skCanvas.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width));
          const h = Math.max(1, Math.round(rect.height));
          skCtx.clearRect(0, 0, w, h);
          skCtx.fillStyle = '#ffffff';
          skCtx.fillRect(0, 0, w, h);
          if (skBgImg) drawImageCover(skCtx, skBgImg, w, h);

          skStack.forEach(st=>{
            skCtx.save();
            if (st.type === 'erase'){
              skCtx.globalCompositeOperation = 'destination-out';
              skCtx.lineWidth = st.size;
              skCtx.lineJoin = skCtx.lineCap = 'round';
              skCtx.beginPath();
              st.pts.forEach((p,i)=>{ if(i===0) skCtx.moveTo(p.x,p.y); else skCtx.lineTo(p.x,p.y); });
              skCtx.stroke();
            } else if (st.type === 'line' || st.type === 'arrow'){
              skCtx.globalCompositeOperation = 'source-over';
              skCtx.strokeStyle = st.color;
              skCtx.lineWidth   = st.size;
              skCtx.lineJoin = skCtx.lineCap = 'round';
              const [p0,p1] = st.pts;
              skCtx.beginPath();
              skCtx.moveTo(p0.x,p0.y);
              skCtx.lineTo(p1.x,p1.y);
              skCtx.stroke();
              if (st.type === 'arrow'){
                drawArrowHead(skCtx, p0, p1, st.size);
              }
            } else if (st.type === 'rect'){
              skCtx.globalCompositeOperation = 'source-over';
              skCtx.strokeStyle = st.color;
              skCtx.lineWidth   = st.size;
              const [p0,p1] = st.pts;
              const x = Math.min(p0.x,p1.x);
              const y = Math.min(p0.y,p1.y);
              const ww = Math.abs(p1.x-p0.x);
              const hh = Math.abs(p1.y-p0.y);
              skCtx.strokeRect(x,y,ww,hh);
            } else if (st.type === 'text' || st.type === 'symbol'){
              skCtx.globalCompositeOperation = 'source-over';
              skCtx.fillStyle = st.color;
              skCtx.font = `${st.size*3}px system-ui, sans-serif`;
              const p = st.pts[0];
              skCtx.fillText(st.text || '', p.x, p.y);
            } else {
              skCtx.globalCompositeOperation = 'source-over';
              skCtx.strokeStyle = st.color;
              skCtx.lineWidth   = st.size;
              skCtx.lineJoin = skCtx.lineCap = 'round';
              skCtx.beginPath();
              st.pts.forEach((p,i)=>{ if(i===0) skCtx.moveTo(p.x,p.y); else skCtx.lineTo(p.x,p.y); });
              skCtx.stroke();
            }
            skCtx.restore();
          });

          if (skTempShape && skTempShape.start && skTempShape.end){
            const st = skTempShape;
            const p0 = st.start;
            const p1 = st.end;
            skCtx.save();
            skCtx.globalCompositeOperation = 'source-over';
            skCtx.strokeStyle = st.color;
            skCtx.lineWidth   = st.size;
            skCtx.lineJoin = skCtx.lineCap = 'round';
            if (st.type === 'line' || st.type === 'arrow'){
              skCtx.beginPath();
              skCtx.moveTo(p0.x,p0.y);
              skCtx.lineTo(p1.x,p1.y);
              skCtx.stroke();
              if (st.type === 'arrow') drawArrowHead(skCtx,p0,p1,st.size);
            } else if (st.type === 'rect'){
              const x = Math.min(p0.x,p1.x);
              const y = Math.min(p0.y,p1.y);
              const ww = Math.abs(p1.x-p0.x);
              const hh = Math.abs(p1.y-p0.y);
              skCtx.strokeRect(x,y,ww,hh);
            }
            skCtx.restore();
          }
        }

        function resizeSketch(){
          if (!skCanvas || !skCtx) return;
          const rect = skCanvas.getBoundingClientRect();
          const cssW = Math.max(1, Math.round(rect.width));
          const cssH = Math.max(1, Math.round(rect.height));
          const dpr  = window.devicePixelRatio || 1;
          skCanvas.width  = Math.round(cssW * dpr);
          skCanvas.height = Math.round(cssH * dpr);
          skCtx.setTransform(dpr,0,0,dpr,0,0);
          redrawSketch();
        }

        async function setSketchBg(mode){
          skBg = mode;
          if (mode === 'blank'){
            skBgImg = null;
            redrawSketch();
            return;
          }
          if (mode === 'photo'){
            if (!photos.length){
              alert('Aucune photo disponible.');
              skBg = 'blank';
              skBgImg = null;
              redrawSketch();
              return;
            }
            const pick = prompt('ID de la photo (index 1..N) ou vide pour la première :','');
            const idx  = Math.min(Math.max(((+pick||1)-1),0), photos.length-1);
            const img  = await dataUrlToImage(photos[idx].dataUrl);
            skBgImg = img;
            redrawSketch();
            return;
          }
          if (mode === 'map'){
            try{
              const canvas = await html2canvas(document.getElementById('map'), {useCORS:true, backgroundColor:'#ffffff', scale:1});
              const img = await dataUrlToImage(canvas.toDataURL('image/jpeg',0.9));
              skBgImg = img;
              redrawSketch();
            }catch(e){
              alert('Impossible de capturer la carte (CORS). Fond blanc utilisé.');
              skBg = 'blank'; skBgImg = null;
              redrawSketch();
            }
          }
        }

        function down(e){
          e.preventDefault();
          const p = pt(e);

          if (skTool === 'text'){
            const txt = prompt('Texte à ajouter :','');
            if (!txt) return;
            skStack.push({ type:'text', color:skColor, size:skSize, pts:[p], text:txt });
            redrawSketch();
            return;
          }

          if (skTool === 'symbol'){
            if (!skSymbolText){
              alert('Sélectionner un symbole dans la liste.');
              return;
            }
            skStack.push({ type:'symbol', color:'#111827', size:skSize, pts:[p], text:skSymbolText });
            redrawSketch();
            return;
          }

          skDrawing = true;
          skLast    = p;

          if (skTool === 'free' || skTool === 'erase'){
            const type = (skTool === 'erase') ? 'erase' : 'free';
            const size = (skTool === 'erase') ? skSize * 2 : skSize;
            skStack.push({ type, color:skColor, size, pts:[p] });
          } else if (skTool === 'line' || skTool === 'rect' || skTool === 'arrow'){
            skTempShape = { type:skTool, color:skColor, size:skSize, start:p, end:p };
          }
        }

        function move(e){
          if (!skDrawing) return;
          const p = pt(e);

          if (skTool === 'free' || skTool === 'erase'){
            const cur = skStack[skStack.length-1];
            if (!cur) return;
            cur.pts.push(p);
            skCtx.save();
            if (cur.type === 'erase'){
              skCtx.globalCompositeOperation = 'destination-out';
              skCtx.lineWidth = cur.size;
              skCtx.lineJoin = skCtx.lineCap = 'round';
              skCtx.beginPath();
              skCtx.moveTo(skLast.x, skLast.y);
              skCtx.lineTo(p.x, p.y);
              skCtx.stroke();
            } else {
              skCtx.globalCompositeOperation = 'source-over';
              skCtx.strokeStyle = cur.color;
              skCtx.lineWidth   = cur.size;
              skCtx.lineJoin = skCtx.lineCap = 'round';
              skCtx.beginPath();
              skCtx.moveTo(skLast.x, skLast.y);
              skCtx.lineTo(p.x, p.y);
              skCtx.stroke();
            }
            skCtx.restore();
            skLast = p;
          } else if (skTool === 'line' || skTool === 'rect' || skTool === 'arrow'){
            if (!skTempShape) return;
            skTempShape.end = p;
            redrawSketch();
          }
        }

        function up(){
          if (!skDrawing) return;
          skDrawing = false;
          if (skTool === 'line' || skTool === 'rect' || skTool === 'arrow'){
            if (skTempShape && skTempShape.start && skTempShape.end){
              const {type,color,size,start,end} = skTempShape;
              skStack.push({ type, color, size, pts:[start,end] });
            }
            skTempShape = null;
            redrawSketch();
          }
        }

        $('#skBgSel', skModal).addEventListener('change', (e)=> setSketchBg(e.target.value));
        $('#skColor', skModal).addEventListener('input', (e)=> skColor = e.target.value);
        $('#skSize',  skModal).addEventListener('input', (e)=> skSize  = +e.target.value);

        const toolButtons = $$('.sk-tool', skModal);
        toolButtons.forEach(btn=>{
          const tool = btn.dataset.tool;
          if (!tool) return;
          btn.addEventListener('click', ()=>{
            toolButtons.forEach(b=> b.classList.remove('active'));
            btn.classList.add('active');
            skTool = tool;
          });
        });

        const symSel = $('#skSymbol', skModal);
        if (symSel){
          symSel.addEventListener('change', (e)=>{
            skSymbolText = e.target.value || '';
            if (skSymbolText){
              skTool = 'symbol';
              toolButtons.forEach(b=> b.classList.remove('active'));
            }
          });
        }

        $('#skUndo', skModal).addEventListener('click', ()=>{
          skStack.pop();
          redrawSketch();
        });

        $('#skClear', skModal).addEventListener('click', ()=>{
          skStack.length = 0;
          setSketchBg(skBg);
        });

        $('#skNorth', skModal).addEventListener('click', ()=>{
          if (!skCanvas) return;
          const rect = skCanvas.getBoundingClientRect();
          const w = rect.width;
          const h = rect.height;
          const margin = 24;

          const p0 = { x: margin, y: margin + 40 };
          const p1 = { x: margin, y: margin };
          skStack.push({ type:'arrow', color:'#111827', size:3, pts:[p0,p1] });
          skStack.push({ type:'text', color:'#111827', size:4, pts:[{x:margin+10,y:margin+10}], text:'N' });

          const barLen = 80;
          const yBar   = h - margin;
          skStack.push({ type:'line', color:'#111827', size:3, pts:[{x:margin,y:yBar},{x:margin+barLen,y:yBar}] });
          skStack.push({ type:'text', color:'#111827', size:3, pts:[{x:margin,y:yBar-6}], text:'Échelle indicative' });

          redrawSketch();
        });

        function closeSketch(){
          if (!skModal) return;
          window.removeEventListener('mouseup', up);
          window.removeEventListener('touchend', up);
          skModal.remove();
          skModal = null;
          skCanvas = null;
          skCtx    = null;
        }

        $('#skSave', skModal).addEventListener('click', ()=>{
          if (!skCanvas) return;
          const dataUrl = skCanvas.toDataURL('image/png');
          const dpr = window.devicePixelRatio || 1;
          const rect = skCanvas.getBoundingClientRect();
          sketches.push({
            id:'sk'+Date.now(),
            dataUrl,
            w:rect.width * dpr,
            h:rect.height * dpr,
            label:'Croquis '+new Date().toLocaleString()
          });
          refreshPieces();
          alert('Croquis enregistré dans les pièces.');
        });

        $('#skClose', skModal).addEventListener('click', closeSketch);

        skCanvas.addEventListener('mousedown', down);
        skCanvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup',   up);
        skCanvas.addEventListener('touchstart', down, {passive:false});
        skCanvas.addEventListener('touchmove',  move, {passive:false});
        window.addEventListener('touchend', up);

        const obs = new ResizeObserver(resizeSketch);
        obs.observe($('.sketch-card', skModal));

        resizeSketch();
        setSketchBg('blank');
      }
      $('#btnSketch').addEventListener('click', openSketch);

      // Exports fiche
      $('#btnProcGJ').addEventListener('click', ()=>{
        const ll = map.getCenter();
        const props = {
          titre:$('#ftTitre').value, lieu:$('#ftLieu').value, desc:$('#ftDesc').value,
          iota:$('#ftRefIota').value, natinf:$('#ftRefNatinf').value, date:new Date().toISOString()
        };
        const gj = { type:'FeatureCollection', features:[{ type:'Feature', properties:props, geometry:{ type:'Point', coordinates:[ll.lng,ll.lat] } }]};
        const blob = new Blob([JSON.stringify(gj)], {type:'application/geo+json'});
        const url = URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href = url; a.download = 'fiche-terrain.geojson'; a.click();
        URL.revokeObjectURL(url);
      });

      // ===== VALIDATEUR IOTA (UI) =====
      function buildValParams(){
        const cont = $('#valParams'); cont.innerHTML = '';
        const rules = getRules();
        const selected = Array.from(SELECTED_IOTA);

        if (selected.length){
          selected.forEach(code=>{
            const def = rules[code];
            const box = document.createElement('div');
            box.style.border = '1px solid #e5e7eb';
            box.style.borderRadius = '8px';
            box.style.padding = '8px';
            box.style.marginBottom = '8px';

            const title = document.createElement('div');
            title.innerHTML = `<b>${code}</b> — ${(def?.label||'Paramètres')}`;
            title.style.marginBottom = '6px';
            box.appendChild(title);

            if (def?.params?.length){
              def.params.forEach(p=>{
                const wrap = document.createElement('div');
                const lab  = document.createElement('label');
                const inp  = document.createElement('input');
                lab.textContent = p.label;
                lab.style.fontSize = '13px';
                inp.type = p.type || 'text';
                inp.id   = `param_${code}_${p.id}`;
                inp.placeholder = p.label;
                wrap.appendChild(lab); wrap.appendChild(inp); box.appendChild(wrap);
              });
            } else {
              ['surface_m2','longueur_m'].forEach(fid=>{
                const wrap = document.createElement('div');
                const lab  = document.createElement('label');
                const inp  = document.createElement('input');
                lab.textContent = fid==='surface_m2' ? 'Surface (m²)' : 'Longueur (m)';
                lab.style.fontSize='13px';
                inp.type='number';

      $('#btnEval').addEventListener('click', ()=>{
        const rules = getRules();
        const selected = Array.from(SELECTED_IOTA);
        const traces = [];
        let globalReg = 'HN';

        function evalOne(code, paramPrefix=false){
          const def = rules[code];
          if (!def) return { reg:'HN', trace:'', hit:-1, ref:'' };

          const ctx={};
          (def.params||[]).forEach(p=>{
            const id = paramPrefix ? `param_${code}_${p.id}` : `param_${p.id}`;
            const el = document.getElementById(id);
            if (p.type === 'number'){
              const v = parseFloat(String(el?.value||'').replace(',','.'));
              ctx[p.id] = Number.isFinite(v) ? v : 0;
            } else {
              ctx[p.id] = String(el?.value||'').trim().toLowerCase();
            }
          });

          function safeEval(expr, ctx){
            const safe = String(expr)
              .replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, id => {
                if (!(id in ctx)) return id;
                const v = ctx[id];
                return (typeof v === 'string') ? JSON.stringify(v) : String(v ?? 0);
              })
              .replace(/[^0-9<>=!&|().+*\-\/ %"'a-zA-Z_]/g,'');
            try{ return !!eval(safe); }catch{ return false; }
          }

          let decision='HN', ref=''; let hitIndex=-1;
          for (let i=0; i<(def.logic||[]).length; i++){
            const rule = def.logic[i];
            if (rule.if){
              if (safeEval(rule.if, ctx)){ decision=rule.regime||'HN'; ref=rule.ref||''; hitIndex=i; break; }
            } else { decision=rule.else||'HN'; ref=rule.ref||''; hitIndex=i; break; }
          }

          const label = RESULT_LABELS[decision] || decision;
          const block = `
            <div style="border:1px dashed #e5e7eb;border-radius:8px;padding:8px;margin:6px 0">
              <div><b>${code}</b> — ${(def.label||'')}</div>
              ${buildHumanExplanation(def, ctx, def.logic, hitIndex, label, ref)}
            </div>`;
          return { reg:decision, trace:block, hit:hitIndex, ref };
        }

        if (selected.length){
          const regs = [];
          selected.forEach(code=>{
            const r = evalOne(code, true);
            regs.push(r.reg); traces.push(r.trace);
          });
          globalReg = mostRestrictive(regs);
          applyResultBadge(globalReg);
          $('#valTrace').innerHTML = traces.join('');
          if (!$('#ftRefIota').value) $('#ftRefIota').value = selected.join(', ');
          const sugg = [...new Set(selected.flatMap(c => natinfSuggestForIota(c).slice(0,3).map(x=>x.natinf)))];
          if (sugg.length && !$('#ftRefNatinf').value) $('#ftRefNatinf').value = sugg.join(', ');
          return;
        }

        const code = ($('#valRubrique').value||'').trim();
        if (!code || !rules[code]){ applyResultBadge('HN'); $('#valTrace').innerHTML = ''; return; }

        const r = evalOne(code, false);
        globalReg = r.reg;
        applyResultBadge(globalReg);
        $('#valTrace').innerHTML = r.trace;

        if (!$('#ftRefIota').value) $('#ftRefIota').value = code;
        const sugg = natinfSuggestForIota(code).slice(0,3).map(x=>x.natinf);
        if (sugg.length && !$('#ftRefNatinf').value) $('#ftRefNatinf').value = sugg.join(', ');
      });

      function buildHumanExplanation(def, ctx, logic, hitIndex, decisionLabel, ref){

        if (def.params?.length){

        if (Array.isArray(logic) && logic.length){

        return html;

    function computeLengthMeters(latlngs){
      if (latlngs.length<2) return 0;
      const line=turf.lineString(latlngs.map(ll=>[ll.lng,ll.lat]));
      return turf.length(line,{units:'kilometers'})*1000;
    }
    function computeAreaM2(latlngs){
      if (latlngs.length<3) return 0;
      const ring=[...latlngs.map(ll=>[ll.lng,ll.lat]), [latlngs[0].lng,latlngs[0].lat]];
      return turf.area(turf.polygon([ring]));
    }

    function fmtArea(m2){
      if (m2<10000) return `${m2.toFixed(0)} m²`;
      const ha=m2/10000; if (ha<100) return `${ha.toFixed(2)} ha`;
      return `${(m2/1e6).toFixed(3)} km²`;
    }
